name: Regresión funcional El Errante

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "functional-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  e2e:
    name: Playwright desktop y móvil
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Instalar dependencias
        run: npm install --no-audit --no-fund --prefer-offline
      - name: Instalar Chromium
        run: npx playwright install --with-deps chromium
      - name: Ejecutar regresión funcional
        run: npm run test:e2e
      - name: Conservar reporte solo ante fallo o ejecución manual
        if: failure() || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ github.sha }}
          path: |
            playwright-report
            test-results
          if-no-files-found: warn
          retention-days: 7
