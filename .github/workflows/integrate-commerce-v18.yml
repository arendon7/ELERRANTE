name: Integrar base de compra V1.8

on:
  push:
    branches: ["feat/experiencia-compra-v18"]
    paths:
      - ".github/workflows/integrate-commerce-v18.yml"

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/experiencia-compra-v18
          fetch-depth: 0

      - name: Integrar versión, caché y verificadores
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_required(path, old, new):
              file = Path(path)
              text = file.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'{path} no contiene marcador requerido: {old}')
              file.write_text(text.replace(old, new), encoding='utf-8')

          replace_required('assets/host-mode.js', 'PUBLIC_VERSION="1.7.0"', 'PUBLIC_VERSION="1.8.0"')
          replace_required('assets/host-mode.js', 'ACTIVE_CACHE="el-errante-v1-7-0"', 'ACTIVE_CACHE="el-errante-v1-8-0"')
          replace_required('assets/commerce-config-v14.js', 'version: "1.7.0"', 'version: "1.8.0"')
          replace_required('deploy-version.txt', 'version=1.7.0', 'version=1.8.0')
          replace_required('deploy-version.txt', 'cache=el-errante-v1-7-0', 'cache=el-errante-v1-8-0')
          replace_required('service-worker.js', "const CACHE = 'el-errante-v1-7-0';", "const CACHE = 'el-errante-v1-8-0';")
          replace_required('service-worker.js', "'./assets/content-v17.js','./assets/host-mode.js'", "'./assets/content-v17.js','./assets/commerce-ux-v18.js','./assets/host-mode.js'")
          replace_required('service-worker.js', "'./assets/commerce-v16.css','./assets/operations-v16.js'", "'./assets/commerce-v16.css','./assets/commerce-v18.css','./assets/operations-v16.js'")

          for path in (
              'scripts/verificar_release_v13.py',
              'scripts/verificar_operacion_v14.py',
              'scripts/verificar_backend_v15.py',
              'scripts/verificar_operacion_v16.py',
          ):
              replace_required(path, '1.7.0', '1.8.0')
              replace_required(path, 'v1-7-0', 'v1-8-0')

          replace_required('scripts/verificar_contenido_v17.py', 'PUBLIC_VERSION="1.7.0"', 'PUBLIC_VERSION="1.8.0"')
          replace_required('scripts/verificar_contenido_v17.py', 'el-errante-v1-7-0', 'el-errante-v1-8-0')
          replace_required('scripts/verificar_contenido_v17.py', 'version=1.7.0', 'version=1.8.0')
          replace_required(
              'tests/e2e/commerce-v14.spec.js',
              "heading', { name: 'Tu pedido comienza aquí.' }",
              "heading', { name: 'Confirma tu pedido con claridad.' }",
          )

          roadmap = Path('documentacion/ROADMAP_OPERACION_COMERCIAL_V14.md')
          text = roadmap.read_text(encoding='utf-8')
          marker = '## Iteración 5 — experiencia de compra V1.8'
          if marker not in text:
              text += '\n\n## Iteración 5 — experiencia de compra V1.8\n\n- Checkout guiado en tres pasos: datos, entrega y pago.\n- Total persistente y acceso rápido al formulario en móvil.\n- Copia segura de cuenta y llave; comprobante con nombre y peso visibles.\n- Estados honestos para carrito vacío, solicitud recibida y coordinación posterior.\n- Señales de confianza en Tienda y compra informada en las once fichas.\n- Sin promesas de disponibilidad, entrega o devolución no sustentadas.\n'
              roadmap.write_text(text, encoding='utf-8')
          PY

      - name: Validar integración
        shell: bash
        run: |
          set -euo pipefail
          node --check assets/commerce-ux-v18.js
          node --check assets/checkout-v15.js
          node --check assets/commerce-v14.js
          node --check service-worker.js
          python3 scripts/verificar_release_v13.py
          python3 scripts/verificar_operacion_v14.py
          python3 scripts/verificar_backend_v15.py
          python3 scripts/verificar_operacion_v16.py
          python3 scripts/verificar_contenido_v17.py
          python3 scripts/verificar_experiencia_compra_v18.py

      - name: Consolidar base V1.8
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/host-mode.js assets/commerce-config-v14.js deploy-version.txt service-worker.js scripts tests/e2e/commerce-v14.spec.js documentacion/ROADMAP_OPERACION_COMERCIAL_V14.md
          git commit -m 'feat(commerce): integra base de experiencia V1.8'
          git push origin HEAD:feat/experiencia-compra-v18

# retry after protected workflows were aligned directly
