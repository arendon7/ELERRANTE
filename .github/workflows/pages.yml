name: Validar y publicar El Errante

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  validate:
    name: Regresión integral V3.1.1 · Operación V3.3.0 · Finanzas V3.2.9
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Materializar fuentes y superficie ejecutable
        run: |
          python3 scripts/materializar_fuentes_locales_v28.py
          python3 scripts/preparar_sitio_materializado_v28.py --output .local_site
      - name: Ejecutar barreras vigentes
        run: |
          python3 verificar_demo.py
          python3 scripts/verificar_canon_marca_v28.py
          python3 scripts/verificar_activos_hq_v28.py
          python3 scripts/verificar_modulos_v28.py
          python3 scripts/verificar_v30_separacion.py
          python3 scripts/verificar_v31_interno.py
          python3 scripts/verificar_release_v31.py
          python3 scripts/verificar_master_data_v10.py
          python3 scripts/verificar_master_cost_proposals_v11.py
          python3 scripts/verificar_master_cost_materialization_v12.py
          for test in scripts/verificar_oferta_v09.py scripts/verificar_studio_oferta_v09.py scripts/verificar_actas_oferta_v09.py scripts/verificar_paquete_aire_tiempo_v09.py; do python3 "$test"; done
      - name: Validar JavaScript fuente y materializado
        run: |
          find assets -maxdepth 1 -type f -name '*.js' -print0 | xargs -0 -n1 node --check
          find assets/generated -maxdepth 1 -type f -name '*.js' -print0 | xargs -0 -n1 node --check
          find .local_site/assets -maxdepth 1 -type f -name '*.js' -print0 | xargs -0 -n1 node --check
          find .local_site/assets/generated -maxdepth 1 -type f -name '*.js' -print0 | xargs -0 -n1 node --check
          node --check service-worker.js
          node --check .local_site/service-worker.js
          node --check scripts/exportar-fuente-canonica.mjs
          find tests/e2e -maxdepth 1 -type f -name '*.spec.js' -print0 | xargs -0 -n1 node --check
      - name: Reconstruir fuente canónica efectiva
        run: node scripts/exportar-fuente-canonica.mjs --output=.artifacts/canonical
      - name: Conservar auditoría
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fuente-canonica-${{ github.sha }}
          path: |
            .artifacts/canonical
            assets/generated/manifest-v28.json
            .local_site/materialized-site-v28.json
          if-no-files-found: warn
          retention-days: 14

  deploy:
    name: Publicar GitHub Pages V3.1.1
    if: github.event_name != 'pull_request'
    needs: validate
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Construir superficie materializada
        run: |
          python3 scripts/materializar_fuentes_locales_v28.py
          python3 scripts/preparar_sitio_materializado_v28.py --output _site
      - name: Configurar entorno público
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          set -euo pipefail
          if { [ -n "${SUPABASE_URL:-}" ] && [ -z "${SUPABASE_PUBLISHABLE_KEY:-}" ]; } || { [ -z "${SUPABASE_URL:-}" ] && [ -n "${SUPABASE_PUBLISHABLE_KEY:-}" ]; }; then echo "SUPABASE_URL y SUPABASE_PUBLISHABLE_KEY deben configurarse juntas."; exit 1; fi
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          url=os.environ.get('SUPABASE_URL','').strip(); key=os.environ.get('SUPABASE_PUBLISHABLE_KEY','').strip()
          config={'environment':'connected' if url and key else 'preview','backend':{'provider':'supabase','url':url,'publishableKey':key,'receiptBucket':'payment-receipts','shopperStorageKey':'ee-shopper-auth-v15','adminStorageKey':'ee-admin-auth-v15'}}
          Path('_site/assets/commerce-runtime-config.js').write_text('window.EL_ERRANTE_RUNTIME_CONFIG = Object.freeze('+json.dumps(config,ensure_ascii=False,separators=(',',':'))+');\n',encoding='utf-8')
          PY
          printf 'EL ERRANTE PUBLIC RELEASE\nrelease_version=3.1.1\nprevious_release_version=3.1.0\nversion=2.8.0\ndeploy_source=main\nrelease_commit=%s\ncache=el-errante-v2-8-brand-canon-2\nbrand_source=assets/brand-canon-v28.js\ncontent_source=v2.9-editorial\ninternal_architecture=v3.1-acceso-operacion-finanzas\nsession_shell=v3.1.1\ncontrol_engine=v3.0\noperation_module=v3.3.0\nmaster_data_governance_core=v1.0.0\nmaster_data_module=v1.2.0\nmaster_cost_proposals=v1.1.0\nmaster_cost_materialization=v1.2.0\nmfo_baseline=v3.0-schema-mfo-v3.3\nfinance_workbench_core=v3.1.0\nfinance_module=v3.2.9\nfinance_demo=v3.2.9\nsource_mode=materialized-no-base64-runtime\nupdated=%s\n' "$GITHUB_SHA" "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" > _site/deploy-version.txt
          touch _site/.nojekyll
      - name: Verificar artefacto publicable
        run: |
          set -euo pipefail
          grep -q '^release_version=3.1.1$' _site/deploy-version.txt
          grep -q '^previous_release_version=3.1.0$' _site/deploy-version.txt
          grep -q '^version=2.8.0$' _site/deploy-version.txt
          grep -q '^cache=el-errante-v2-8-brand-canon-2$' _site/deploy-version.txt
          grep -q '^internal_architecture=v3.1-acceso-operacion-finanzas$' _site/deploy-version.txt
          grep -q '^session_shell=v3.1.1$' _site/deploy-version.txt
          grep -q '^control_engine=v3.0$' _site/deploy-version.txt
          grep -q '^operation_module=v3.3.0$' _site/deploy-version.txt
          grep -q '^master_data_governance_core=v1.0.0$' _site/deploy-version.txt
          grep -q '^master_data_module=v1.2.0$' _site/deploy-version.txt
          grep -q '^master_cost_proposals=v1.1.0$' _site/deploy-version.txt
          grep -q '^master_cost_materialization=v1.2.0$' _site/deploy-version.txt
          grep -q '^finance_workbench_core=v3.1.0$' _site/deploy-version.txt
          grep -q '^finance_module=v3.2.9$' _site/deploy-version.txt
          grep -q '^finance_demo=v3.2.9$' _site/deploy-version.txt
          grep -q '^source_mode=materialized-no-base64-runtime$' _site/deploy-version.txt
          grep -q "^release_commit=${GITHUB_SHA}$" _site/deploy-version.txt
          grep -q '"mode": "materialized-no-base64-runtime"' _site/materialized-site-v28.json
          grep -q 'assets/generated/data-v28.js' _site/index.html
          grep -q 'assets/generated/app-v28.js' _site/index.html
          grep -q 'assets/generated/preprod-v28.js' _site/index.html
          ! grep -q 'src="assets/data.js"' _site/index.html
          ! grep -q 'src="assets/app.js"' _site/index.html
          ! grep -q 'src="assets/preprod.js"' _site/index.html
          test ! -e _site/assets/source
          test ! -e _site/assets/chunks
          test ! -e _site/assets/data.js
          test ! -e _site/assets/app.js
          test ! -e _site/assets/preprod.js
          test ! -e _site/archive
          test -s _site/assets/generated/data-v28.js
          test -s _site/assets/generated/app-v28.js
          test -s _site/assets/generated/preprod-v28.js
          grep -q '"version": "2.8.0"' _site/assets/generated/manifest-v28.json
          grep -q '· V2.8' _site/admin.html
          grep -q 'assets/finance-v27.js' _site/admin.html
          grep -q 'assets/procurement-v25.js' _site/admin.html
          test -s _site/acceso.html
          grep -q 'id="access-v31"' _site/acceso.html
          grep -q 'Elige dónde quieres trabajar.' _site/centro-interno.html
          grep -q 'Abrir Panel de control' _site/centro-interno.html
          grep -q 'Entrar a Operación' _site/centro-interno.html
          grep -q 'data-v31-protected' _site/control.html
          grep -q 'assets/internal-shell-v31.js' _site/control.html
          grep -q 'Ir a Operación' _site/control.html
          grep -q 'Ir a Finanzas' _site/control.html
          grep -q 'id="control-v30"' _site/control.html
          grep -q 'href="control.html"' _site/operacion.html
          grep -q 'id="control-v30"' _site/operacion.html
          grep -q 'id="daily-ops-v21"' _site/operacion.html
          grep -q 'id="operational-evidence-v330"' _site/operacion.html
          grep -q 'assets/operational-evidence-v330.js' _site/operacion.html
          grep -q 'href="control.html"' _site/finanzas.html
          grep -q 'id="finance-workbench-v31"' _site/finanzas.html
          grep -q 'assets/finance-workbench-v31.js' _site/finanzas.html
          grep -q 'assets/finance-starter-v31.js' _site/finanzas.html
          grep -q 'assets/finance-demo-v329.js' _site/finanzas.html
          ! grep -q 'assets/production-v22.js' _site/finanzas.html
          grep -q 'data-v31-protected' _site/studio.html
          grep -q 'assets/internal-shell-v31.js' _site/studio.html
          grep -q 'id="master-data-v10"' _site/studio.html
          grep -q 'assets/master-data-v10.js?v=1.0.0' _site/studio.html
          grep -q 'id="master-cost-proposals-v11"' _site/studio.html
          grep -q 'assets/master-cost-proposals-v11.js?v=1.1.0' _site/studio.html
          grep -q 'assets/master-cost-proposals-v11.css?v=1.1.0' _site/studio.html
          grep -q 'id="master-cost-materialization-v12"' _site/studio.html
          grep -q 'assets/master-cost-materialization-v12.js?v=1.2.0' _site/studio.html
          grep -q 'assets/master-cost-materialization-v12.css?v=1.2.0' _site/studio.html
          grep -q 'assets/materials-data-v23.js' _site/studio.html
          grep -q 'data-v31-protected' _site/actas.html
          grep -q 'assets/internal-shell-v31.js' _site/actas.html
          grep -q "const VERSION='3.1.1'" _site/assets/access-v31.js
          grep -q "const VERSION='3.1.1'" _site/assets/internal-shell-v31.js
          grep -q "'studio.html':new Set" _site/assets/access-v31.js
          grep -q "'actas.html':new Set" _site/assets/access-v31.js
          grep -q "'#evidencia'" _site/assets/access-v31.js
          grep -q "const VERSION='1.0.0'" _site/assets/master-data-v10.js
          grep -q 'ee_v10_master_governance' _site/assets/master-data-v10.js
          grep -q 'ee_v24_material_purchases' _site/assets/master-data-v10.js
          grep -q "const VERSION='1.1.0'" _site/assets/master-cost-proposals-v11.js
          grep -q "EVENTS_KEY='ee_v11_cost_proposal_events'" _site/assets/master-cost-proposals-v11.js
          grep -q 'APPROVED_FOR_MATERIALIZATION' _site/assets/master-cost-proposals-v11.js
          ! grep -q 'applyProposal' _site/assets/master-cost-proposals-v11.js
          grep -q "const VERSION='1.2.0'" _site/assets/master-cost-materialization-v12.js
          grep -q "EVENTS_KEY='ee_v12_cost_materialization_events'" _site/assets/master-cost-materialization-v12.js
          grep -q 'materializeProposal' _site/assets/master-cost-materialization-v12.js
          grep -q 'effectiveStandardCost' _site/assets/master-cost-materialization-v12.js
          grep -q 'Propuesta obsoleta' _site/assets/master-cost-materialization-v12.js
          grep -q "importScripts('./assets/brand-canon-v28.js')" _site/service-worker.js
          grep -q './acceso.html' _site/service-worker.js
          grep -q './studio.html' _site/service-worker.js
          grep -q './actas.html' _site/service-worker.js
          grep -q './assets/access-v31.js' _site/service-worker.js
          grep -q './assets/internal-shell-v31.js' _site/service-worker.js
          grep -q './assets/master-cost-proposals-v11.js' _site/service-worker.js
          grep -q './assets/master-cost-proposals-v11.css' _site/service-worker.js
          grep -q "endsWith('/assets/master-cost-proposals-v11.js')" _site/service-worker.js
          grep -q "endsWith('/assets/master-cost-proposals-v11.css')" _site/service-worker.js
          grep -q './assets/master-cost-materialization-v12.js' _site/service-worker.js
          grep -q './assets/master-cost-materialization-v12.css' _site/service-worker.js
          grep -q "endsWith('/assets/master-cost-materialization-v12.js')" _site/service-worker.js
          grep -q "endsWith('/assets/master-cost-materialization-v12.css')" _site/service-worker.js
          grep -q './assets/operational-evidence-v330.js' _site/service-worker.js
          grep -q './assets/finance-workbench-v31.js' _site/service-worker.js
          grep -q './assets/finance-starter-v31.js' _site/service-worker.js
          grep -q './assets/finance-demo-v329.js' _site/service-worker.js
          grep -q './assets/internal-v31.css' _site/service-worker.js
          node --check _site/assets/generated/data-v28.js
          node --check _site/assets/generated/app-v28.js
          node --check _site/assets/generated/preprod-v28.js
          node --check _site/assets/data-finalize-v28.js
          node --check _site/assets/app-contract-v28.js
          node --check _site/assets/preprod-contract-v28.js
          node --check _site/assets/control-v30.js
          node --check _site/assets/access-v31.js
          node --check _site/assets/internal-shell-v31.js
          node --check _site/assets/operational-evidence-v330.js
          node --check _site/assets/master-data-v10.js
          node --check _site/assets/master-cost-proposals-v11.js
          node --check _site/assets/master-cost-materialization-v12.js
          node --check _site/assets/finance-workbench-v31.js
          node --check _site/assets/finance-starter-v31.js
          node --check _site/assets/finance-demo-v329.js
          node --check _site/service-worker.js
          ! grep -qi 'service_role' _site/assets/commerce-runtime-config.js
          ! grep -qi 'service_role' _site/assets/access-v31.js
          ! grep -qi 'service_role' _site/assets/master-data-v10.js
          ! grep -qi 'service_role' _site/assets/master-cost-proposals-v11.js
          ! grep -qi 'service_role' _site/assets/master-cost-materialization-v12.js
          ! grep -qi 'service_role' _site/assets/finance-workbench-v31.js
          ! grep -qi 'service_role' _site/assets/finance-starter-v31.js
          ! grep -qi 'service_role' _site/assets/finance-demo-v329.js
          ! grep -qi 'service_role' _site/assets/operational-evidence-v330.js
          test "$(find _site/assets/images/brand-final -maxdepth 1 -name '*.webp' | wc -l)" -ge 23
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4