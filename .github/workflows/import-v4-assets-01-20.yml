name: Importar assets V4 01-20

on:
  push:
    branches:
      - feature/v4-utility-system-v2
    paths:
      - .github/workflows/import-v4-assets-01-20.yml

permissions:
  contents: write

jobs:
  import-assets:
    if: github.event.head_commit.message == 'chore(v4): stage automated asset import'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout rama V4
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Descargar paquete aprobado
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 --retry-delay 2 \
            'https://drive.google.com/uc?export=download&id=1gEKN9d0ASMj5QkCBna7xBnQMoiP3rdmI' \
            -o /tmp/ELERRANTE_V4_ASSETS_01_20.zip
          unzip -t /tmp/ELERRANTE_V4_ASSETS_01_20.zip >/dev/null

      - name: Extraer únicamente los 20 WebP individuales
        shell: bash
        run: |
          set -euo pipefail
          unzip -o /tmp/ELERRANTE_V4_ASSETS_01_20.zip \
            'assets/images/brand-v4/generated-01-20/*.webp' \
            -d .
          test "$(find assets/images/brand-v4/generated-01-20 -maxdepth 1 -type f -name '*.webp' | wc -l | tr -d ' ')" = '20'

      - name: Verificar integridad contra manifiesto
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json
          from pathlib import Path

          root = Path('assets/images/brand-v4/generated-01-20')
          manifest = json.loads((root / 'manifest.json').read_text(encoding='utf-8'))
          assets = manifest['assets']
          assert len(assets) == 20, f'Esperaba 20 assets, encontré {len(assets)}'
          for item in assets:
              path = root / item['file']
              if not path.is_file():
                  raise SystemExit(f'Falta {path}')
              digest = hashlib.sha256(path.read_bytes()).hexdigest()
              if digest != item['sha256']:
                  raise SystemExit(f'SHA256 inválido para {path.name}: {digest}')
              if path.stat().st_size < 50000:
                  raise SystemExit(f'Archivo sospechosamente pequeño: {path.name} ({path.stat().st_size} bytes)')
          print('Integridad V4 01-20 OK')
          PY

      - name: Confirmar que los collages rechazados no entraron
        shell: bash
        run: |
          set -euo pipefail
          ! find assets/images/brand-v4/generated-01-20 -type f \( \
            -name 'a_clean_product_branding_portfolio_collage_a_grid.png' -o \
            -name 'a_large_composite_grid_image_10_thumbnails_in_a_2.png' -o \
            -name 'a_clean_high_resolution_flat_presentation_image.png' -o \
            -name 'a_wide_gallery_brand_guideline_style_collage_image.png' \
          \) | grep -q .

      - name: Commit binario en la rama V4
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/images/brand-v4/generated-01-20/*.webp
          if git diff --cached --quiet; then
            echo 'Los assets ya estaban presentes; no hay cambios.'
            exit 0
          fi
          git commit -m 'feat(v4): import approved generated assets 01-20'
          git push origin "HEAD:${GITHUB_REF_NAME}"
