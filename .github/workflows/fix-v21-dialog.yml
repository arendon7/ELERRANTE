name: Estabilizar diálogo V2.1

on:
  push:
    branches: ["feat/operacion-diaria-v21-final"]
    paths:
      - ".github/workflows/fix-v21-dialog.yml"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/operacion-diaria-v21-final
          fetch-depth: 0
      - name: Bloquear reconstrucciones mientras se revisa un pedido
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace(path,old,new):
              file=Path(path)
              text=file.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'{path} no contiene el bloque esperado: {old[:120]!r}')
              file.write_text(text.replace(old,new,1),encoding='utf-8')

          path='assets/daily-ops-v21.js'
          replace(path,
            "  let renderGeneration=0;\n",
            "  let renderGeneration=0;\n  let dialogOpen=false;\n")
          replace(path,
            "  async function render(){\n    const generation=++renderGeneration;",
            "  async function render(){\n    if(dialogOpen)return;\n    const generation=++renderGeneration;")
          replace(path,
            "      const orders=await loadOrders();\n      if(generation!==renderGeneration)return;",
            "      const orders=await loadOrders();\n      if(dialogOpen||generation!==renderGeneration)return;")
          replace(path,
            "          const order=orders.find(item=>item.id===open.dataset.v21Open);if(!order)return;\n          content.innerHTML=detailsHtml(order);dialog.showModal();\n          content.querySelector('.ee-v21-close').addEventListener('click',()=>dialog.close());",
            "          const order=orders.find(item=>item.id===open.dataset.v21Open);if(!order)return;\n          dialogOpen=true;\n          content.innerHTML=detailsHtml(order);\n          try{dialog.showModal();}catch(error){dialogOpen=false;throw error;}\n          content.querySelector('.ee-v21-close').addEventListener('click',()=>dialog.close());")
          replace(path,
            "              if(changed){dialog.close();setMessage('Estado actualizado y operación recalculada.');setTimeout(render,220);}",
            "              if(changed){dialogOpen=false;dialog.close();setMessage('Estado actualizado y operación recalculada.');setTimeout(render,220);}")
          replace(path,
            "      dialog.addEventListener('click',event=>{if(event.target===dialog)dialog.close();});\n      document.documentElement.dataset.dailyOpsVersion='2.1.0';",
            "      dialog.addEventListener('click',event=>{if(event.target===dialog)dialog.close();});\n      dialog.addEventListener('close',()=>{const wasOpen=dialogOpen;dialogOpen=false;if(wasOpen)setTimeout(render,0);});\n      document.documentElement.dataset.dailyOpsVersion='2.1.0';")

          test=Path('tests/e2e/daily-ops-v21.spec.js')
          text=test.read_text(encoding='utf-8')
          text=text.replace(
            "    const dialogBox=page.locator('#ee-v21-dialog');\n    await expect(dialogBox.getByText('Carrera 70 # 10-20')).toBeVisible();",
            "    const dialogBox=page.locator('#ee-v21-dialog');\n    await expect(dialogBox).toBeVisible();\n    await expect(dialogBox.getByText('Carrera 70 # 10-20')).toBeVisible();",1)
          text=text.replace(
            "    await desk.locator('[data-v21-order=\"EE-20260805-DIARIA\"]').getByRole('button',{name:'Abrir pedido'}).click();\n    await expect(page.locator('#ee-v21-dialog').getByRole('button',{name:'Aprobar pago'})).toBeDisabled();",
            "    await desk.locator('[data-v21-order=\"EE-20260805-DIARIA\"]').getByRole('button',{name:'Abrir pedido'}).click();\n    const dialogBox=page.locator('#ee-v21-dialog');\n    await expect(dialogBox).toBeVisible();\n    await expect(dialogBox.getByRole('button',{name:'Aprobar pago'})).toBeDisabled();",1)
          test.write_text(text,encoding='utf-8')

          verifier=Path('scripts/verificar_operacion_diaria_v21.py')
          text=verifier.read_text(encoding='utf-8')
          marker="require('assets/daily-ops-v21.js','compactLegacyOrders','La tabla heredada de pedidos no se sustituye')\n"
          if marker not in text:
              raise SystemExit('No se encontró marcador de mesa compacta')
          if 'dialogOpen' not in text:
              text=text.replace(marker,marker+"require('assets/daily-ops-v21.js','dialogOpen','El diálogo no está protegido frente a reconstrucciones concurrentes')\n",1)
          verifier.write_text(text,encoding='utf-8')
          PY
      - name: Validar corrección
        run: |
          node --check assets/daily-ops-v21.js
          node --check tests/e2e/daily-ops-v21.spec.js
          python3 scripts/verificar_operacion_diaria_v21.py
      - name: Consolidar corrección
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/daily-ops-v21.js tests/e2e/daily-ops-v21.spec.js scripts/verificar_operacion_diaria_v21.py
          git commit -m 'fix(ops): estabiliza ficha de pedido ante renders concurrentes'
          git push origin HEAD:feat/operacion-diaria-v21-final
