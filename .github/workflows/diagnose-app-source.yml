name: Diagnosticar fuente de aplicación

on:
  pull_request:
    branches: ["main"]
    paths:
      - ".github/workflows/diagnose-app-source.yml"
      - "assets/chunks/app-*.txt"
      - "assets/app.js"
  push:
    branches: ["fix/v0.6.7-health-truth"]
    paths:
      - ".github/workflows/diagnose-app-source.yml"
      - "assets/chunks/app-*.txt"
      - "assets/app.js"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    name: Integridad de app.js
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruir fuente y generar informe
        shell: bash
        run: |
          mkdir -p .app-diagnostic
          python3 - <<'PY'
          from pathlib import Path
          import base64, hashlib, json

          root=Path('.')
          names=[f'app-{i:03d}.txt' for i in range(1,9)]
          blocks=[]
          report={'chunks':[], 'markers':{}}
          for name in names:
              path=root/'assets/chunks'/name
              encoded=path.read_text(encoding='utf-8').strip()
              raw=base64.b64decode(encoded, validate=True)
              blocks.append(raw)
              report['chunks'].append({
                  'name':name,
                  'base64_chars':len(encoded),
                  'bytes':len(raw),
                  'sha256':hashlib.sha256(raw).hexdigest(),
                  'padding':len(encoded)-len(encoded.rstrip('=')),
              })
          joined=b''.join(blocks)
          source=joined.decode('utf-8', errors='strict')
          (root/'.app-diagnostic/app-reconstructed.js').write_text(source,encoding='utf-8')
          for marker in ('[... ELLIPSIZATION ...]','ELLIPSIZATION'):
              positions=[]
              start=0
              while True:
                  pos=source.find(marker,start)
                  if pos<0: break
                  positions.append(pos)
                  start=pos+1
              report['markers'][marker]=positions[:50]
          report['total_bytes']=len(joined)
          report['source_chars']=len(source)
          report['source_sha256']=hashlib.sha256(joined).hexdigest()
          (root/'.app-diagnostic/report.json').write_text(json.dumps(report,indent=2),encoding='utf-8')
          lines=['# Diagnóstico de app.js','',f'- Bytes: {len(joined)}',f'- SHA-256: `{report["source_sha256"]}`','']
          for item in report['chunks']:
              lines.append(f'- `{item["name"]}`: {item["bytes"]} bytes · padding {item["padding"]} · `{item["sha256"]}`')
          lines+=['','## Marcadores',json.dumps(report['markers'],indent=2)]
          (root/'.app-diagnostic/report.md').write_text('\n'.join(lines),encoding='utf-8')
          PY

      - name: Validar sintaxis JavaScript
        run: |
          node --check .app-diagnostic/app-reconstructed.js 2>&1 | tee .app-diagnostic/node-check.txt

      - name: Conservar diagnóstico
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-source-diagnostic-${{ github.sha }}
          path: .app-diagnostic
          if-no-files-found: error
          retention-days: 14
