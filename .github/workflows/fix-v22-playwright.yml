name: Corregir contratos Playwright V2.2

on:
  push:
    branches: ["feat/produccion-despacho-v22"]

permissions:
  contents: write

jobs:
  corregir:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/produccion-despacho-v22
      - name: Corregir activación, guardia y selectores
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              target=Path(path)
              text=target.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'No se encontró en {path}: {old}')
              target.write_text(text.replace(old,new),encoding='utf-8')

          path=Path('tests/e2e/activation-v20.spec.js')
          text=path.read_text(encoding='utf-8')
          text=text.replace('Activación operativa V2.1','Activación operativa V2.2')
          text=text.replace("'data-activation-version', '2.1.0'","'data-activation-version', '2.2.0'")
          text=text.replace("name: 'Activación V2.1'","name: 'Activación V2.2'")
          path.write_text(text,encoding='utf-8')

          path=Path('assets/admin-v15.js')
          text=path.read_text(encoding='utf-8')
          text=text.replace('Administración V2.1','Administración V2.2')
          text=text.replace('V1.4, V1.5, V1.6, V1.9, V2.0 y V2.1.','V1.4, V1.5, V1.6, V1.9, V2.0, V2.1 y V2.2.')
          path.write_text(text,encoding='utf-8')

          replace(
              'assets/production-v22.js',
              "    const dialog=document.querySelector('#ee-v21-dialog-content');\n    if(dialog)new MutationObserver(syncLegacyDispatchGuard).observe(dialog,{childList:true,subtree:true});",
              "    const daily=document.querySelector('#daily-ops-v21');\n    if(daily)new MutationObserver(()=>queueMicrotask(syncLegacyDispatchGuard)).observe(daily,{childList:true,subtree:true});"
          )

          path=Path('tests/e2e/production-v22.spec.js')
          text=path.read_text(encoding='utf-8')
          text=text.replace("await expect(board.locator('[data-v22-product=\"la-errante\"]')).toContainText('3');","await expect(board.locator('[data-v22-product=\"la-errante\"] td').nth(3)).toHaveText('3');")
          text=text.replace("await expect(board.locator('[data-v22-product=\"salsa\"]')).toContainText('2');","await expect(board.locator('[data-v22-product=\"salsa\"] td').nth(3)).toHaveText('2');")
          path.write_text(text,encoding='utf-8')
          PY
          node --check assets/admin-v15.js
          node --check assets/production-v22.js
          node --check tests/e2e/activation-v20.spec.js
          node --check tests/e2e/production-v22.spec.js
          python3 scripts/verificar_activacion_v20.py
          python3 scripts/verificar_produccion_v22.py
      - name: Guardar corrección
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/admin-v15.js assets/production-v22.js tests/e2e/activation-v20.spec.js tests/e2e/production-v22.spec.js
          git commit -m "fix(v22): estabiliza guardia de despacho y pruebas"
          git push origin HEAD:feat/produccion-despacho-v22
