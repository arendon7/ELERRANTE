name: Validar y publicar El Errante
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: "pages-${{ github.ref }}"
  cancel-in-progress: true
jobs:
  validate:
    name: Regresión integral
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
      - name: Materializar fallback visual legado
        run: python3 scripts/materializar_activos_visuales.py
      - name: Ejecutar barrera de publicación V1.3 HQ
        run: python3 scripts/verificar_release_v13.py
      - name: Validar operación comercial V1.4
        run: python3 scripts/verificar_operacion_v14.py
      - name: Validar backend y acceso privado V1.5
        run: python3 scripts/verificar_backend_v15.py
      - name: Validar operación y finanzas V1.6
        run: python3 scripts/verificar_operacion_v16.py
      - name: Validar contenido y conversión V1.7
        run: python3 scripts/verificar_contenido_v17.py
      - name: Validar experiencia de compra V1.8
        run: python3 scripts/verificar_experiencia_compra_v18.py
      - name: Validar matriz maestra de oferta
        run: python3 scripts/verificar_oferta_v09.py
      - name: Validar Studio de Oferta
        run: |
          python3 scripts/verificar_studio_oferta_v09.py
          node --check assets/offer-studio-v09.js
          node --check assets/offer-governance-v09.js
      - name: Validar sesiones, actas y comité
        run: |
          python3 scripts/verificar_actas_oferta_v09.py
          python3 scripts/verificar_paquete_aire_tiempo_v09.py
          node --check assets/offer-acts-preflight-v09.js
          node --check assets/offer-acts-v09.js
          node --check assets/aire-tiempo-committee-v09.js
      - name: Validar sistema visual y comercial
        shell: bash
        run: |
          node --check assets/host-mode.js
          node --check assets/commerce-v14.js
          node --check assets/commerce-config-v14.js
          node --check assets/checkout-v15.js
          node --check assets/admin-v15.js
          node --check assets/operations-v16.js
          node --check assets/content-v17.js
          node --check assets/commerce-ux-v18.js
          node --check service-worker.js
          test -s assets/commerce-v18.css
          test "$(find assets/images/brand-final -maxdepth 1 -name '*.webp' | wc -l)" -eq 24
          grep -q '"version": "1.3.0"' assets/images/brand-final/manifest-hq-v13.json
          grep -q '"unique_assets": 23' assets/images/brand-final/manifest-hq-v13.json
          ! cmp -s assets/images/brand-final/home-hero.webp assets/images/brand-final/home-hero-mobile.webp
      - name: Reconstruir fuente canónica efectiva
        run: node scripts/exportar-fuente-canonica.mjs --output=.artifacts/canonical
      - name: Publicar fuente o diagnóstico para auditoría
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fuente-canonica-${{ github.sha }}
          path: .artifacts/canonical
          if-no-files-found: warn
          retention-days: 14
  deploy:
    name: Publicar GitHub Pages
    if: github.event_name != 'pull_request'
    needs: validate
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
      - name: Materializar fallback visual legado
        run: python3 scripts/materializar_activos_visuales.py
      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
      - name: Preparar sitio desde main
        shell: bash
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          set -euo pipefail
          mkdir -p _site
          rsync -av ./ _site/ \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude '_site/' \
            --exclude '__pycache__/' \
            --exclude '.artifacts/' \
            --exclude 'node_modules/' \
            --exclude 'test-results/' \
            --exclude 'playwright-report/' \
            --exclude 'ELERRANTE_PAQUETE_VISUAL_V1_10.zip' \
            --exclude 'assets/brand-final-editorial.js' \
            --exclude 'assets/brand-final-products-a.js' \
            --exclude 'assets/brand-final-products-b.js' \
            --exclude 'assets/brand-final-products-c.js'
          if { [ -n "${SUPABASE_URL:-}" ] && [ -z "${SUPABASE_PUBLISHABLE_KEY:-}" ]; } || { [ -z "${SUPABASE_URL:-}" ] && [ -n "${SUPABASE_PUBLISHABLE_KEY:-}" ]; }; then
            echo "SUPABASE_URL y SUPABASE_PUBLISHABLE_KEY deben configurarse juntas."
            exit 1
          fi
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          url = os.environ.get('SUPABASE_URL','').strip()
          key = os.environ.get('SUPABASE_PUBLISHABLE_KEY','').strip()
          config = {
              'environment': 'connected' if url and key else 'preview',
              'backend': {
                  'provider': 'supabase',
                  'url': url,
                  'publishableKey': key,
                  'receiptBucket': 'payment-receipts',
                  'shopperStorageKey': 'ee-shopper-auth-v15',
                  'adminStorageKey': 'ee-admin-auth-v15',
              },
          }
          output = 'window.EL_ERRANTE_RUNTIME_CONFIG = Object.freeze(' + json.dumps(config, ensure_ascii=False, separators=(',',':')) + ');\n'
          Path('_site/assets/commerce-runtime-config.js').write_text(output, encoding='utf-8')
          PY
          printf 'EL ERRANTE PUBLIC RELEASE\nversion=1.8.0\ndeploy_source=main\nrelease_commit=%s\ncache=el-errante-v1-8-0\nupdated=%s\n' "$GITHUB_SHA" "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" > _site/deploy-version.txt
          touch _site/.nojekyll
      - name: Verificar artefacto publicable
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'version=1.8.0' _site/deploy-version.txt
          grep -q 'cache=el-errante-v1-8-0' _site/deploy-version.txt
          grep -q "release_commit=${GITHUB_SHA}" _site/deploy-version.txt
          grep -q 'Masa · Fuego · Territorio' _site/index.html
          for page in equipo admin control operacion studio actas presentacion checkout; do test -f "_site/${page}.html"; done
          test "$(find _site/assets/images/brand-final -maxdepth 1 -name '*.webp' | wc -l)" -eq 24
          grep -q '"version": "1.3.0"' _site/assets/images/brand-final/manifest-hq-v13.json
          grep -q '"unique_assets": 23' _site/assets/images/brand-final/manifest-hq-v13.json
          for asset in home-hero home-hero-mobile home-masa-fuego home-fermentacion home-ingredientes home-compartir home-en-casa home-despensa evento-hero evento-noche evento-operacion evento-servicio og-el-errante producto-harina producto-crea-tuya producto-margherita producto-diavola producto-bosque producto-cuatro-quesos producto-la-errante producto-salsa-tomate producto-reduccion-balsamica producto-panela-maracuya producto-combo-primera-ruta; do test -s "_site/assets/images/brand-final/${asset}.webp"; done
          test ! -f _site/assets/brand-final-editorial.js
          test ! -f _site/assets/brand-final-products-a.js
          test ! -f _site/assets/brand-final-products-b.js
          test ! -f _site/assets/brand-final-products-c.js
          grep -q 'el-errante-v1-8-0' _site/service-worker.js
          grep -q 'PUBLIC_VERSION="1.8.0"' _site/assets/host-mode.js
          grep -q 'brand-final-hq' _site/assets/host-mode.js
          grep -q 'home-hero-mobile.webp' _site/assets/host-mode.js
          grep -q 'checkout-v15.js' _site/checkout.html
          grep -q 'admin-v15.js' _site/admin.html
          grep -q 'operations-v16.js' _site/admin.html
          grep -q 'Operación y finanzas · V1.6' _site/admin.html
          ! grep -q 'assets/commerce-v14.js' _site/admin.html
          grep -q 'assets/checkout-v15.js' _site/service-worker.js
          grep -q 'assets/admin-v15.js' _site/service-worker.js
          grep -q 'assets/operations-v16.js' _site/service-worker.js
          grep -q 'assets/content-v17.js' _site/service-worker.js
          grep -q 'assets/commerce-ux-v18.js' _site/service-worker.js
          grep -q 'assets/commerce-v18.css' _site/service-worker.js
          for page in index tienda producto historia en-casa en-movimiento; do grep -q 'assets/content-v17.js' "_site/${page}.html"; done
          for page in tienda producto checkout; do grep -q 'assets/commerce-ux-v18.js' "_site/${page}.html"; grep -q 'assets/commerce-v18.css' "_site/${page}.html"; done
          grep -q 'Masa con tiempo. Fuego con carácter.' _site/assets/content-v17.js
          grep -q 'Nuestra pizza insignia' _site/assets/content-v17.js
          grep -q 'Confirma tu pedido con claridad.' _site/assets/commerce-ux-v18.js
          grep -q 'ee-v18-mobile-total' _site/assets/commerce-v18.css
          node --check _site/assets/commerce-runtime-config.js
          node --check _site/assets/operations-v16.js
          node --check _site/assets/content-v17.js
          node --check _site/assets/commerce-ux-v18.js
          ! grep -qi 'service_role' _site/assets/commerce-runtime-config.js
          for asset in offer-studio-v09.js offer-studio-v09.css offer-governance-v09.js offer-acts-preflight-v09.js offer-acts-v09.js offer-acts-v09.css aire-tiempo-committee-v09.js aire-tiempo-committee-v09.css commerce-runtime-config.js commerce-config-v14.js checkout-v15.js admin-v15.js operations-v16.js content-v17.js commerce-ux-v18.js commerce-v14.js commerce-v14.css commerce-v15.css commerce-v16.css commerce-v18.css; do test -f "_site/assets/$asset"; done
          test -f _site/documentacion/modelo-oferta-v09.json
          test -f _site/documentacion/sesiones/aire-y-tiempo-paquete-comite-v09.json
          test -f _site/documentacion/sesiones/AIRE_Y_TIEMPO_PAQUETE_COMITE_V09.md
          test -f _site/backend/supabase/schema-v14.sql
          test -f _site/backend/supabase/schema-v15.sql
          test -f _site/backend/supabase/schema-v16.sql
          grep -q 'v040-app-001.b64' _site/assets/app.js
          grep -q 'v040-app-006.b64' _site/assets/app.js
          ! grep -q 'assets/chunks/app-' _site/assets/app.js
          ! grep -q 'assets/chunks/data-' _site/assets/data.js
          ! grep -q 'assets/chunks/preprod-' _site/assets/preprod.js
          test ! -f _site/ELERRANTE_PAQUETE_VISUAL_V1_10.zip
      - name: Cargar artefacto de Pages
        uses: actions/upload-pages-artifact@v4
        with:
          path: "_site"
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4