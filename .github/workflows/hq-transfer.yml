name: Diagnóstico de transferencia Canva HQ

on:
  push:
    branches: ["feat/hq-visual-v13-atomic"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  transfer:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - name: Probar recurso firmado en distintas resoluciones
        shell: bash
        env:
          QUERY: "csig=AAAAAAAAAAAAAAAAAAAAAOG5o_s3mnee4IoQAqiT-NuI8fXCiJokv5UCFEW2NNUT&exp=1785932774&osig=AAAAAAAAAAAAAAAAAAAAAB2rKhJA8oRdM5FSY-FWgbzmbcdt8n-4CP0CgIl5RPmk&signer=media-rpc&x-canva-quality=thumbnail"
        run: |
          set -euo pipefail
          BASE='uri:ifs%3A%2F%2FM%2Fed74551a-52bf-4836-97be-3435fc853af5/watermark:F'
          declare -A URLS
          URLS[thumbnail]="https://media.canva.com/v2/image-resize/format:JPG/height:112/quality:75/${BASE}/width:200?${QUERY}"
          URLS[webp1600]="https://media.canva.com/v2/image-resize/format:WEBP/height:900/quality:90/${BASE}/width:1600?${QUERY}"
          URLS[jpg1600]="https://media.canva.com/v2/image-resize/format:JPG/height:900/quality:90/${BASE}/width:1600?${QUERY}"
          for name in thumbnail webp1600 jpg1600; do
            code=$(curl --location --silent --show-error --max-time 45 -w '%{http_code}' "${URLS[$name]}" -o "/tmp/$name.bin" || true)
            echo "$name http=$code bytes=$(wc -c < /tmp/$name.bin)"
            file "/tmp/$name.bin"
            identify "/tmp/$name.bin" 2>/dev/null || true
          done
