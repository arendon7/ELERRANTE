name: Corregir selector V2.2

on:
  push:
    branches: ["feat/produccion-despacho-v22"]

permissions:
  contents: write

jobs:
  corregir:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/produccion-despacho-v22
      - name: Retirar listener duplicado
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path=Path('assets/production-v22.js')
          text=path.read_text(encoding='utf-8')
          lines=text.splitlines()
          start=next((i for i,line in enumerate(lines) if 'let selected=initialDate(orders);' in line),None)
          if start is None:
              raise SystemExit('No se encontró el inicio del bloque duplicado.')
          expected=['let selected=initialDate(orders);','host.innerHTML=shellHtml(orders,selected);','const dateInput=host.querySelector','const rerenderDate=','dateInput.addEventListener','bind(host,orders,selected);']
          block=lines[start:start+6]
          if not all(marker in line for marker,line in zip(expected,block)):
              raise SystemExit('El bloque de render cambió y no se modificará automáticamente.')
          indent=lines[start][:len(lines[start])-len(lines[start].lstrip())]
          replacement=[indent+'const selected=initialDate(orders);',indent+'host.innerHTML=shellHtml(orders,selected);',indent+'bind(host,orders,selected);']
          lines[start:start+6]=replacement
          path.write_text('\n'.join(lines)+'\n',encoding='utf-8')
          PY
          node --check assets/production-v22.js
          python3 scripts/verificar_produccion_v22.py
      - name: Guardar corrección
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/production-v22.js
          git commit -m "fix(produccion): evita doble render al cambiar fecha"
          git push origin HEAD:feat/produccion-despacho-v22
