name: Verificar publicación V3.7

on:
  workflow_run:
    workflows: ["Validar y publicar El Errante"]
    types: [completed]

permissions:
  contents: read

env:
  PUBLIC_BASE: https://arendon7.github.io/ELERRANTE

concurrency:
  group: "public-health-v37-${{ github.event.workflow_run.head_sha }}"
  cancel-in-progress: true

jobs:
  health-v37:
    name: GitHub Pages publica piloto operativo V3.7.2
    if: github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Definir expectativa
        run: |
          echo "EXPECTED_SHA=${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_ENV"
          echo "SOURCE_CONCLUSION=${{ github.event.workflow_run.conclusion }}" >> "$GITHUB_ENV"

      - name: Exigir despliegue fuente exitoso
        run: test "$SOURCE_CONCLUSION" = "success"

      - name: Esperar SHA publicado
        run: |
          set -euo pipefail
          success=0
          for attempt in $(seq 1 12); do
            curl --fail --silent --show-error --location --max-time 20 \
              -H 'Cache-Control: no-cache' \
              "$PUBLIC_BASE/deploy-version.txt?verify=$EXPECTED_SHA&attempt=$attempt" > deploy-version-v37.txt || true
            sha="$(sed -n 's/^release_commit=//p' deploy-version-v37.txt | tr -d '\r')"
            if [ "$sha" = "$EXPECTED_SHA" ]; then success=1; break; fi
            sleep 5
          done
          test "$success" -eq 1

      - name: Verificar superficie V3.7.2
        run: |
          set -euo pipefail
          fetch_public() {
            local url="$1" output="$2"
            curl --fail --silent --show-error --location --max-time 20 \
              --retry 5 --retry-delay 2 --retry-all-errors \
              -H 'Cache-Control: no-cache' "$url" > "$output"
          }

          fetch_public "$PUBLIC_BASE/piloto-operativo.html?verify=$EXPECTED_SHA" public-pilot-v37.html
          fetch_public "$PUBLIC_BASE/assets/pilot-operations-v37.js?verify=$EXPECTED_SHA" public-pilot-v37.js
          fetch_public "$PUBLIC_BASE/assets/pilot-operations-v37.css?verify=$EXPECTED_SHA" public-pilot-v37.css
          fetch_public "$PUBLIC_BASE/assets/pilot-order-intake-v372.js?verify=$EXPECTED_SHA" public-intake-v372.js
          fetch_public "$PUBLIC_BASE/assets/pilot-order-intake-v372.css?verify=$EXPECTED_SHA" public-intake-v372.css
          fetch_public "$PUBLIC_BASE/centro-interno.html?verify=$EXPECTED_SHA" public-center.html

          grep -q 'id="pilot-operations-v37"' public-pilot-v37.html
          grep -q 'data-v31-protected' public-pilot-v37.html
          grep -q 'assets/data.js' public-pilot-v37.html
          grep -q 'assets/pilot-operations-v37.js?v=3.7.1' public-pilot-v37.html
          grep -q 'assets/pilot-operations-v37.css?v=3.7.0' public-pilot-v37.html
          grep -q 'assets/pilot-order-intake-v372.js?v=3.7.2' public-pilot-v37.html
          grep -q 'assets/pilot-order-intake-v372.css?v=3.7.2' public-pilot-v37.html
          ! grep -q 'finance-workbench-v31.js' public-pilot-v37.html
          ! grep -q 'daily-close-v36.js' public-pilot-v37.html

          grep -q "const VERSION='3.7.1'" public-pilot-v37.js
          grep -q "BACKUP_VERSIONS=new Set(\['3.7.0',VERSION\])" public-pilot-v37.js
          grep -q "EVENT_KEY='ee_v37_pilot_events'" public-pilot-v37.js
          grep -q 'Piloto operativo controlado · V3.7' public-pilot-v37.js
          grep -q "format:'el-errante-pilot-backup'" public-pilot-v37.js
          grep -q "algorithm:'SHA-256'" public-pilot-v37.js
          grep -q "'receivedDate','received_date'" public-pilot-v37.js
          grep -q 'backupVersion:p.version' public-pilot-v37.js
          grep -q 'function reconciliation' public-pilot-v37.js
          grep -q 'function restoreBackup' public-pilot-v37.js
          ! grep -qi 'service_role' public-pilot-v37.js
          ! grep -q "'ee_v31_local_account'" public-pilot-v37.js
          node --check public-pilot-v37.js

          grep -q "const VERSION='3.7.2'" public-intake-v372.js
          grep -q "ORDER_KEY='ee_v14_orders'" public-intake-v372.js
          grep -q "source:'pilot-local-intake-v372'" public-intake-v372.js
          grep -q 'unit_cost_snapshot:x.unitCost' public-intake-v372.js
          grep -q "status==='payment_review'&&!receiptFile" public-intake-v372.js
          grep -q "receiptDataUrl:receipt?.dataUrl||''" public-intake-v372.js
          grep -q "order.status='payment_review'" public-intake-v372.js
          grep -q "canvas.toDataURL('image/jpeg',0.72)" public-intake-v372.js
          ! grep -qi 'service_role' public-intake-v372.js
          ! grep -q 'createClient(' public-intake-v372.js
          node --check public-intake-v372.js

          grep -q '.v37-shell' public-pilot-v37.css
          grep -q '.v372-panel' public-intake-v372.css
          grep -q '.v372-payment-box' public-intake-v372.css
          grep -q 'href="piloto-operativo.html"' public-center.html