name: Graphify — mapa y memoria ELERRANTE

on:
  workflow_dispatch:
  push:
    branches:
      - "infra/graphify-obsidian-pilot-v1"
    paths-ignore:
      - "graphify-out/**"

permissions:
  contents: write

concurrency:
  group: "graphify-knowledge-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  build-knowledge:
    name: Construir grafo y wiki
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar uv
        run: python -m pip install --disable-pip-version-check uv

      - name: Construir Graphify
        env:
          GRAPHIFY_VERSION: "0.9.26"
          GRAPHIFY_FULL_OBSIDIAN: "0"
        run: ./scripts/refresh_graphify_knowledge.sh

      - name: Validar artefactos mínimos
        run: |
          set -euo pipefail
          test -s graphify-out/graph.json
          test -s graphify-out/GRAPH_REPORT.md
          test -s graphify-out/wiki/index.md
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('graphify-out/graph.json').read_text())
          nodes = data.get('nodes', [])
          edges = data.get('edges', data.get('links', []))
          wiki = list(Path('graphify-out/wiki').glob('*.md'))
          print(f'Graphify: {len(nodes)} nodos / {len(edges)} relaciones / {len(wiki)} notas wiki')
          if not nodes:
              raise SystemExit('grafo vacío')
          if not edges:
              raise SystemExit('grafo sin relaciones')
          if len(wiki) < 2:
              raise SystemExit('wiki vacía')
          PY

      - name: Versionar mapa generado en la rama piloto
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A graphify-out
          if git diff --cached --quiet; then
            echo "Sin cambios de conocimiento estructural."
            exit 0
          fi
          git commit -m "chore: refresh Graphify knowledge [skip graphify]"
          git push
