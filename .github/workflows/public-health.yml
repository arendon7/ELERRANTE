name: Verificar publicación real

on:
  workflow_run:
    workflows: ["Validar y publicar El Errante"]
    types: [completed]

permissions:
  contents: read
  issues: write

env:
  PUBLIC_BASE: https://arendon7.github.io/ELERRANTE
  EXPECTED_CACHE: el-errante-v1-2-0

jobs:
  health:
    name: GitHub Pages corresponde a main
    if: github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Definir expectativa
        run: |
          echo "EXPECTED_SHA=${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_ENV"
          echo "SOURCE_CONCLUSION=${{ github.event.workflow_run.conclusion }}" >> "$GITHUB_ENV"
      - name: Exigir despliegue exitoso
        run: test "$SOURCE_CONCLUSION" = "success"
      - name: Verificar versión pública
        shell: bash
        run: |
          set -euo pipefail
          success=0
          for attempt in $(seq 1 12); do
            curl --fail --silent --show-error --location --max-time 20 -H 'Cache-Control: no-cache' "$PUBLIC_BASE/deploy-version.txt?verify=$EXPECTED_SHA&attempt=$attempt" > deploy-version-observed.txt || true
            sha="$(sed -n 's/^release_commit=//p' deploy-version-observed.txt | tr -d '\r')"
            cache="$(sed -n 's/^cache=//p' deploy-version-observed.txt | tr -d '\r')"
            source="$(sed -n 's/^deploy_source=//p' deploy-version-observed.txt | tr -d '\r')"
            if [ "$sha" = "$EXPECTED_SHA" ] && [ "$cache" = "$EXPECTED_CACHE" ] && [ "$source" = "main" ]; then success=1; break; fi
            sleep 10
          done
          test "$success" -eq 1
      - name: Verificar páginas, runtime e imágenes
        shell: bash
        run: |
          set -euo pipefail
          for page in index historia nosotros tienda en-casa en-movimiento equipo; do
            curl --fail --silent --show-error --location --max-time 30 -H 'Cache-Control: no-cache' "$PUBLIC_BASE/${page}.html?verify=$EXPECTED_SHA" > "public-${page}.html"
          done
          grep -Fq 'Masa · Fuego · Territorio' public-index.html
          grep -Fq 'Viajar hasta el origen' public-historia.html
          grep -Fq 'Equipo fundador' public-nosotros.html
          grep -Fq 'Centro integral' public-equipo.html
          curl --fail --silent --show-error --location --max-time 30 -H 'Cache-Control: no-cache' "$PUBLIC_BASE/assets/host-mode.js?verify=$EXPECTED_SHA" > public-host-mode.js
          grep -q 'el-errante-v1-2-0' public-host-mode.js
          grep -q 'brand-final-direct' public-host-mode.js
          for asset in home-hero home-masa-fuego home-fermentacion home-ingredientes home-compartir home-en-casa home-despensa evento-hero evento-noche evento-servicio producto-harina producto-crea-tuya producto-margherita producto-diavola producto-bosque producto-cuatro-quesos producto-la-errante producto-salsa-tomate producto-reduccion-balsamica producto-panela-maracuya producto-combo-primera-ruta; do
            curl --fail --silent --show-error --location --max-time 30 -H 'Cache-Control: no-cache' "$PUBLIC_BASE/assets/images/brand-final/${asset}.svg?verify=$EXPECTED_SHA" > "public-${asset}.svg"
            grep -q 'data:image/avif;base64,' "public-${asset}.svg"
          done
          for old in brand-final-editorial.js brand-final-products-a.js brand-final-products-b.js brand-final-products-c.js; do
            test "$(curl --silent --output /dev/null --write-out '%{http_code}' "$PUBLIC_BASE/assets/$old?verify=$EXPECTED_SHA")" = "404"
          done
      - name: Publicar resultado
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const marker='<!-- el-errante-public-health -->';
            const ok='${{ job.status }}'==='success';
            const sha=context.payload.workflow_run.head_sha;
            const body=`${marker}\n## Public health: ${ok?'PASS':'FAIL'}\n\n- Commit servido: \`${sha}\`.\n- Fuente única: \`main\`.\n- Caché: \`${process.env.EXPECTED_CACHE}\`.\n- 21 imágenes directas: ${ok?'verificadas':'con incidencia'}.\n- Verificación: ${new Date().toISOString()}.`;
            const {data:comments}=await github.rest.issues.listComments({owner:context.repo.owner,repo:context.repo.repo,issue_number:11,per_page:100});
            const existing=comments.find(c=>c.body?.includes(marker));
            if(existing) await github.rest.issues.updateComment({owner:context.repo.owner,repo:context.repo.repo,comment_id:existing.id,body});
            else await github.rest.issues.createComment({owner:context.repo.owner,repo:context.repo.repo,issue_number:11,body});
