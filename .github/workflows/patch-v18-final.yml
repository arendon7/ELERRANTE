name: Corregir experiencia V1.8

on:
  push:
    branches: ["feat/experiencia-compra-v18"]
    paths:
      - ".github/workflows/patch-v18-final.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/experiencia-compra-v18
          fetch-depth: 0

      - name: Corregir secciones, carrito vacío e inventario de prueba
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          js_path = Path('assets/commerce-ux-v18.js')
          js = js_path.read_text(encoding='utf-8')
          old_loop = """      let node=heading;
                while(node&&(!node.matches('h3')||node===heading)){
                  const next=node.nextSibling;
                  section.appendChild(node);
                  node=next;
                  if(node?.nodeType===1&&node.matches('h3'))break;
                }
          """
          new_loop = """      let node=heading;
                while(node){
                  const next=node.nextSibling;
                  section.appendChild(node);
                  node=next;
                  if(node?.nodeType===1&&node.matches('h3'))break;
                }
          """
          if old_loop not in js:
              raise SystemExit('No se encontró el ciclo de secciones esperado')
          js = js.replace(old_loop, new_loop)
          old_empty = "    layout.hidden=true;"
          new_empty = "    document.body.classList.add('ee-v18-empty-cart');\n    layout.hidden=true;\n    layout.setAttribute('aria-hidden','true');"
          if old_empty not in js:
              raise SystemExit('No se encontró el estado vacío esperado')
          js_path.write_text(js.replace(old_empty, new_empty, 1), encoding='utf-8')

          css_path = Path('assets/commerce-v18.css')
          css = css_path.read_text(encoding='utf-8')
          marker = '.ee-v18-empty-cart .checkout-layout'
          if marker not in css:
              css += "\n.ee-v18-empty-cart .checkout-layout{display:none!important}.ee-v18-empty-cart .ee-v18-progress,.ee-v18-empty-cart .ee-v18-confidence{display:none!important}\n"
              css_path.write_text(css, encoding='utf-8')

          test_path = Path('tests/e2e/commerce-v18.spec.js')
          test = test_path.read_text(encoding='utf-8')
          replacements = [
              ('async function seedCart(page, stock = 10) {', 'async function seedCart(page, stock = 10, qty = 1) {'),
              ('await page.addInitScript(({ available }) => {', 'await page.addInitScript(({ available, quantity }) => {'),
              ("{ id: 'la-errante', variant: 'unidad', qty: 1 }", "{ id: 'la-errante', variant: 'unidad', qty: quantity }"),
              ('}, { available: stock });', '}, { available: stock, quantity: qty });'),
              ('await seedCart(page, 0);', 'await seedCart(page, 1, 2);'),
          ]
          for old, new in replacements:
              if old not in test:
                  raise SystemExit(f'No se encontró marcador de prueba: {old}')
              test = test.replace(old, new, 1)
          test_path.write_text(test, encoding='utf-8')

          verifier = Path('scripts/verificar_experiencia_compra_v18.py')
          value = verifier.read_text(encoding='utf-8')
          needle = '    "observer.observe(root,{childList:true,subtree:true})",\n'
          addition = needle + '    "node?.nodeType===1",\n    "ee-v18-empty-cart",\n'
          if needle not in value:
              raise SystemExit('No se encontró el marcador del verificador V1.8')
          verifier.write_text(value.replace(needle, addition), encoding='utf-8')
          PY

      - name: Validar correcciones
        shell: bash
        run: |
          node --check assets/commerce-ux-v18.js
          node --check tests/e2e/commerce-v18.spec.js
          python3 scripts/verificar_experiencia_compra_v18.py

      - name: Consolidar correcciones
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/commerce-ux-v18.js assets/commerce-v18.css tests/e2e/commerce-v18.spec.js scripts/verificar_experiencia_compra_v18.py
          git commit -m 'fix(commerce): corrige secciones, vacío e inventario V1.8'
          git push origin HEAD:feat/experiencia-compra-v18
