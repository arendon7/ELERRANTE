name: Validar y publicar El Errante
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: "pages-${{ github.ref }}"
  cancel-in-progress: true
jobs:
  validate:
    name: Regresión integral
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
      - name: Ejecutar barrera de regresión integral
        run: python3 verificar_demo.py
      - name: Validar procedencia de fuentes
        run: python3 scripts/verificar_fuentes.py
      - name: Validar matriz maestra de oferta
        run: python3 scripts/verificar_oferta_v09.py
      - name: Validar Studio de Oferta
        run: |
          python3 scripts/verificar_studio_oferta_v09.py
          node --check assets/offer-studio-v09.js
          node --check assets/offer-governance-v09.js
      - name: Validar sesiones, actas y comité
        run: |
          python3 scripts/verificar_actas_oferta_v09.py
          python3 scripts/verificar_paquete_aire_tiempo_v09.py
          node --check assets/offer-acts-preflight-v09.js
          node --check assets/offer-acts-v09.js
          node --check assets/aire-tiempo-committee-v09.js
      - name: Validar sistema visual final
        run: |
          node --check assets/host-mode.js
          node --check assets/brand-final-editorial.js
          node --check assets/brand-final-products-a.js
          node --check assets/brand-final-products-b.js
          node --check assets/brand-final-products-c.js
      - name: Reconstruir fuente canónica efectiva
        run: node scripts/exportar-fuente-canonica.mjs --output=.artifacts/canonical
      - name: Publicar fuente o diagnóstico para auditoría
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fuente-canonica-${{ github.sha }}
          path: .artifacts/canonical
          if-no-files-found: warn
          retention-days: 14
  deploy:
    name: Publicar GitHub Pages
    if: github.event_name != 'pull_request'
    needs: validate
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
      - name: Preparar sitio desde main
        shell: bash
        run: |
          mkdir -p _site
          rsync -av ./ _site/ \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude '_site/' \
            --exclude '__pycache__/' \
            --exclude '.artifacts/' \
            --exclude 'node_modules/' \
            --exclude 'test-results/' \
            --exclude 'playwright-report/' \
            --exclude 'ELERRANTE_PAQUETE_VISUAL_V1_10.zip'
          printf 'EL ERRANTE PUBLIC RELEASE\nversion=1.1.0\ndeploy_source=main\nrelease_commit=%s\ncache=el-errante-v1-1-0\nupdated=%s\n' "$GITHUB_SHA" "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" > _site/deploy-version.txt
          touch _site/.nojekyll
      - name: Verificar artefacto publicable
        shell: bash
        run: |
          grep -q 'version=1.1.0' _site/deploy-version.txt
          grep -q 'cache=el-errante-v1-1-0' _site/deploy-version.txt
          grep -q "release_commit=${GITHUB_SHA}" _site/deploy-version.txt
          grep -q 'Masa · Fuego · Territorio' _site/index.html
          for page in equipo admin control operacion studio actas presentacion; do test -f "_site/${page}.html"; done
          for asset in home-hero.svg home-masa-fuego.svg home-fermentacion.svg home-ingredientes.svg; do test -s "_site/assets/images/brand-final/$asset"; done
          for asset in brand-final-editorial.js brand-final-products-a.js brand-final-products-b.js brand-final-products-c.js; do test -s "_site/assets/$asset"; node --check "_site/assets/$asset"; done
          grep -q 'el-errante-v1-1-0' _site/service-worker.js
          grep -q 'brand-final' _site/assets/host-mode.js
          grep -q 'producto-panela-maracuya' _site/assets/brand-final-products-c.js
          grep -q 'producto-combo-primera-ruta' _site/assets/brand-final-products-b.js
          for asset in offer-studio-v09.js offer-studio-v09.css offer-governance-v09.js offer-acts-preflight-v09.js offer-acts-v09.js offer-acts-v09.css aire-tiempo-committee-v09.js aire-tiempo-committee-v09.css; do test -f "_site/assets/$asset"; done
          test -f _site/documentacion/modelo-oferta-v09.json
          test -f _site/documentacion/sesiones/aire-y-tiempo-paquete-comite-v09.json
          test -f _site/documentacion/sesiones/AIRE_Y_TIEMPO_PAQUETE_COMITE_V09.md
          grep -q 'offer-studio-v09.js' _site/studio.html
          grep -q 'offer-acts-preflight-v09.js' _site/actas.html
          grep -q 'offer-acts-v09.js' _site/actas.html
          grep -q 'aire-tiempo-committee-v09.js' _site/actas.html
          test "$(grep -bo 'offer-acts-preflight-v09.js' _site/actas.html | cut -d: -f1)" -lt "$(grep -bo 'offer-acts-v09.js' _site/actas.html | cut -d: -f1)"
          grep -q 'documentacion/modelo-oferta-v09.json' _site/assets/offer-acts-v09.js
          grep -q 'aire-y-tiempo-paquete-comite-v09.json' _site/assets/aire-tiempo-committee-v09.js
          grep -q 'EE_VALIDATION_ACTS_PREFLIGHT_V09' _site/assets/offer-acts-preflight-v09.js
          grep -q 'v040-app-001.b64' _site/assets/app.js
          grep -q 'v040-app-006.b64' _site/assets/app.js
          ! grep -q 'assets/chunks/app-' _site/assets/app.js
          ! grep -q 'assets/chunks/data-' _site/assets/data.js
          ! grep -q 'assets/chunks/preprod-' _site/assets/preprod.js
          test ! -f _site/ELERRANTE_PAQUETE_VISUAL_V1_10.zip
      - name: Cargar artefacto de Pages
        uses: actions/upload-pages-artifact@v4
        with:
          path: "_site"
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
