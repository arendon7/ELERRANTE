name: Corregir operación comercial V1.4

on:
  push:
    branches: ["feat/operacion-comercial-v14-iteracion-1"]
    paths:
      - ".github/workflows/patch-commerce-v14.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar rama
        uses: actions/checkout@v4
        with:
          ref: feat/operacion-comercial-v14-iteracion-1
          fetch-depth: 0

      - name: Aplicar correcciones de compatibilidad, móvil y caché
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          checkout_path = Path('checkout.html')
          checkout = checkout_path.read_text(encoding='utf-8')
          old = '<form class="form-card" id="checkout-form"><h3>Preparando el formulario…</h3></form>'
          new = '<form class="form-card" id="checkout-form"><div class="ee-v14-legacy-bridge" aria-hidden="true"><label for="checkout-city">Compatibilidad de entrega</label><select id="checkout-city"><option value="">Entrega por coordinar</option></select><div id="shipping-message"></div><button type="submit">Continuar</button></div><h3>Preparando el formulario…</h3></form>'
          if old not in checkout:
              raise SystemExit('No se encontró el formulario base del checkout')
          checkout_path.write_text(checkout.replace(old, new), encoding='utf-8')

          commerce_path = Path('assets/commerce-v14.js')
          commerce = commerce_path.read_text(encoding='utf-8')
          commerce = commerce.replace('const variantId = row.variantId || row.variant_id;', 'const variantId = row.variantId || row.variant_id || row.variant;')
          commerce = commerce.replace('<input id="ee-city" name="city" required placeholder=', '<input id="ee-city" name="city" type="text" required placeholder=')
          commerce_path.write_text(commerce, encoding='utf-8')

          css_path = Path('assets/commerce-v14.css')
          css = css_path.read_text(encoding='utf-8')
          css += '''\n.ee-v14-legacy-bridge{display:none!important}.ee-v14-auth{position:relative;overflow:hidden}.ee-v14-auth h1{position:relative!important;transform:none!important;max-width:100%;overflow-wrap:anywhere;pointer-events:none}.ee-v14-auth .ee-v14-btn{position:relative;z-index:3}.admin-main{min-width:0;overflow-x:hidden}@media(max-width:640px){.admin-top{align-items:flex-start;gap:12px;flex-wrap:wrap}.admin-top h1,.ee-v14-auth h1{font-size:clamp(2.15rem,12vw,3.7rem)!important;line-height:.94!important;letter-spacing:-.035em!important}.ee-v14-auth{margin:24px auto;padding:20px}.admin-main{padding-left:16px!important;padding-right:16px!important}}\n'''
          css_path.write_text(css, encoding='utf-8')

          test_path = Path('tests/e2e/commerce-v14.spec.js')
          test_path.write_text(r'''const { test, expect } = require('@playwright/test');

async function seedCart(page) {
  await page.addInitScript(() => localStorage.setItem('ee_v2_cart', JSON.stringify([
    { id: 'la-errante', variant: 'unidad', qty: 1 }
  ])));
}

test.describe('Operación comercial V1.4', () => {
  test('checkout usa transferencia, comprobante y cobertura abierta', async ({ page }) => {
    await seedCart(page);
    await page.goto('/checkout.html');
    await expect(page.getByRole('heading', { name: 'Tu pedido comienza aquí.' })).toBeVisible();
    await expect(page.getByRole('heading', { name: '3. Transferencia y comprobante' })).toBeVisible();
    await expect(page.locator('#ee-receipt')).toBeVisible();
    await expect(page.locator('#ee-city')).toHaveAttribute('type', 'text');
    await expect(page.getByText('No cerramos el pedido por rutas fijas ni por días predeterminados.')).toBeVisible();
    await expect(page.getByRole('button', { name: 'PSE' })).toHaveCount(0);
    await expect(page.getByRole('button', { name: 'Tarjeta' })).toHaveCount(0);
    await expect(page.getByRole('button', { name: 'Nequi' })).toHaveCount(0);
  });

  test('administración local expone finanzas, pedidos y catálogo editable', async ({ page }) => {
    await page.goto('/admin.html');
    await expect(page.getByRole('heading', { name: 'Panel operativo en preparación.' })).toBeVisible();
    await page.getByRole('button', { name: 'Abrir vista local de revisión' }).click();
    await expect(page.getByText('Ventas aprobadas')).toBeVisible();
    await expect(page.getByText('Balance del mes')).toBeVisible();
    await expect(page.getByRole('heading', { name: 'Precios, costos e inventario' })).toBeVisible();
    await expect(page.getByRole('heading', { name: 'Gastos fijos' })).toBeVisible();
    await expect(page.getByText('$ 6.000.000', { exact: true })).toBeVisible();
    await expect(page.getByRole('heading', { name: 'Datos bancarios visibles en checkout' })).toBeVisible();
  });

  test('datos bancarios de revisión persisten en el navegador', async ({ page }) => {
    await page.goto('/admin.html');
    await page.getByRole('button', { name: 'Abrir vista local de revisión' }).click();
    await page.locator('#ee-bank-holder').fill('El Errante Cocina');
    await page.locator('#ee-bank-account').fill('123456789');
    await page.locator('#ee-bank-key').fill('errante@banco');
    await page.getByRole('button', { name: 'Guardar datos de transferencia' }).click();
    await seedCart(page);
    await page.goto('/checkout.html');
    await expect(page.getByText('El Errante Cocina')).toBeVisible();
    await expect(page.getByText('123456789')).toBeVisible();
    await expect(page.getByText('errante@banco')).toBeVisible();
  });
});
''', encoding='utf-8')

          worker_path = Path('service-worker.js')
          worker = worker_path.read_text(encoding='utf-8')
          worker = worker.replace("el-errante-v1-3-1", "el-errante-v1-4-0")
          old_assets = "'./assets/preprod.js','./assets/content-v5.js','./assets/host-mode.js','./assets/control.js','./assets/presentation.js',"
          new_assets = "'./assets/preprod.js','./assets/content-v5.js','./assets/host-mode.js','./assets/commerce-config-v14.js','./assets/commerce-v14.js','./assets/commerce-v14.css','./assets/control.js','./assets/presentation.js',"
          if old_assets not in worker:
              raise SystemExit('No se encontró el bloque de activos del service worker')
          worker_path.write_text(worker.replace(old_assets, new_assets), encoding='utf-8')

          host_path = Path('assets/host-mode.js')
          host = host_path.read_text(encoding='utf-8')
          host = host.replace('PUBLIC_VERSION="1.3.1"', 'PUBLIC_VERSION="1.4.0"')
          host = host.replace('ACTIVE_CACHE="el-errante-v1-3-1"', 'ACTIVE_CACHE="el-errante-v1-4-0"')
          host_path.write_text(host, encoding='utf-8')

          release_path = Path('scripts/verificar_release_v13.py')
          release = release_path.read_text(encoding='utf-8')
          release = release.replace('PUBLIC_VERSION="1.3.1"', 'PUBLIC_VERSION="1.4.0"')
          release = release.replace('ACTIVE_CACHE="el-errante-v1-3-1"', 'ACTIVE_CACHE="el-errante-v1-4-0"')
          release = release.replace('el-errante-v1-3-1', 'el-errante-v1-4-0')
          release_path.write_text(release, encoding='utf-8')

          pages_path = Path('.github/workflows/pages.yml')
          pages = pages_path.read_text(encoding='utf-8')
          pages = pages.replace('version=1.3.1', 'version=1.4.0')
          pages = pages.replace('el-errante-v1-3-1', 'el-errante-v1-4-0')
          marker = '      - name: Validar matriz maestra de oferta\n'
          validation = '      - name: Validar operación comercial V1.4\n        run: python3 scripts/verificar_operacion_v14.py\n'
          if validation not in pages:
              pages = pages.replace(marker, validation + marker)
          pages_path.write_text(pages, encoding='utf-8')

          health_path = Path('.github/workflows/public-health.yml')
          health = health_path.read_text(encoding='utf-8')
          health = health.replace('el-errante-v1-3-1', 'el-errante-v1-4-0')
          health = health.replace('PUBLIC_VERSION="1.3.1"', 'PUBLIC_VERSION="1.4.0"')
          health = health.replace('V1.3.1 HQ', 'V1.4.0 OPERACIÓN COMERCIAL')
          health_path.write_text(health, encoding='utf-8')

          audit_path = Path('.github/workflows/canonical-audit.yml')
          audit = audit_path.read_text(encoding='utf-8')
          audit_marker = '      - name: Reconstruir fuente efectiva\n'
          audit_validation = '      - name: Validar operación comercial V1.4\n        run: python3 scripts/verificar_operacion_v14.py\n'
          if audit_validation not in audit:
              audit = audit.replace(audit_marker, audit_validation + audit_marker)
          audit_path.write_text(audit, encoding='utf-8')

          deploy_path = Path('deploy-version.txt')
          deploy = deploy_path.read_text(encoding='utf-8')
          deploy = re.sub(r'version=.*', 'version=1.4.0', deploy)
          deploy = re.sub(r'cache=.*', 'cache=el-errante-v1-4-0', deploy)
          deploy_path.write_text(deploy, encoding='utf-8')
          PY

      - name: Validar parche
        shell: bash
        run: |
          set -euo pipefail
          node --check assets/commerce-v14.js
          node --check assets/host-mode.js
          node --check service-worker.js
          python3 scripts/verificar_release_v13.py
          python3 scripts/verificar_operacion_v14.py
          grep -q 'commerce-v14.js' service-worker.js
          grep -q 'version=1.4.0' .github/workflows/pages.yml

      - name: Consolidar corrección
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/patch-commerce-v14.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(commerce): estabiliza checkout, móvil y caché V1.4'
          git push origin HEAD:feat/operacion-comercial-v14-iteracion-1
