name: Materializar visuales HQ V1.3

on:
  push:
    branches: ["feat/hq-visual-v13-atomic"]
    paths:
      - ".transfer/READY"

permissions:
  contents: write

concurrency:
  group: hq-materialize-v13
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Descargar rama de transferencia
        uses: actions/checkout@v4
        with:
          ref: feat/hq-visual-v13-atomic
          fetch-depth: 1
      - name: Reconstruir y validar paquete HQ
        shell: bash
        env:
          EXPECTED_SHA256: f08abfd9d12385b71af5d5f7df3bb01568f983766fed519ff6fb0b4e56cfc90a
        run: |
          set -euo pipefail
          test -f .transfer/READY
          test "$(find .transfer -maxdepth 1 -name 'chunk-*.b64' | wc -l)" -eq 94
          cat .transfer/chunk-*.b64 | tr -d '\r\n' | base64 --decode > /tmp/elerrante-hq-v13.zip
          echo "${EXPECTED_SHA256}  /tmp/elerrante-hq-v13.zip" | sha256sum --check -
          rm -rf assets/images/hq-v13
          mkdir -p assets/images/hq-v13
          unzip -q /tmp/elerrante-hq-v13.zip -d assets/images/hq-v13
          test "$(find assets/images/hq-v13 -maxdepth 1 -name '*.avif' | wc -l)" -eq 23
          test -s assets/images/hq-v13/manifest.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          root = Path('assets/images/hq-v13')
          manifest = json.loads((root / 'manifest.json').read_text(encoding='utf-8'))
          assert manifest['count'] == 23
          for item in manifest['assets']:
              path = root / item['file']
              raw = path.read_bytes()
              assert len(raw) == item['bytes']
              assert b'ftypavif' in raw[:32]
          print('23 AVIF HQ validados.')
          PY
      - name: Retirar puentes y consolidar binarios
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .transfer
          rm -f .github/workflows/hq-transfer.yml
          rm -f assets/brand-final-editorial.js
          rm -f assets/brand-final-products-a.js
          rm -f assets/brand-final-products-b.js
          rm -f assets/brand-final-products-c.js
          rm -rf assets/images/brand-final
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(visual): incorpora 23 AVIF HQ directos"
          git push origin HEAD:feat/hq-visual-v13-atomic
