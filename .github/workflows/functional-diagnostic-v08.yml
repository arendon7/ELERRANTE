name: Diagnóstico funcional v0.8

on:
  push:
    branches: ["test/v0.8-regresion-funcional"]
    paths:
      - "package.json"
      - "playwright.config.js"
      - "tests/e2e/**"
      - ".github/workflows/functional-diagnostic-v08.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "functional-diagnostic-v08"
  cancel-in-progress: true

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Descargar rama
        uses: actions/checkout@v4
        with:
          ref: test/v0.8-regresion-funcional
          fetch-depth: 0

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm install --no-audit --no-fund

      - name: Instalar Chromium
        run: npx playwright install --with-deps chromium

      - name: Ejecutar Playwright y conservar JSON
        id: tests
        shell: bash
        run: |
          set +e
          npx playwright test --reporter=json > functional-results.json
          status=$?
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Generar informe legible
        env:
          TEST_EXIT_CODE: ${{ steps.tests.outputs.exit_code }}
        run: |
          mkdir -p documentacion
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          raw_path = Path('functional-results.json')
          report = json.loads(raw_path.read_text(encoding='utf-8'))
          failures = []
          passed = 0
          skipped = 0
          total = 0

          def visit_suite(suite, parents=None):
              nonlocal_state = None
              parents = list(parents or [])
              title = suite.get('title')
              if title:
                  parents.append(title)
              for spec in suite.get('specs', []):
                  spec_title = ' › '.join(parents + [spec.get('title', '')])
                  for test in spec.get('tests', []):
                      project = test.get('projectName', 'unknown')
                      results = test.get('results', [])
                      final = results[-1] if results else {}
                      status = final.get('status', test.get('status', 'unknown'))
                      yield spec_title, project, status, final
              for child in suite.get('suites', []):
                  yield from visit_suite(child, parents)

          rows = list(item for suite in report.get('suites', []) for item in visit_suite(suite))
          total = len(rows)
          for title, project, status, result in rows:
              if status == 'passed':
                  passed += 1
              elif status == 'skipped':
                  skipped += 1
              else:
                  errors = result.get('errors') or []
                  message = '\n\n'.join(
                      (error.get('message') or error.get('stack') or str(error))
                      for error in errors
                  ) or 'Sin mensaje de error.'
                  failures.append({
                      'title': title,
                      'project': project,
                      'status': status,
                      'message': message,
                  })

          summary = {
              'exit_code': int(os.environ.get('TEST_EXIT_CODE', '1')),
              'total': total,
              'passed': passed,
              'failed': len(failures),
              'skipped': skipped,
              'failures': failures,
          }
          Path('documentacion/FUNCTIONAL_TEST_RESULTS.json').write_text(
              json.dumps(summary, ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8'
          )

          status = 'PASS' if summary['exit_code'] == 0 and not failures else 'FAIL'
          lines = [
              '# Regresión funcional v0.8',
              '',
              f'status: `{status}`',
              '',
              f'- Total: {total}.',
              f'- Aprobadas: {passed}.',
              f'- Fallidas: {len(failures)}.',
              f'- Omitidas: {skipped}.',
              '',
          ]
          if failures:
              lines += ['## Fallos', '']
              for index, failure in enumerate(failures, 1):
                  lines += [
                      f"### {index}. {failure['title']} [{failure['project']}]",
                      '',
                      f"Estado: `{failure['status']}`",
                      '',
                      '```text',
                      failure['message'][:5000],
                      '```',
                      '',
                  ]
          else:
              lines += [
                  '## Certificación',
                  '',
                  'La experiencia pública y la demo integral superaron la suite Playwright en escritorio y móvil.',
                  '',
              ]
          Path('documentacion/FUNCTIONAL_TEST_RESULTS.md').write_text('\n'.join(lines), encoding='utf-8')
          PY

      - name: Confirmar informe en la rama
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add documentacion/FUNCTIONAL_TEST_RESULTS.json documentacion/FUNCTIONAL_TEST_RESULTS.md
          if ! git diff --cached --quiet; then
            git commit -m "test: registra diagnóstico funcional v0.8"
            git push origin HEAD:test/v0.8-regresion-funcional
          fi

      - name: Fallar si la suite no aprobó
        if: steps.tests.outputs.exit_code != '0'
        run: exit 1
