name: Validar y publicar El Errante
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: "pages-${{ github.ref }}"
  cancel-in-progress: true
jobs:
  validate:
    name: Regresión integral
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
      - name: Materializar sistema visual final
        run: python3 scripts/materializar_activos_visuales.py
      - name: Ejecutar barrera de publicación V1.2
        run: python3 scripts/verificar_release_v12.py
      - name: Validar matriz maestra de oferta
        run: python3 scripts/verificar_oferta_v09.py
      - name: Validar Studio de Oferta
        run: |
          python3 scripts/verificar_studio_oferta_v09.py
          node --check assets/offer-studio-v09.js
          node --check assets/offer-governance-v09.js
      - name: Validar sesiones, actas y comité
        run: |
          python3 scripts/verificar_actas_oferta_v09.py
          python3 scripts/verificar_paquete_aire_tiempo_v09.py
          node --check assets/offer-acts-preflight-v09.js
          node --check assets/offer-acts-v09.js
          node --check assets/aire-tiempo-committee-v09.js
      - name: Validar sistema visual directo
        shell: bash
        run: |
          node --check assets/host-mode.js
          test "$(find assets/images/brand-final -maxdepth 1 -name '*.svg' | wc -l)" -eq 21
          grep -q '"count": 21' assets/images/brand-final/manifest.json
      - name: Reconstruir fuente canónica efectiva
        run: node scripts/exportar-fuente-canonica.mjs --output=.artifacts/canonical
      - name: Publicar fuente o diagnóstico para auditoría
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fuente-canonica-${{ github.sha }}
          path: .artifacts/canonical
          if-no-files-found: warn
          retention-days: 14
  deploy:
    name: Publicar GitHub Pages
    if: github.event_name != 'pull_request'
    needs: validate
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
      - name: Materializar las 21 imágenes finales
        run: python3 scripts/materializar_activos_visuales.py
      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
      - name: Preparar sitio desde main
        shell: bash
        run: |
          mkdir -p _site
          rsync -av ./ _site/ \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude '_site/' \
            --exclude '__pycache__/' \
            --exclude '.artifacts/' \
            --exclude 'node_modules/' \
            --exclude 'test-results/' \
            --exclude 'playwright-report/' \
            --exclude 'ELERRANTE_PAQUETE_VISUAL_V1_10.zip' \
            --exclude 'assets/brand-final-editorial.js' \
            --exclude 'assets/brand-final-products-a.js' \
            --exclude 'assets/brand-final-products-b.js' \
            --exclude 'assets/brand-final-products-c.js'
          printf 'EL ERRANTE PUBLIC RELEASE\nversion=1.2.0\ndeploy_source=main\nrelease_commit=%s\ncache=el-errante-v1-2-0\nupdated=%s\n' "$GITHUB_SHA" "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" > _site/deploy-version.txt
          touch _site/.nojekyll
      - name: Verificar artefacto publicable
        shell: bash
        run: |
          grep -q 'version=1.2.0' _site/deploy-version.txt
          grep -q 'cache=el-errante-v1-2-0' _site/deploy-version.txt
          grep -q "release_commit=${GITHUB_SHA}" _site/deploy-version.txt
          grep -q 'Masa · Fuego · Territorio' _site/index.html
          for page in equipo admin control operacion studio actas presentacion; do test -f "_site/${page}.html"; done
          test "$(find _site/assets/images/brand-final -maxdepth 1 -name '*.svg' | wc -l)" -eq 21
          grep -q '"count": 21' _site/assets/images/brand-final/manifest.json
          for asset in home-hero home-masa-fuego home-fermentacion home-ingredientes home-compartir home-en-casa home-despensa evento-hero evento-noche evento-servicio producto-harina producto-crea-tuya producto-margherita producto-diavola producto-bosque producto-cuatro-quesos producto-la-errante producto-salsa-tomate producto-reduccion-balsamica producto-panela-maracuya producto-combo-primera-ruta; do test -s "_site/assets/images/brand-final/${asset}.svg"; done
          test ! -f _site/assets/brand-final-editorial.js
          test ! -f _site/assets/brand-final-products-a.js
          test ! -f _site/assets/brand-final-products-b.js
          test ! -f _site/assets/brand-final-products-c.js
          grep -q 'el-errante-v1-2-0' _site/service-worker.js
          grep -q 'brand-final' _site/assets/host-mode.js
          for asset in offer-studio-v09.js offer-studio-v09.css offer-governance-v09.js offer-acts-preflight-v09.js offer-acts-v09.js offer-acts-v09.css aire-tiempo-committee-v09.js aire-tiempo-committee-v09.css; do test -f "_site/assets/$asset"; done
          test -f _site/documentacion/modelo-oferta-v09.json
          test -f _site/documentacion/sesiones/aire-y-tiempo-paquete-comite-v09.json
          test -f _site/documentacion/sesiones/AIRE_Y_TIEMPO_PAQUETE_COMITE_V09.md
          grep -q 'v040-app-001.b64' _site/assets/app.js
          grep -q 'v040-app-006.b64' _site/assets/app.js
          ! grep -q 'assets/chunks/app-' _site/assets/app.js
          ! grep -q 'assets/chunks/data-' _site/assets/data.js
          ! grep -q 'assets/chunks/preprod-' _site/assets/preprod.js
          test ! -f _site/ELERRANTE_PAQUETE_VISUAL_V1_10.zip
      - name: Cargar artefacto de Pages
        uses: actions/upload-pages-artifact@v4
        with:
          path: "_site"
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
