name: Inspeccionar contrato de inventario

on:
  push:
    branches: ["feat/experiencia-compra-v18"]
    paths:
      - ".github/workflows/inspect-stock-contract.yml"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/experiencia-compra-v18
      - name: Decodificar y localizar contrato
        run: |
          python3 - <<'PY'
          import base64
          from pathlib import Path

          groups={
            'app': sorted(Path('assets/source').glob('v040-app-*.b64')),
            'preprod': sorted(Path('assets/source').glob('v040-preprod-*.b64')),
          }
          needles=['despensa demo','stock suficiente','inventory','inventario','stock','ee_v2_','ee_v14_','stockdemo','despensa']
          for name,paths in groups.items():
              encoded=''.join(path.read_text(encoding='utf-8').strip() for path in paths)
              source=base64.b64decode(encoded).decode('utf-8')
              print(f'========== {name.upper()} =========')
              lines=source.splitlines()
              found=False
              for i,line in enumerate(lines):
                  low=line.lower()
                  if any(n.lower() in low for n in needles):
                      found=True
                      print(f'--- línea {i+1} ---')
                      for j in range(max(0,i-5),min(len(lines),i+6)):
                          print(f'{j+1}: {lines[j]}')
              if not found:
                  print('Sin marcadores relevantes')
          PY