name: Verificar publicación real

on:
  workflow_run:
    workflows: ["Validar y publicar El Errante"]
    types: [completed]

permissions:
  contents: read

env:
  PUBLIC_BASE: https://arendon7.github.io/ELERRANTE
  EXPECTED_VERSION: 2.8.0
  EXPECTED_CACHE: el-errante-v2-8-brand-canon-1

concurrency:
  group: "public-health-${{ github.event.workflow_run.head_sha }}"
  cancel-in-progress: true

jobs:
  health:
    name: GitHub Pages corresponde a main V2.8
    if: github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Definir expectativa
        run: |
          echo "EXPECTED_SHA=${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_ENV"
          echo "SOURCE_CONCLUSION=${{ github.event.workflow_run.conclusion }}" >> "$GITHUB_ENV"
      - name: Exigir despliegue fuente exitoso
        run: test "$SOURCE_CONCLUSION" = "success"
      - name: Esperar marcador público coherente
        shell: bash
        run: |
          set -euo pipefail
          success=0
          for attempt in $(seq 1 12); do
            curl --fail --silent --show-error --location --max-time 20 -H 'Cache-Control: no-cache' \
              "$PUBLIC_BASE/deploy-version.txt?verify=$EXPECTED_SHA&attempt=$attempt" > deploy-version-observed.txt || true
            sha="$(sed -n 's/^release_commit=//p' deploy-version-observed.txt | tr -d '\r')"
            version="$(sed -n 's/^version=//p' deploy-version-observed.txt | tr -d '\r')"
            cache="$(sed -n 's/^cache=//p' deploy-version-observed.txt | tr -d '\r')"
            source="$(sed -n 's/^deploy_source=//p' deploy-version-observed.txt | tr -d '\r')"
            mode="$(sed -n 's/^source_mode=//p' deploy-version-observed.txt | tr -d '\r')"
            if [ "$sha" = "$EXPECTED_SHA" ] && [ "$version" = "$EXPECTED_VERSION" ] && \
               [ "$cache" = "$EXPECTED_CACHE" ] && [ "$source" = "main" ] && [ "$mode" = "materialized" ]; then success=1; break; fi
            sleep 5
          done
          test "$success" -eq 1
      - name: Verificar runtime y fuentes materializadas
        shell: bash
        run: |
          set -euo pipefail
          for asset in brand-canon-v28.js data.js app.js preprod.js host-mode.js finance-v27.js procurement-v25.js commerce-runtime-config.js; do
            curl --fail --silent --show-error --location --max-time 20 -H 'Cache-Control: no-cache' \
              "$PUBLIC_BASE/assets/$asset?verify=$EXPECTED_SHA" > "public-$asset"
          done
          for asset in data-v28.js app-v28.js preprod-v28.js; do
            curl --fail --silent --show-error --location --max-time 20 -H 'Cache-Control: no-cache' \
              "$PUBLIC_BASE/assets/generated/$asset?verify=$EXPECTED_SHA" > "public-generated-$asset"
          done
          curl --fail --silent --show-error --location --max-time 20 -H 'Cache-Control: no-cache' \
            "$PUBLIC_BASE/assets/generated/manifest-v28.json?verify=$EXPECTED_SHA" > public-generated-manifest-v28.json
          curl --fail --silent --show-error --location --max-time 20 -H 'Cache-Control: no-cache' \
            "$PUBLIC_BASE/service-worker.js?verify=$EXPECTED_SHA" > public-service-worker.js
          for page in index tienda producto admin activacion; do
            curl --fail --silent --show-error --location --max-time 20 -H 'Cache-Control: no-cache' \
              "$PUBLIC_BASE/${page}.html?verify=$EXPECTED_SHA" > "public-${page}.html"
          done
          grep -q "const VERSION='2.8.0'" public-brand-canon-v28.js
          grep -q 'assets/generated/data-v28.js' public-data.js
          grep -q 'assets/generated/app-v28.js' public-app.js
          grep -q 'assets/generated/preprod-v28.js' public-preprod.js
          grep -q 'Fuente materializada de forma determinista' public-generated-data-v28.js
          grep -q 'Fuente materializada de forma determinista' public-generated-app-v28.js
          grep -q 'Fuente materializada de forma determinista' public-generated-preprod-v28.js
          grep -q '"version": "2.8.0"' public-generated-manifest-v28.json
          grep -q 'BRAND.applyToData(window.EE_DATA)' public-data.js
          grep -q 'BRAND.applyToDom' public-host-mode.js
          grep -q "importScripts('./assets/brand-canon-v28.js')" public-service-worker.js
          grep -q 'const GENERATED=' public-service-worker.js
          grep -q '· V2.8' public-admin.html
          grep -q 'assets/finance-v27.js' public-admin.html
          grep -q 'assets/procurement-v25.js' public-admin.html
          ! grep -qi 'service_role' public-commerce-runtime-config.js
          for script in public-*.js; do node --check "$script"; done
          python3 - <<'PY'
          import json
          manifest=json.load(open('public-generated-manifest-v28.json',encoding='utf-8'))
          assert manifest['version']=='2.8.0'
          assert len(manifest['outputs'])==3
          assert {item['path'] for item in manifest['outputs']}=={
            'assets/generated/data-v28.js','assets/generated/app-v28.js','assets/generated/preprod-v28.js'
          }
          PY
      - name: Verificar WebP HQ críticos
        shell: bash
        run: |
          set -euo pipefail
          for image in home-hero home-hero-mobile producto-margherita producto-la-errante evento-hero; do
            curl --fail --silent --show-error --location --max-time 20 -H 'Cache-Control: no-cache' \
              "$PUBLIC_BASE/assets/images/brand-final/${image}.webp?verify=$EXPECTED_SHA" > "public-${image}.webp"
          done
          python3 - <<'PY'
          from pathlib import Path
          for path in Path('.').glob('public-*.webp'):
              data=path.read_bytes()
              assert len(data)>100_000
              assert data[:4]==b'RIFF' and data[8:12]==b'WEBP'
          assert Path('public-home-hero.webp').read_bytes()!=Path('public-home-hero-mobile.webp').read_bytes()
          PY
      - name: Conservar evidencia ante fallo
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: public-health-${{ github.event.workflow_run.head_sha }}
          path: |
            deploy-version-observed.txt
            public-*.js
            public-*.json
            public-*.html
          retention-days: 14
