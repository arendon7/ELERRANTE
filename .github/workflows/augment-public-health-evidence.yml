name: Incorporar evidencia pública v0.8

on:
  push:
    branches: ["ci/v0.8-public-health-evidence"]
    paths:
      - ".github/workflows/augment-public-health-evidence.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  augment:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar rama
        uses: actions/checkout@v4
        with:
          ref: ci/v0.8-public-health-evidence
          fetch-depth: 0

      - name: Instalar workflow definitivo
        shell: bash
        run: |
          cat > .github/workflows/public-health.yml <<'YAML'
          name: Verificar publicación real

          on:
            workflow_run:
              workflows: ["Validar y publicar El Errante"]
              types: [completed]

          permissions:
            contents: read
            issues: write

          env:
            PUBLIC_BASE: https://arendon7.github.io/ELERRANTE
            EXPECTED_CACHE: el-errante-v0-6-8

          jobs:
            health:
              name: GitHub Pages corresponde a main
              if: github.event.workflow_run.event == 'push'
              runs-on: ubuntu-latest
              timeout-minutes: 10

              steps:
                - name: Definir commit esperado
                  run: |
                    echo "EXPECTED_SHA=${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_ENV"
                    echo "SOURCE_CONCLUSION=${{ github.event.workflow_run.conclusion }}" >> "$GITHUB_ENV"
                    echo "Workflow fuente: ${{ github.event.workflow_run.html_url }}"

                - name: Exigir despliegue fuente exitoso
                  run: test "$SOURCE_CONCLUSION" = "success"

                - name: Esperar propagación de GitHub Pages
                  shell: bash
                  run: |
                    set -euo pipefail
                    success=0
                    for attempt in $(seq 1 24); do
                      marker="$(curl --fail --silent --show-error --location --max-time 20 \
                        -H 'Cache-Control: no-cache' \
                        "$PUBLIC_BASE/deploy-version.txt?verify=$EXPECTED_SHA&attempt=$attempt" || true)"
                      printf '%s\n' "$marker" > deploy-version-observed.txt

                      if grep -q "release_commit=$EXPECTED_SHA" deploy-version-observed.txt \
                        && grep -q "cache=$EXPECTED_CACHE" deploy-version-observed.txt \
                        && grep -q 'deploy_source=main' deploy-version-observed.txt; then
                        success=1
                        echo "Pages propagó el commit esperado en el intento $attempt."
                        break
                      fi

                      echo "Intento $attempt: Pages aún no sirve $EXPECTED_SHA."
                      cat deploy-version-observed.txt || true
                      sleep 15
                    done

                    if [ "$success" -ne 1 ]; then
                      echo "GitHub Pages no propagó el commit esperado dentro del plazo."
                      exit 1
                    fi

                - name: Verificar runtime canónico publicado
                  shell: bash
                  run: |
                    set -euo pipefail
                    curl --fail --silent --show-error --location --max-time 30 \
                      -H 'Cache-Control: no-cache' \
                      "$PUBLIC_BASE/assets/data.js?verify=$EXPECTED_SHA" > public-data-loader.js
                    curl --fail --silent --show-error --location --max-time 30 \
                      -H 'Cache-Control: no-cache' \
                      "$PUBLIC_BASE/assets/canonical-data.js?verify=$EXPECTED_SHA" > public-canonical-data.js

                    grep -q 'assets/canonical-data.js' public-data-loader.js
                    ! grep -q 'assets/chunks/data-' public-data-loader.js
                    ! grep -q 'assets/source/v040-data-' public-data-loader.js
                    ! grep -q 'assets/products-v6.js' public-data-loader.js
                    grep -q 'window.EE_DATA=' public-canonical-data.js
                    grep -q 'harina-aire-y-tiempo' public-canonical-data.js
                    grep -q 'combo-primera-ruta' public-canonical-data.js

                - name: Verificar superficies diferenciadas
                  shell: bash
                  run: |
                    set -euo pipefail
                    for page in historia nosotros equipo; do
                      curl --fail --silent --show-error --location --max-time 30 \
                        -H 'Cache-Control: no-cache' \
                        "$PUBLIC_BASE/${page}.html?verify=$EXPECTED_SHA" > "public-${page}.html"
                    done

                    grep -q 'personas-proyecto' public-historia.html
                    grep -q 'nosotros.html' public-historia.html
                    grep -q 'Personas y proyecto' public-nosotros.html
                    grep -q 'historia.html' public-nosotros.html
                    grep -q 'Demo integral' public-equipo.html

                - name: Generar informe
                  if: always()
                  shell: bash
                  run: |
                    {
                      echo "EL ERRANTE — PUBLIC HEALTH"
                      echo "source_conclusion=$SOURCE_CONCLUSION"
                      echo "expected_sha=$EXPECTED_SHA"
                      echo "expected_cache=$EXPECTED_CACHE"
                      echo "public_base=$PUBLIC_BASE"
                      echo
                      echo "--- deploy-version observado ---"
                      cat deploy-version-observed.txt 2>/dev/null || true
                      echo
                      echo "data_loader_bytes=$(wc -c < public-data-loader.js 2>/dev/null || echo 0)"
                      echo "canonical_data_bytes=$(wc -c < public-canonical-data.js 2>/dev/null || echo 0)"
                      echo "historia_bytes=$(wc -c < public-historia.html 2>/dev/null || echo 0)"
                      echo "nosotros_bytes=$(wc -c < public-nosotros.html 2>/dev/null || echo 0)"
                      echo "equipo_bytes=$(wc -c < public-equipo.html 2>/dev/null || echo 0)"
                    } > public-health-report.txt
                    cat public-health-report.txt

                - name: Conservar evidencia
                  if: always()
                  uses: actions/upload-artifact@v4
                  with:
                    name: public-health-${{ github.event.workflow_run.head_sha }}
                    path: |
                      public-health-report.txt
                      deploy-version-observed.txt
                      public-data-loader.js
                    if-no-files-found: warn
                    retention-days: 14

                - name: Publicar PASS en el issue de recuperación
                  if: success()
                  uses: actions/github-script@v7
                  with:
                    script: |
                      const marker = '<!-- el-errante-public-health -->';
                      const sha = context.payload.workflow_run.head_sha;
                      const runUrl = context.payload.workflow_run.html_url;
                      const body = `${marker}\n## Public health: PASS\n\n- Commit servido: \`${sha}\`.\n- Fuente: \`main\`.\n- Caché: \`${process.env.EXPECTED_CACHE}\`.\n- Runtime: \`assets/canonical-data.js\`.\n- Historia, Nosotros y Demo integral: publicadas y diferenciadas.\n- Workflow fuente: ${runUrl}\n- Verificación: ${new Date().toISOString()}.`;
                      const { data: comments } = await github.rest.issues.listComments({
                        owner: context.repo.owner,
                        repo: context.repo.repo,
                        issue_number: 11,
                        per_page: 100
                      });
                      const existing = comments.find(comment => comment.body?.includes(marker));
                      if (existing) {
                        await github.rest.issues.updateComment({
                          owner: context.repo.owner,
                          repo: context.repo.repo,
                          comment_id: existing.id,
                          body
                        });
                      } else {
                        await github.rest.issues.createComment({
                          owner: context.repo.owner,
                          repo: context.repo.repo,
                          issue_number: 11,
                          body
                        });
                      }

                - name: Publicar fallo en el issue de recuperación
                  if: failure()
                  uses: actions/github-script@v7
                  with:
                    script: |
                      const marker = '<!-- el-errante-public-health -->';
                      const sha = context.payload.workflow_run.head_sha;
                      const runUrl = context.payload.workflow_run.html_url;
                      const body = `${marker}\n## Public health: FAIL\n\nGitHub Pages no superó la validación del commit \`${sha}\`.\n\n- Caché esperada: \`${process.env.EXPECTED_CACHE}\`.\n- Workflow fuente: ${runUrl}\n- Revisión requerida antes de cerrar la recuperación.\n- Verificación: ${new Date().toISOString()}.`;
                      const { data: comments } = await github.rest.issues.listComments({
                        owner: context.repo.owner,
                        repo: context.repo.repo,
                        issue_number: 11,
                        per_page: 100
                      });
                      const existing = comments.find(comment => comment.body?.includes(marker));
                      if (existing) {
                        await github.rest.issues.updateComment({
                          owner: context.repo.owner,
                          repo: context.repo.repo,
                          comment_id: existing.id,
                          body
                        });
                      } else {
                        await github.rest.issues.createComment({
                          owner: context.repo.owner,
                          repo: context.repo.repo,
                          issue_number: 11,
                          body
                        });
                      }
          YAML

          rm -f .github/workflows/augment-public-health-evidence.yml

      - name: Confirmar workflow definitivo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A .github/workflows
          git commit -m "ci: publica evidencia del health check en issue 11"
          git push origin HEAD:ci/v0.8-public-health-evidence
