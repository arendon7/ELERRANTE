name: Verificar publicación real

on:
  workflow_run:
    workflows: ["Validar y publicar El Errante"]
    types: [completed]

permissions:
  contents: read

env:
  PUBLIC_BASE: https://arendon7.github.io/ELERRANTE
  EXPECTED_CACHE: el-errante-v1-1-1

concurrency:
  group: "public-health-${{ github.event.workflow_run.head_sha }}"
  cancel-in-progress: true

jobs:
  health:
    name: GitHub Pages corresponde a main
    if: github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Definir expectativa
        run: |
          echo "EXPECTED_SHA=${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_ENV"
          echo "SOURCE_CONCLUSION=${{ github.event.workflow_run.conclusion }}" >> "$GITHUB_ENV"
          echo "SOURCE_WORKFLOW_URL=${{ github.event.workflow_run.html_url }}" >> "$GITHUB_ENV"
      - name: Exigir despliegue fuente exitoso
        run: test "$SOURCE_CONCLUSION" = "success"
      - name: Esperar marcador público coherente
        shell: bash
        run: |
          set -euo pipefail
          success=0
          for attempt in $(seq 1 6); do
            curl --fail --silent --show-error --location --max-time 12 \
              -H 'Cache-Control: no-cache' \
              "$PUBLIC_BASE/deploy-version.txt?verify=$EXPECTED_SHA&attempt=$attempt" \
              > deploy-version-observed.txt || true
            observed_sha="$(sed -n 's/^release_commit=//p' deploy-version-observed.txt | tr -d '\r')"
            observed_cache="$(sed -n 's/^cache=//p' deploy-version-observed.txt | tr -d '\r')"
            observed_source="$(sed -n 's/^deploy_source=//p' deploy-version-observed.txt | tr -d '\r')"
            if [ "$observed_sha" = "$EXPECTED_SHA" ] && [ "$observed_cache" = "$EXPECTED_CACHE" ] && [ "$observed_source" = "main" ]; then
              success=1
              echo "Marcador público coherente en el intento $attempt."
              break
            fi
            echo "Intento $attempt: sha=${observed_sha:-vacío}; cache=${observed_cache:-vacía}; source=${observed_source:-vacía}"
            sleep 5
          done
          test "$success" -eq 1
      - name: Verificar runtime esencial
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --max-time 15 -H 'Cache-Control: no-cache' \
            "$PUBLIC_BASE/assets/host-mode.js?verify=$EXPECTED_SHA" > public-host-mode.js
          curl --fail --silent --show-error --location --max-time 15 -H 'Cache-Control: no-cache' \
            "$PUBLIC_BASE/service-worker.js?verify=$EXPECTED_SHA" > public-service-worker.js
          node --check public-host-mode.js
          node --check public-service-worker.js
          grep -q 'PUBLIC_VERSION="1.1.1"' public-host-mode.js
          grep -q 'Promise.allSettled(BRAND_PACKS.map(loadScript))' public-host-mode.js
          grep -q 'window.addEventListener("load",run' public-host-mode.js
          grep -q 'el-errante-v1-1-1' public-service-worker.js
          grep -q 'LAZY_SOURCE_ASSETS' public-service-worker.js
          ! grep -q "'./assets/brand-final-editorial.js'" public-service-worker.js
      - name: Verificar superficies públicas críticas
        shell: bash
        run: |
          set -euo pipefail
          for page in index tienda producto en-movimiento; do
            curl --fail --silent --show-error --location --max-time 15 -H 'Cache-Control: no-cache' \
              "$PUBLIC_BASE/${page}.html?verify=$EXPECTED_SHA" > "public-${page}.html"
          done
          grep -Fq 'Masa · Fuego · Territorio' public-index.html
          grep -Fq 'data-page="tienda"' public-tienda.html
          grep -Fq 'data-page="producto"' public-producto.html
          grep -Fq 'data-page="en-movimiento"' public-en-movimiento.html
      - name: Generar informe
        if: always()
        shell: bash
        run: |
          {
            echo "EL ERRANTE — PUBLIC HEALTH V1.1.1"
            echo "source_conclusion=$SOURCE_CONCLUSION"
            echo "source_workflow_url=$SOURCE_WORKFLOW_URL"
            echo "expected_sha=$EXPECTED_SHA"
            echo "expected_cache=$EXPECTED_CACHE"
            echo "public_base=$PUBLIC_BASE"
            echo
            echo "--- deploy-version observado ---"
            cat deploy-version-observed.txt 2>/dev/null || true
          } > public-health-report.txt
          cat public-health-report.txt
      - name: Conservar evidencia únicamente ante fallo
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: public-health-${{ github.event.workflow_run.head_sha }}
          path: |
            public-health-report.txt
            deploy-version-observed.txt
            public-host-mode.js
            public-service-worker.js
            public-index.html
            public-tienda.html
            public-producto.html
            public-en-movimiento.html
          if-no-files-found: warn
          retention-days: 7
