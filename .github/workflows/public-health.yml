name: Verificar publicación real

on:
  workflow_run:
    workflows: ["Validar y publicar El Errante"]
    types: [completed]

permissions:
  contents: read

env:
  PUBLIC_BASE: https://arendon7.github.io/ELERRANTE
  EXPECTED_RELEASE: 3.1.1
  EXPECTED_RUNTIME: 2.8.0
  EXPECTED_CACHE: el-errante-v2-8-brand-canon-2
  EXPECTED_ARCHITECTURE: v3.1-acceso-operacion-finanzas
  EXPECTED_SHELL: v3.1.1
  EXPECTED_CONTROL: v3.0
  EXPECTED_OPERATION: v3.3.0
  EXPECTED_MASTER_DATA_CORE: v1.0.0
  EXPECTED_MASTER_DATA: v1.3.0
  EXPECTED_COST_PROPOSALS: v1.1.0
  EXPECTED_COST_MATERIALIZATION: v1.2.0
  EXPECTED_COST_BRIDGE: v1.3.0
  EXPECTED_FINANCE_CORE: v3.1.0
  EXPECTED_FINANCE: v3.2.9

concurrency:
  group: "public-health-${{ github.event.workflow_run.head_sha }}"
  cancel-in-progress: true

jobs:
  health:
    name: GitHub Pages corresponde a main · contratos vigentes V3.5
    if: github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Definir expectativa
        run: |
          echo "EXPECTED_SHA=${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_ENV"
          echo "SOURCE_CONCLUSION=${{ github.event.workflow_run.conclusion }}" >> "$GITHUB_ENV"

      - name: Exigir despliegue fuente exitoso
        run: test "$SOURCE_CONCLUSION" = "success"

      - name: Esperar marcador público coherente
        run: |
          set -euo pipefail
          success=0
          for attempt in $(seq 1 12); do
            curl --fail --silent --show-error --location --max-time 20 \
              -H 'Cache-Control: no-cache' \
              "$PUBLIC_BASE/deploy-version.txt?verify=$EXPECTED_SHA&attempt=$attempt" > deploy-version-observed.txt || true
            sha="$(sed -n 's/^release_commit=//p' deploy-version-observed.txt | tr -d '\r')"
            release="$(sed -n 's/^release_version=//p' deploy-version-observed.txt | tr -d '\r')"
            runtime="$(sed -n 's/^version=//p' deploy-version-observed.txt | tr -d '\r')"
            cache="$(sed -n 's/^cache=//p' deploy-version-observed.txt | tr -d '\r')"
            source="$(sed -n 's/^deploy_source=//p' deploy-version-observed.txt | tr -d '\r')"
            mode="$(sed -n 's/^source_mode=//p' deploy-version-observed.txt | tr -d '\r')"
            architecture="$(sed -n 's/^internal_architecture=//p' deploy-version-observed.txt | tr -d '\r')"
            shell="$(sed -n 's/^session_shell=//p' deploy-version-observed.txt | tr -d '\r')"
            control="$(sed -n 's/^control_engine=//p' deploy-version-observed.txt | tr -d '\r')"
            operation="$(sed -n 's/^operation_module=//p' deploy-version-observed.txt | tr -d '\r')"
            master_data_core="$(sed -n 's/^master_data_governance_core=//p' deploy-version-observed.txt | tr -d '\r')"
            master_data="$(sed -n 's/^master_data_module=//p' deploy-version-observed.txt | tr -d '\r')"
            cost_proposals="$(sed -n 's/^master_cost_proposals=//p' deploy-version-observed.txt | tr -d '\r')"
            cost_materialization="$(sed -n 's/^master_cost_materialization=//p' deploy-version-observed.txt | tr -d '\r')"
            cost_bridge="$(sed -n 's/^master_cost_bridge=//p' deploy-version-observed.txt | tr -d '\r')"
            finance_core="$(sed -n 's/^finance_workbench_core=//p' deploy-version-observed.txt | tr -d '\r')"
            finance="$(sed -n 's/^finance_module=//p' deploy-version-observed.txt | tr -d '\r')"
            finance_demo="$(sed -n 's/^finance_demo=//p' deploy-version-observed.txt | tr -d '\r')"
            if [ "$sha" = "$EXPECTED_SHA" ] && \
               [ "$release" = "$EXPECTED_RELEASE" ] && \
               [ "$runtime" = "$EXPECTED_RUNTIME" ] && \
               [ "$cache" = "$EXPECTED_CACHE" ] && \
               [ "$source" = "main" ] && \
               [ "$mode" = "materialized-no-base64-runtime" ] && \
               [ "$architecture" = "$EXPECTED_ARCHITECTURE" ] && \
               [ "$shell" = "$EXPECTED_SHELL" ] && \
               [ "$control" = "$EXPECTED_CONTROL" ] && \
               [ "$operation" = "$EXPECTED_OPERATION" ] && \
               [ "$master_data_core" = "$EXPECTED_MASTER_DATA_CORE" ] && \
               [ "$master_data" = "$EXPECTED_MASTER_DATA" ] && \
               [ "$cost_proposals" = "$EXPECTED_COST_PROPOSALS" ] && \
               [ "$cost_materialization" = "$EXPECTED_COST_MATERIALIZATION" ] && \
               [ "$cost_bridge" = "$EXPECTED_COST_BRIDGE" ] && \
               [ "$finance_core" = "$EXPECTED_FINANCE_CORE" ] && \
               [ "$finance" = "$EXPECTED_FINANCE" ] && \
               [ "$finance_demo" = "$EXPECTED_FINANCE" ]; then
              success=1
              break
            fi
            sleep 5
          done
          test "$success" -eq 1

      - name: Verificar superficie materializada y contratos V3.5
        run: |
          set -euo pipefail
          fetch_public() {
            local url="$1" output="$2"
            curl --fail --silent --show-error --location --max-time 20 \
              --retry 5 --retry-delay 2 --retry-all-errors \
              -H 'Cache-Control: no-cache' "$url" > "$output"
          }

          for asset in \
            brand-canon-v28.js data-finalize-v28.js app-contract-v28.js preprod-contract-v28.js host-mode.js \
            finance-v27.js procurement-v25.js control-v30.js mfo-v30.js materials-v23.js \
            master-data-v10.js master-cost-proposals-v11.js master-cost-proposals-v11.css \
            master-cost-materialization-v12.js master-cost-materialization-v12.css master-cost-prospective-v13.js \
            internal-v30.css internal-v31.css access-v31.js internal-shell-v31.js operational-evidence-v330.js \
            finance-workbench-v31.js finance-starter-v31.js finance-unit-economics-v322.js finance-demo-v329.js \
            business-pulse-v34.js business-pulse-v34.css management-pulse-v35.js management-pulse-v35.css \
            commerce-runtime-config.js; do
            fetch_public "$PUBLIC_BASE/assets/$asset?verify=$EXPECTED_SHA" "public-$asset"
          done

          for asset in data-v28.js app-v28.js preprod-v28.js; do
            fetch_public "$PUBLIC_BASE/assets/generated/$asset?verify=$EXPECTED_SHA" "public-generated-$asset"
          done
          fetch_public "$PUBLIC_BASE/assets/generated/manifest-v28.json?verify=$EXPECTED_SHA" public-generated-manifest-v28.json
          fetch_public "$PUBLIC_BASE/materialized-site-v28.json?verify=$EXPECTED_SHA" public-materialized-site-v28.json
          fetch_public "$PUBLIC_BASE/service-worker.js?verify=$EXPECTED_SHA" public-service-worker.js
          for page in index tienda producto admin activacion acceso centro-interno control operacion finanzas studio actas; do
            fetch_public "$PUBLIC_BASE/${page}.html?verify=$EXPECTED_SHA" "public-${page}.html"
          done

          # Materialización: nunca volver a loaders/base64 de fuente.
          grep -q 'assets/generated/data-v28.js' public-index.html
          grep -q 'assets/generated/app-v28.js' public-index.html
          grep -q 'assets/generated/preprod-v28.js' public-index.html
          ! grep -q 'src="assets/data.js"' public-index.html
          ! grep -q 'src="assets/app.js"' public-index.html
          ! grep -q 'src="assets/preprod.js"' public-index.html
          grep -q 'Fuente materializada de forma determinista' public-generated-data-v28.js
          grep -q 'Fuente materializada de forma determinista' public-generated-app-v28.js
          grep -q 'Fuente materializada de forma determinista' public-generated-preprod-v28.js
          grep -q '"version": "2.8.0"' public-generated-manifest-v28.json
          grep -q '"mode": "materialized-no-base64-runtime"' public-materialized-site-v28.json

          # Acceso y shell internos permanecen protegidos.
          grep -q 'id="access-v31"' public-acceso.html
          grep -q 'assets/access-v31.js' public-acceso.html
          grep -q 'data-v31-protected' public-centro-interno.html
          grep -q 'data-v31-protected' public-control.html
          grep -q 'data-v31-protected' public-finanzas.html
          grep -q 'data-v31-protected' public-studio.html
          grep -q 'data-v31-protected' public-actas.html
          grep -q 'assets/internal-shell-v31.js' public-control.html
          grep -q 'assets/internal-shell-v31.js' public-finanzas.html

          # Control V3.5: horizonte y capacidad, sin motor financiero.
          grep -q 'Panel de control · V3.5' public-control.html
          grep -q 'id="control-v30"' public-control.html
          grep -q 'id="business-pulse-v34"' public-control.html
          grep -q 'id="management-pulse-v35"' public-control.html
          grep -q 'data-management-surface="control"' public-control.html
          grep -q 'assets/business-pulse-v34.js?v=3.4.0' public-control.html
          grep -q 'assets/management-pulse-v35.js?v=3.5.0' public-control.html
          ! grep -q 'finance-workbench-v31.js' public-control.html

          # Operación V3.5: ejecución completa + capacidad; sin workbench financiero.
          grep -q 'Módulo Operativo · V3.5' public-operacion.html
          for mount in control-v30 business-pulse-v34 management-pulse-v35 daily-ops-v21 production-v22 materials-v23 measurement-v24 procurement-v25 operational-evidence-v330; do
            grep -q "id=\"$mount\"" public-operacion.html
          done
          grep -q 'data-management-surface="operation"' public-operacion.html
          grep -q 'assets/business-pulse-v34.js?v=3.4.0' public-operacion.html
          grep -q 'assets/management-pulse-v35.js?v=3.5.0' public-operacion.html
          grep -q 'assets/master-cost-materialization-v12.js?v=1.2.0' public-operacion.html
          grep -q 'assets/master-cost-prospective-v13.js?v=1.3.0' public-operacion.html
          ! grep -q 'finance-workbench-v31.js' public-operacion.html

          # Finanzas V3.5 preserva V3.4 y mantiene ejecución separada.
          grep -q 'Módulo Financiero · V3.5' public-finanzas.html
          grep -q 'profundidad V3.4 preservada' public-finanzas.html
          grep -q 'id="finance-operational-pulse-v34"' public-finanzas.html
          grep -q 'id="finance-management-v35"' public-finanzas.html
          grep -q 'id="finance-workbench-v31"' public-finanzas.html
          grep -q 'assets/finance-workbench-v31.js' public-finanzas.html
          grep -q 'assets/business-pulse-v34.js?v=3.4.0' public-finanzas.html
          grep -q 'assets/management-pulse-v35.js?v=3.5.0' public-finanzas.html
          ! grep -q '<script src="assets/production-v22.js"' public-finanzas.html
          ! grep -q '<script src="assets/materials-v23.js"' public-finanzas.html
          ! grep -q '<script src="assets/procurement-v25.js"' public-finanzas.html

          # Contratos funcionales/versiones acumulados.
          grep -q "const VERSION='2.3.1'" public-materials-v23.js
          grep -q 'standardProductCost(product)' public-materials-v23.js
          grep -q "const VERSION='1.0.0'" public-master-data-v10.js
          grep -q "const VERSION='1.1.0'" public-master-cost-proposals-v11.js
          grep -q "const VERSION='1.2.0'" public-master-cost-materialization-v12.js
          grep -q "const VERSION='1.3.0'" public-master-cost-prospective-v13.js
          grep -q 'MATERIALIZED_STANDARD' public-master-cost-prospective-v13.js
          ! grep -q 'localStorage.setItem' public-master-cost-prospective-v13.js
          grep -q "const VERSION='3.2.9'" public-finance-demo-v329.js
          grep -q "const VERSION='3.4.0'" public-business-pulse-v34.js
          grep -q 'const DAYS=7' public-business-pulse-v34.js
          grep -q "const VERSION='3.5.0'" public-management-pulse-v35.js
          grep -q "CAPACITY_KEY='ee_v35_capacity_history'" public-management-pulse-v35.js
          grep -q 'function recordCapacity' public-management-pulse-v35.js
          grep -q 'function treasuryState' public-management-pulse-v35.js
          grep -q 'function closeReadiness' public-management-pulse-v35.js

          # Service worker conserva los contratos base críticos.
          grep -q "importScripts('./assets/brand-canon-v28.js')" public-service-worker.js
          grep -q './acceso.html' public-service-worker.js
          grep -q './studio.html' public-service-worker.js
          grep -q './actas.html' public-service-worker.js
          grep -q './assets/access-v31.js' public-service-worker.js
          grep -q './assets/internal-shell-v31.js' public-service-worker.js
          grep -q './assets/master-data-v10.js' public-service-worker.js
          grep -q './assets/master-cost-proposals-v11.js' public-service-worker.js
          grep -q './assets/master-cost-materialization-v12.js' public-service-worker.js
          grep -q './assets/master-cost-prospective-v13.js' public-service-worker.js
          grep -q './assets/finance-workbench-v31.js' public-service-worker.js
          grep -q './assets/materials-v23.js' public-service-worker.js

          # Nunca publicar credenciales privilegiadas en JS cliente.
          for script in public-*.js; do
            ! grep -qi 'service_role' "$script"
            node --check "$script"
          done

          python3 - <<'PY'
          import json
          generated=json.load(open('public-generated-manifest-v28.json',encoding='utf-8'))
          site=json.load(open('public-materialized-site-v28.json',encoding='utf-8'))
          assert generated['version']=='2.8.0' and len(generated['outputs'])==3
          assert site['mode']=='materialized-no-base64-runtime'
          assert site['contains_source_base64'] is False
          PY

          if curl --fail --silent --location "$PUBLIC_BASE/assets/source/v040-data-001.b64?verify=$EXPECTED_SHA" >/dev/null; then
            echo 'ERROR: Base64 publicado'; exit 1
          fi
          if curl --fail --silent --location "$PUBLIC_BASE/assets/data.js?verify=$EXPECTED_SHA" >/dev/null; then
            echo 'ERROR: loader heredado publicado'; exit 1
          fi

      - name: Verificar WebP HQ críticos
        run: |
          set -euo pipefail
          fetch_public() {
            local url="$1" output="$2"
            curl --fail --silent --show-error --location --max-time 20 \
              --retry 5 --retry-delay 2 --retry-all-errors \
              -H 'Cache-Control: no-cache' "$url" > "$output"
          }
          for image in home-hero home-hero-mobile producto-margherita producto-la-errante evento-hero; do
            fetch_public "$PUBLIC_BASE/assets/images/brand-final/${image}.webp?verify=$EXPECTED_SHA" "public-${image}.webp"
          done
          python3 - <<'PY'
          from pathlib import Path
          for path in Path('.').glob('public-*.webp'):
              data=path.read_bytes()
              assert len(data)>100_000
              assert data[:4]==b'RIFF' and data[8:12]==b'WEBP'
          assert Path('public-home-hero.webp').read_bytes()!=Path('public-home-hero-mobile.webp').read_bytes()
          PY

      - name: Conservar evidencia ante fallo
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: public-health-${{ github.event.workflow_run.head_sha }}
          path: |
            deploy-version-observed.txt
            public-*.js