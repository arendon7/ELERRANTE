name: Validar y publicar El Errante

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  validate:
    name: Regresión integral
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Ejecutar barrera de regresión integral
        run: python3 verificar_demo.py

      - name: Validar procedencia de fuentes
        run: python3 scripts/verificar_fuentes.py

      - name: Validar matriz maestra de oferta
        run: python3 scripts/verificar_oferta_v09.py

      - name: Validar Studio de Oferta
        run: |
          python3 scripts/verificar_studio_oferta_v09.py
          node --check assets/offer-studio-v09.js
          node --check assets/offer-governance-v09.js

      - name: Reconstruir fuente canónica efectiva
        run: node scripts/exportar-fuente-canonica.mjs --output=.artifacts/canonical

      - name: Publicar fuente o diagnóstico para auditoría
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fuente-canonica-${{ github.sha }}
          path: .artifacts/canonical
          if-no-files-found: warn
          retention-days: 14

  deploy:
    name: Publicar GitHub Pages
    if: github.event_name != 'pull_request'
    needs: validate
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Preparar sitio completo
        shell: bash
        run: |
          mkdir -p _site
          rsync -av ./ _site/ \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude '_site/' \
            --exclude '__pycache__/' \
            --exclude '.artifacts/'
          printf 'EL ERRANTE PUBLIC RELEASE\nversion=0.6.1\ndeploy_source=main\nrelease_commit=%s\ncache=el-errante-v0-6-8\nupdated=%s\n' \
            "$GITHUB_SHA" "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" > _site/deploy-version.txt
          touch _site/.nojekyll

      - name: Verificar artefacto publicable
        shell: bash
        run: |
          grep -q 'version=0.6.1' _site/deploy-version.txt
          grep -q 'cache=el-errante-v0-6-8' _site/deploy-version.txt
          grep -q "release_commit=${GITHUB_SHA}" _site/deploy-version.txt
          grep -q 'Masa · Fuego · Territorio' _site/index.html
          for page in equipo admin control operacion studio presentacion; do
            test -f "_site/${page}.html"
          done
          for part in \
            v040-app-001.b64 v040-app-002.b64 v040-app-003.b64 \
            v040-app-004.b64 v040-app-005.b64 v040-app-006.b64 \
            v040-data-001.b64 v040-data-002.b64 v040-data-003.b64 v040-data-004.b64 \
            v040-preprod-001a.b64 v040-preprod-001b.b64 \
            v040-preprod-001c.b64 v040-preprod-001d.b64 \
            v040-preprod-002.b64 v040-preprod-003.b64; do
              test -f "_site/assets/source/$part"
          done
          for asset in \
            v040-hero-desktop.svg v040-hero-mobile.svg v040-harina-empaques.svg \
            v040-harina-manos.svg v040-harina-horno.svg v040-manos-masa.svg \
            v040-masa-apertura.svg v040-alveolos.svg v040-fermentacion.svg \
            v040-pizza-neo.svg v040-pizza-errante.svg v040-despensa.svg \
            v040-aplicaciones-empaque.svg v040-pizzeria-movil.svg \
            v040-bitacora-fuego.svg v040-pizzas-artesanales.svg \
            v040-pizzas-coleccion.svg; do
              test -f "_site/assets/images/v040/$asset"
          done
          test -f _site/assets/offer-studio-v09.js
          test -f _site/assets/offer-studio-v09.css
          test -f _site/assets/offer-governance-v09.js
          test -f _site/documentacion/modelo-oferta-v09.json
          grep -q 'offer-studio-v09.js' _site/studio.html
          grep -q 'offer-governance-v09.js' _site/studio.html
          grep -q 'offer-studio-v09.js' _site/control.html
          grep -q 'documentacion/modelo-oferta-v09.json' _site/assets/offer-studio-v09.js
          grep -q 'el-errante-v0-6-8' _site/service-worker.js
          grep -q 'v040-app-001.b64' _site/assets/app.js
          grep -q 'v040-app-006.b64' _site/assets/app.js
          ! grep -q 'assets/chunks/app-' _site/assets/app.js
          ! grep -q 'assets/chunks/data-' _site/assets/data.js
          ! grep -q 'assets/chunks/preprod-' _site/assets/preprod.js
          ! grep -q 'v040-preprod-001.b64' _site/assets/preprod.js

      - name: Cargar artefacto de Pages
        uses: actions/upload-pages-artifact@v4
        with:
          path: "_site"

      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
