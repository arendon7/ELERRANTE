name: Verificar publicación real

on:
  workflow_run:
    workflows: ["Validar y publicar El Errante"]
    types: [completed]

permissions:
  contents: read

env:
  PUBLIC_BASE: https://arendon7.github.io/ELERRANTE
  EXPECTED_RELEASE: 3.1.1
  EXPECTED_RUNTIME: 2.8.0
  EXPECTED_CACHE: el-errante-v2-8-brand-canon-2
  EXPECTED_ARCHITECTURE: v3.1-acceso-operacion-finanzas

concurrency:
  group: "public-health-${{ github.event.workflow_run.head_sha }}"
  cancel-in-progress: true

jobs:
  health:
    name: GitHub Pages corresponde a main V3.1.1
    if: github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Definir expectativa
        run: |
          echo "EXPECTED_SHA=${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_ENV"
          echo "SOURCE_CONCLUSION=${{ github.event.workflow_run.conclusion }}" >> "$GITHUB_ENV"
      - name: Exigir despliegue fuente exitoso
        run: test "$SOURCE_CONCLUSION" = "success"
      - name: Esperar marcador público coherente
        run: |
          set -euo pipefail
          success=0
          for attempt in $(seq 1 12); do
            curl --fail --silent --show-error --location --max-time 20 -H 'Cache-Control: no-cache' "$PUBLIC_BASE/deploy-version.txt?verify=$EXPECTED_SHA&attempt=$attempt" > deploy-version-observed.txt || true
            sha="$(sed -n 's/^release_commit=//p' deploy-version-observed.txt | tr -d '\r')"
            release="$(sed -n 's/^release_version=//p' deploy-version-observed.txt | tr -d '\r')"
            runtime="$(sed -n 's/^version=//p' deploy-version-observed.txt | tr -d '\r')"
            cache="$(sed -n 's/^cache=//p' deploy-version-observed.txt | tr -d '\r')"
            source="$(sed -n 's/^deploy_source=//p' deploy-version-observed.txt | tr -d '\r')"
            mode="$(sed -n 's/^source_mode=//p' deploy-version-observed.txt | tr -d '\r')"
            architecture="$(sed -n 's/^internal_architecture=//p' deploy-version-observed.txt | tr -d '\r')"
            workbench="$(sed -n 's/^finance_workbench=//p' deploy-version-observed.txt | tr -d '\r')"
            if [ "$sha" = "$EXPECTED_SHA" ] && [ "$release" = "$EXPECTED_RELEASE" ] && [ "$runtime" = "$EXPECTED_RUNTIME" ] && [ "$cache" = "$EXPECTED_CACHE" ] && [ "$source" = "main" ] && [ "$mode" = "materialized-no-base64-runtime" ] && [ "$architecture" = "$EXPECTED_ARCHITECTURE" ] && [ "$workbench" = "v3.1.0" ]; then success=1; break; fi
            sleep 5
          done
          test "$success" -eq 1
      - name: Verificar superficie materializada V3.1.1
        run: |
          set -euo pipefail
          for asset in brand-canon-v28.js data-finalize-v28.js app-contract-v28.js preprod-contract-v28.js host-mode.js finance-v27.js procurement-v25.js control-v30.js mfo-v30.js internal-v30.css internal-v31.css access-v31.js internal-shell-v31.js finance-workbench-v31.js finance-starter-v31.js commerce-runtime-config.js; do
            curl --fail --silent --show-error --location --max-time 20 -H 'Cache-Control: no-cache' "$PUBLIC_BASE/assets/$asset?verify=$EXPECTED_SHA" > "public-$asset"
          done
          for asset in data-v28.js app-v28.js preprod-v28.js; do
            curl --fail --silent --show-error --location --max-time 20 -H 'Cache-Control: no-cache' "$PUBLIC_BASE/assets/generated/$asset?verify=$EXPECTED_SHA" > "public-generated-$asset"
          done
          curl --fail --silent --show-error --location --max-time 20 -H 'Cache-Control: no-cache' "$PUBLIC_BASE/assets/generated/manifest-v28.json?verify=$EXPECTED_SHA" > public-generated-manifest-v28.json
          curl --fail --silent --show-error --location --max-time 20 -H 'Cache-Control: no-cache' "$PUBLIC_BASE/materialized-site-v28.json?verify=$EXPECTED_SHA" > public-materialized-site-v28.json
          curl --fail --silent --show-error --location --max-time 20 -H 'Cache-Control: no-cache' "$PUBLIC_BASE/service-worker.js?verify=$EXPECTED_SHA" > public-service-worker.js
          for page in index tienda producto admin activacion acceso centro-interno control operacion finanzas; do curl --fail --silent --show-error --location --max-time 20 -H 'Cache-Control: no-cache' "$PUBLIC_BASE/${page}.html?verify=$EXPECTED_SHA" > "public-${page}.html"; done

          grep -q 'assets/generated/data-v28.js' public-index.html
          grep -q 'assets/generated/app-v28.js' public-index.html
          grep -q 'assets/generated/preprod-v28.js' public-index.html
          ! grep -q 'src="assets/data.js"' public-index.html
          ! grep -q 'src="assets/app.js"' public-index.html
          ! grep -q 'src="assets/preprod.js"' public-index.html
          grep -q 'Fuente materializada de forma determinista' public-generated-data-v28.js
          grep -q 'Fuente materializada de forma determinista' public-generated-app-v28.js
          grep -q 'Fuente materializada de forma determinista' public-generated-preprod-v28.js
          grep -q '"version": "2.8.0"' public-generated-manifest-v28.json
          grep -q '"mode": "materialized-no-base64-runtime"' public-materialized-site-v28.json

          grep -q '· V2.8' public-admin.html
          grep -q 'assets/finance-v27.js' public-admin.html
          grep -q 'assets/procurement-v25.js' public-admin.html

          grep -q 'id="access-v31"' public-acceso.html
          grep -q 'assets/access-v31.js' public-acceso.html
          grep -q 'Elige dónde quieres trabajar.' public-centro-interno.html
          grep -q 'Abrir Panel de control' public-centro-interno.html
          grep -q 'Entrar a Operación' public-centro-interno.html
          grep -q 'Entrar a Finanzas' public-centro-interno.html
          grep -q 'data-v31-protected' public-centro-interno.html
          grep -q 'assets/internal-shell-v31.js' public-centro-interno.html

          grep -q 'Lo que requiere atención, antes de empezar el día.' public-control.html
          grep -q 'data-v31-protected' public-control.html
          grep -q 'assets/internal-shell-v31.js' public-control.html
          grep -q 'Ir a Operación' public-control.html
          grep -q 'Ir a Finanzas' public-control.html
          grep -q 'id="control-v30"' public-control.html

          grep -q 'Del pedido al despacho, con cada decisión visible.' public-operacion.html
          grep -q 'href="control.html"' public-operacion.html
          grep -q 'id="control-v30"' public-operacion.html
          grep -q 'id="daily-ops-v21"' public-operacion.html
          grep -q 'id="production-v22"' public-operacion.html
          grep -q 'id="materials-v23"' public-operacion.html
          grep -q 'id="measurement-v24"' public-operacion.html
          grep -q 'id="procurement-v25"' public-operacion.html
          ! grep -q 'finance-workbench-v31.js' public-operacion.html

          grep -q 'Planificar, modificar, comparar y decidir.' public-finanzas.html
          grep -q 'href="control.html"' public-finanzas.html
          grep -q 'id="finance-workbench-v31"' public-finanzas.html
          grep -q 'assets/finance-workbench-v31.js' public-finanzas.html
          grep -q 'assets/finance-starter-v31.js' public-finanzas.html
          grep -q 'data-v31-protected' public-finanzas.html
          ! grep -q '<script src="assets/production-v22.js"' public-finanzas.html
          ! grep -q '<script src="assets/materials-v23.js"' public-finanzas.html
          ! grep -q '<script src="assets/procurement-v25.js"' public-finanzas.html

          grep -q 'ensureUserAccess' public-host-mode.js
          grep -q "href='acceso.html'" public-host-mode.js
          grep -q '.ee-user-access-link' public-internal-v31.css
          grep -q '.v31-module-card.control' public-internal-v31.css
          grep -q "SNAPSHOT_KEY='ee_v30_mfo_snapshot'" public-finance-workbench-v31.js
          grep -q "WORKING_KEY='ee_v31_finance_working_model'" public-finance-workbench-v31.js
          grep -q 'Ventas · Plan vs. real' public-finance-workbench-v31.js
          grep -q 'Plan de ventas' public-finance-workbench-v31.js
          grep -q 'Escenarios' public-finance-workbench-v31.js
          grep -q 'Crear modelo desde cero' public-finance-starter-v31.js
          grep -q 'LOCAL_STARTER_V31' public-finance-starter-v31.js
          grep -q 'directCost:0' public-finance-starter-v31.js

          grep -q "importScripts('./assets/brand-canon-v28.js')" public-service-worker.js
          grep -q './acceso.html' public-service-worker.js
          grep -q './assets/access-v31.js' public-service-worker.js
          grep -q './assets/internal-shell-v31.js' public-service-worker.js
          grep -q './assets/finance-workbench-v31.js' public-service-worker.js
          grep -q './assets/finance-starter-v31.js' public-service-worker.js
          grep -q './assets/internal-v31.css' public-service-worker.js

          ! grep -qi 'service_role' public-commerce-runtime-config.js
          ! grep -qi 'service_role' public-access-v31.js
          ! grep -qi 'service_role' public-finance-workbench-v31.js
          ! grep -qi 'service_role' public-finance-starter-v31.js
          for script in public-*.js; do node --check "$script"; done
          python3 - <<'PY'
          import json
          generated=json.load(open('public-generated-manifest-v28.json',encoding='utf-8'))
          site=json.load(open('public-materialized-site-v28.json',encoding='utf-8'))
          assert generated['version']=='2.8.0' and len(generated['outputs'])==3
          assert site['mode']=='materialized-no-base64-runtime'
          assert site['contains_source_base64'] is False
          PY
          if curl --fail --silent --location "$PUBLIC_BASE/assets/source/v040-data-001.b64?verify=$EXPECTED_SHA" >/dev/null; then echo 'ERROR: Base64 publicado'; exit 1; fi
          if curl --fail --silent --location "$PUBLIC_BASE/assets/data.js?verify=$EXPECTED_SHA" >/dev/null; then echo 'ERROR: loader heredado publicado'; exit 1; fi
      - name: Verificar WebP HQ críticos
        run: |
          set -euo pipefail
          for image in home-hero home-hero-mobile producto-margherita producto-la-errante evento-hero; do curl --fail --silent --show-error --location --max-time 20 -H 'Cache-Control: no-cache' "$PUBLIC_BASE/assets/images/brand-final/${image}.webp?verify=$EXPECTED_SHA" > "public-${image}.webp"; done
          python3 - <<'PY'
          from pathlib import Path
          for path in Path('.').glob('public-*.webp'):
              data=path.read_bytes(); assert len(data)>100_000; assert data[:4]==b'RIFF' and data[8:12]==b'WEBP'
          assert Path('public-home-hero.webp').read_bytes()!=Path('public-home-hero-mobile.webp').read_bytes()
          PY
      - name: Conservar evidencia ante fallo
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: public-health-${{ github.event.workflow_run.head_sha }}
          path: |
            deploy-version-observed.txt
            public-*.js
            public-*.json
            public-*.html
          retention-days: 14
