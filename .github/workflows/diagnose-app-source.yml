name: Diagnosticar fuente de aplicación

on:
  pull_request:
    branches: ["main"]
    paths:
      - ".github/workflows/diagnose-app-source.yml"
      - "assets/chunks/app-*.txt"
      - "assets/app.js"
  push:
    branches: ["fix/v0.6.7-health-truth"]
    paths:
      - ".github/workflows/diagnose-app-source.yml"
      - "assets/chunks/app-*.txt"
      - "assets/app.js"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    name: Integridad de app.js
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruir estrategias y generar informe
        shell: bash
        run: |
          mkdir -p .app-diagnostic
          python3 - <<'PY'
          from pathlib import Path
          import base64, hashlib, json, re

          root=Path('.')
          names=[f'app-{i:03d}.txt' for i in range(1,9)]
          encoded=[]
          report={'chunks':[], 'strategies':{}}

          for name in names:
              text=(root/'assets/chunks'/name).read_text(encoding='utf-8').strip()
              encoded.append(text)
              invalid=sorted(set(re.sub(r'[A-Za-z0-9+/=]', '', text)))
              report['chunks'].append({
                  'name':name,
                  'base64_chars':len(text),
                  'mod4':len(text)%4,
                  'padding':len(text)-len(text.rstrip('=')),
                  'invalid_characters':invalid,
              })

          def inspect(name, raw):
              item={'bytes':len(raw),'sha256':hashlib.sha256(raw).hexdigest()}
              try:
                  source=raw.decode('utf-8',errors='strict')
                  item['utf8']='valid'
                  item['source_chars']=len(source)
                  item['ellipsis_positions']=[m.start() for m in re.finditer(re.escape('[... ELLIPSIZATION ...]'),source)][:20]
                  (root/f'.app-diagnostic/{name}.js').write_text(source,encoding='utf-8')
              except Exception as error:
                  item['utf8']='invalid'
                  item['error']=repr(error)
                  (root/f'.app-diagnostic/{name}.bin').write_bytes(raw)
              report['strategies'][name]=item

          combined=''.join(encoded)
          try:
              inspect('combined-base64',base64.b64decode(combined + '='*((-len(combined))%4),validate=True))
          except Exception as error:
              report['strategies']['combined-base64']={'decode_error':repr(error)}

          blocks=[]
          errors=[]
          for index,text in enumerate(encoded,1):
              try:
                  blocks.append(base64.b64decode(text + '='*((-len(text))%4),validate=True))
              except Exception as error:
                  errors.append({'chunk':index,'error':repr(error)})
          if errors:
              report['strategies']['per-chunk-padded']={'decode_errors':errors}
          else:
              inspect('per-chunk-padded',b''.join(blocks))

          (root/'.app-diagnostic/report.json').write_text(json.dumps(report,indent=2,ensure_ascii=False),encoding='utf-8')
          lines=['# Diagnóstico de app.js','','## Chunks']
          for item in report['chunks']:
              lines.append(f'- `{item["name"]}`: {item["base64_chars"]} caracteres · mod4 {item["mod4"]} · padding {item["padding"]} · inválidos {item["invalid_characters"]}')
          lines+=['','## Estrategias','```json',json.dumps(report['strategies'],indent=2,ensure_ascii=False),'```']
          (root/'.app-diagnostic/report.md').write_text('\n'.join(lines),encoding='utf-8')
          print((root/'.app-diagnostic/report.md').read_text(encoding='utf-8'))
          PY

      - name: Validar sintaxis de estrategias UTF-8
        if: always()
        shell: bash
        run: |
          set +e
          : > .app-diagnostic/node-check.txt
          for file in .app-diagnostic/*.js; do
            [ -e "$file" ] || continue
            echo "=== $file ===" | tee -a .app-diagnostic/node-check.txt
            node --check "$file" 2>&1 | tee -a .app-diagnostic/node-check.txt
          done
          exit 0

      - name: Conservar diagnóstico
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-source-diagnostic-${{ github.sha }}
          path: .app-diagnostic
          if-no-files-found: error
          retention-days: 14
