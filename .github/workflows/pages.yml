name: Validar y publicar El Errante

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  validate:
    name: Regresión integral
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Ejecutar barrera de regresión integral
        run: python3 verificar_demo.py

  deploy:
    name: Publicar GitHub Pages
    if: github.event_name != 'pull_request'
    needs: validate
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Preparar sitio completo
        shell: bash
        run: |
          mkdir -p _site
          rsync -av ./ _site/ \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude '_site/' \
            --exclude '__pycache__/'
          printf 'EL ERRANTE PUBLIC RELEASE\nversion=0.6.1\ndeploy_source=main\nrelease_commit=%s\ncache=el-errante-v0-6-6\nupdated=%s\n' \
            "$GITHUB_SHA" "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" > _site/deploy-version.txt
          touch _site/.nojekyll

      - name: Verificar versión pública, demo integral y visuales recuperados
        shell: bash
        run: |
          test -f _site/deploy-version.txt
          grep -q 'version=0.6.1' _site/deploy-version.txt
          grep -q 'cache=el-errante-v0-6-6' _site/deploy-version.txt
          grep -q "release_commit=${GITHUB_SHA}" _site/deploy-version.txt
          grep -q 'Masa · Fuego · Territorio' _site/index.html
          test -f _site/assets/products-v6.js
          test -f _site/equipo.html
          test -f _site/admin.html
          test -f _site/control.html
          test -f _site/operacion.html
          test -f _site/studio.html
          test -f _site/presentacion.html
          test -f _site/documentacion/ACCESOS_DEMO.md
          for asset in \
            v040-hero-desktop.svg \
            v040-hero-mobile.svg \
            v040-harina-empaques.svg \
            v040-harina-manos.svg \
            v040-harina-horno.svg \
            v040-manos-masa.svg \
            v040-masa-apertura.svg \
            v040-alveolos.svg \
            v040-fermentacion.svg \
            v040-pizza-neo.svg \
            v040-pizza-errante.svg \
            v040-despensa.svg \
            v040-aplicaciones-empaque.svg \
            v040-pizzeria-movil.svg \
            v040-bitacora-fuego.svg \
            v040-pizzas-artesanales.svg \
            v040-pizzas-coleccion.svg; do
              test -f "_site/assets/images/v040/$asset"
          done
          grep -q 'VISUAL_MAP' _site/assets/host-mode.js
          grep -q 'v040-bitacora-fuego.svg' _site/assets/host-mode.js
          grep -q 'v040-pizzas-coleccion.svg' _site/assets/host-mode.js
          grep -q 'el-errante-v0-6-6' _site/service-worker.js

      - name: Cargar artefacto de Pages
        uses: actions/upload-pages-artifact@v4
        with:
          path: "_site"

      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
