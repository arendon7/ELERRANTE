name: Ajustar confirmación V1.8

on:
  push:
    branches: ["feat/experiencia-compra-v18"]
    paths:
      - ".github/workflows/patch-commerce-v18-success.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    env:
      PATCH_B64: ""
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/experiencia-compra-v18
          fetch-depth: 0
      - name: Aplicar parche
        run: python3 -c "import os,base64;exec(base64.b64decode(os.environ['PATCH_B64']).decode())"
      - name: Validar
        run: |
          node --check assets/commerce-ux-v18.js
          node --check tests/e2e/commerce-v18.spec.js
          python3 scripts/verificar_experiencia_compra_v18.py
      - name: Consolidar
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/commerce-ux-v18.js tests/e2e/commerce-v18.spec.js
          git commit -m 'fix(commerce): protege confirmación posterior al pedido V1.8'
          git push origin HEAD:feat/experiencia-compra-v18
