name: Auditar fuente canónica

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "canonical-${{ github.event.pull_request.number || github.ref }}"
  cancel-in-progress: true

jobs:
  canonical:
    name: Fuente canónica V2.8
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Validar estructura, marca y módulos
        run: |
          python3 verificar_demo.py
          python3 scripts/verificar_canon_marca_v28.py
          python3 scripts/verificar_abastecimiento_v25.py
          node --check assets/brand-canon-v28.js
          node --check assets/data.js
          node --check assets/host-mode.js
          node --check assets/finance-v27.js
          node --check service-worker.js
      - name: Reconstruir fuente efectiva
        run: node scripts/exportar-fuente-canonica.mjs --output=.artifacts/canonical
      - name: Comprobar catálogo estructurado
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          root=Path('.artifacts/canonical')
          data=json.loads((root/'canonical-data.json').read_text(encoding='utf-8'))
          report=json.loads((root/'canonical-report.json').read_text(encoding='utf-8'))
          products=data.get('products',[])
          assert len(products)==11
          assert len({p.get('id') for p in products})==11
          assert all(str(p.get('image','')).startswith('assets/images/brand-final/') for p in products)
          print('products=11')
          print('canonical_json_sha256='+report['canonical_json_sha256'])
          PY
      - name: Conservar artefacto canónico
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fuente-canonica-${{ github.sha }}
          path: .artifacts/canonical
          if-no-files-found: error
          retention-days: 14
