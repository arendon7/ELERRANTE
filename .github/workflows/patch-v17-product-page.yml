name: Ajustar ficha premium V1.7

on:
  push:
    branches: ["feat/contenido-conversion-v17"]
    paths:
      - ".github/workflows/patch-v17-product-page.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/contenido-conversion-v17
          fetch-depth: 0

      - name: Mostrar copy premium en la ficha
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('assets/content-v17.js')
          text = path.read_text(encoding='utf-8')
          marker = "  document.documentElement.dataset.contentVersion='1.7.0';\n})();\n"
          if marker not in text:
              raise SystemExit('No se encontró el cierre de content-v17.js')

          block = r'''  if(location.pathname.endsWith('/producto.html')||location.pathname.endsWith('producto.html')){
    const productId=new URLSearchParams(location.search).get('id');
    const product=list.find(item=>item.id===productId);
    const root=document.querySelector('#dynamic-product');
    const applyProductPremium=()=>{
      if(!root||!product)return;
      const title=root.querySelector('h1');
      if(!title||title.dataset.v17Applied===product.id)return;
      title.dataset.v17Applied=product.id;
      const purchasePanel=title.closest('aside')||title.parentElement;
      const summaryNode=title.nextElementSibling?.matches('p')?title.nextElementSibling:null;
      if(summaryNode)summaryNode.textContent=product.summary;
      const reasonLabel=[...root.querySelectorAll('p')].find(node=>node.textContent.trim()==='Por qué existe');
      const storyHeading=reasonLabel?.nextElementSibling?.matches('h2')?reasonLabel.nextElementSibling:null;
      if(storyHeading){
        storyHeading.textContent=product.headline;
        let promise=storyHeading.nextElementSibling;
        if(!promise||promise.dataset.v17ProductPromise!==product.id){
          promise=document.createElement('p');
          promise.className='lead';
          promise.dataset.v17ProductPromise=product.id;
          storyHeading.insertAdjacentElement('afterend',promise);
        }
        promise.textContent=product.promise;
      }
      document.title=`${product.name} · El Errante`;
      meta('description',product.seo_description||product.summary);
      root.dataset.v17Product=product.id;
    };
    applyProductPremium();
    if(root){
      const observer=new MutationObserver(applyProductPremium);
      observer.observe(root,{childList:true,subtree:true});
      window.addEventListener('pagehide',()=>observer.disconnect(),{once:true});
    }
  }

'''
          path.write_text(text.replace(marker, block + marker), encoding='utf-8')

          validator = Path('scripts/verificar_contenido_v17.py')
          value = validator.read_text(encoding='utf-8')
          needle = '    "dataset.contentVersion=\'1.7.0\'",\n'
          replacement = needle + '    "data-v17-product-promise",\n    "root.dataset.v17Product",\n'
          if needle not in value:
              raise SystemExit('No se encontró marcador en el validador V1.7')
          validator.write_text(value.replace(needle,replacement),encoding='utf-8')
          PY

      - name: Validar ajuste
        shell: bash
        run: |
          node --check assets/content-v17.js
          python3 scripts/verificar_contenido_v17.py

      - name: Consolidar
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/content-v17.js scripts/verificar_contenido_v17.py
          git commit -m 'fix(content): muestra narrativa premium en fichas de producto'
          git push origin HEAD:feat/contenido-conversion-v17
