name: Validar y publicar revisión V2.5

on:
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  actions: write
  pages: write
  id-token: write

concurrency:
  group: "revision-v25-${{ github.event.pull_request.number || github.ref }}"
  cancel-in-progress: true

jobs:
  validate:
    name: Validar release candidata
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      final_sha: ${{ steps.sha.outputs.value }}
    steps:
      - name: Descargar rama V2.5
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Confirmar commit vigente
        id: sha
        shell: bash
        run: |
          set -euo pipefail
          CURRENT="$(git rev-parse HEAD)"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            EXPECTED="${{ github.event.pull_request.head.sha }}"
            test "$CURRENT" = "$EXPECTED"
          fi
          echo "value=$CURRENT" >> "$GITHUB_OUTPUT"

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validar materialización directa
        shell: bash
        run: |
          set -euo pipefail
          node --check assets/procurement-v25.js
          node --check assets/procurement-v25-guard.js
          node --check assets/activation-v25.js
          node --check assets/host-mode.js
          node --check service-worker.js
          python scripts/verificar_abastecimiento_v25.py
          python scripts/verificar_medicion_v24.py
          python scripts/verificar_activacion_v20.py
          grep -q 'id="procurement-v25"' admin.html
          grep -q 'assets/procurement-v25.js' admin.html
          grep -q 'assets/procurement-v25-guard.js' admin.html
          grep -q 'assets/procurement-v25.css' admin.html
          grep -q 'assets/activation-v25.js' activacion.html
          grep -q 'PUBLIC_VERSION="2.5.0"' assets/host-mode.js
          grep -q 'ACTIVE_CACHE="el-errante-v2-5-visual-1"' assets/host-mode.js
          grep -q "const CACHE = 'el-errante-v2-5-visual-1'" service-worker.js
          grep -q 'assets/procurement-v25-guard.js' service-worker.js
          grep -q 'Esta factura o remisión ya fue registrada para la orden.' assets/procurement-v25-guard.js
          grep -q 'version=2.5.0' deploy-version.txt
          grep -q 'cache=el-errante-v2-5-visual-1' deploy-version.txt
          ! grep -qi 'service_role' assets/procurement-v25.js
          ! grep -qi 'postgres://' assets/procurement-v25.js

  preview:
    name: Publicar revisión navegable
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Descargar release candidata
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Confirmar commit validado
        shell: bash
        env:
          EXPECTED_SHA: ${{ needs.validate.outputs.final_sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Preparar revisión pública
        shell: bash
        env:
          FINAL_SHA: ${{ needs.validate.outputs.final_sha }}
        run: |
          set -euo pipefail
          mkdir -p _site
          rsync -av ./ _site/ \
            --exclude '.git/' --exclude '.github/' --exclude '_site/' --exclude '__pycache__/' \
            --exclude '.artifacts/' --exclude 'node_modules/' --exclude 'test-results/' \
            --exclude 'playwright-report/' --exclude 'ELERRANTE_PAQUETE_VISUAL_V1_10.zip'
          python3 - <<'PY'
          import json
          from pathlib import Path
          config={
              'environment':'preview',
              'backend':{
                  'provider':'supabase','url':'','publishableKey':'',
                  'receiptBucket':'payment-receipts',
                  'shopperStorageKey':'ee-shopper-auth-v15',
                  'adminStorageKey':'ee-admin-auth-v15'
              }
          }
          Path('_site/assets/commerce-runtime-config.js').write_text(
              'window.EL_ERRANTE_RUNTIME_CONFIG = Object.freeze(' +
              json.dumps(config,ensure_ascii=False,separators=(',',':')) + ');\n',
              encoding='utf-8'
          )
          PY
          printf 'EL ERRANTE PUBLIC REVIEW\nversion=2.5.0\ndeploy_source=feat/abastecimiento-v25\nrelease_commit=%s\ncache=el-errante-v2-5-visual-1\nupdated=%s\n' \
            "$FINAL_SHA" "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" > _site/deploy-version.txt
          touch _site/.nojekyll

      - name: Verificar revisión publicable
        shell: bash
        env:
          FINAL_SHA: ${{ needs.validate.outputs.final_sha }}
        run: |
          set -euo pipefail
          grep -q "release_commit=${FINAL_SHA}" _site/deploy-version.txt
          grep -q 'id="procurement-v25"' _site/admin.html
          grep -q 'assets/procurement-v25-guard.js' _site/admin.html
          grep -q 'assets/activation-v25.js' _site/activacion.html
          grep -q 'PUBLIC_VERSION="2.5.0"' _site/assets/host-mode.js
          node --check _site/assets/commerce-runtime-config.js
          node --check _site/assets/host-mode.js
          node --check _site/assets/procurement-v25.js
          node --check _site/assets/procurement-v25-guard.js
          node --check _site/assets/activation-v25.js
          node --check _site/service-worker.js
          ! grep -qi 'service_role' _site/assets/commerce-runtime-config.js

      - name: Cargar revisión de Pages
        uses: actions/upload-pages-artifact@v4
        with:
          path: "_site"

      - name: Publicar revisión
        id: deployment
        uses: actions/deploy-pages@v4

  dispatch:
    name: Despachar validaciones finales
    needs: [validate, preview]
    runs-on: ubuntu-latest
    steps:
      - name: Lanzar auditoría y regresión
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          set -euo pipefail
          gh workflow run canonical-audit.yml --ref "$BRANCH"
          gh workflow run functional-regression.yml --ref "$BRANCH"
          gh workflow run pages.yml --ref "$BRANCH"
