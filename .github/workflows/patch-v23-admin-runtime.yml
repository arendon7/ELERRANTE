name: Ajustar runtime administrativo V23

on:
  push:
    branches:
      - feat/materias-primas-inventario-v23
    paths:
      - .github/workflows/patch-v23-admin-runtime.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/materias-primas-inventario-v23
          fetch-depth: 0
      - run: python3 scripts/patch_admin_v23_temp.py
      - run: node --check assets/admin-v15.js
      - run: node --check assets/materials-v23.js
      - run: python3 scripts/verificar_materiales_v23.py
      - run: |
          git config user.name github-actions-bot
          git config user.email github-actions-bot@users.noreply.github.com
          git add assets/admin-v15.js assets/materials-v23.js
          git commit -m "fix admin migrate demo costs and refresh materials V23"
          git push origin HEAD:feat/materias-primas-inventario-v23
