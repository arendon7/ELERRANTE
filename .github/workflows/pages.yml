name: Validar y publicar El Errante

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  validate:
    name: Regresión integral V3.1 candidato
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Materializar fuentes y superficie ejecutable
        run: |
          python3 scripts/materializar_fuentes_locales_v28.py
          python3 scripts/preparar_sitio_materializado_v28.py --output .local_site
      - name: Ejecutar barreras vigentes
        run: |
          python3 verificar_demo.py
          python3 scripts/verificar_canon_marca_v28.py
          python3 scripts/verificar_activos_hq_v28.py
          python3 scripts/verificar_modulos_v28.py
          python3 scripts/verificar_v30_separacion.py
          python3 scripts/verificar_v31_interno.py
          for test in scripts/verificar_oferta_v09.py scripts/verificar_studio_oferta_v09.py scripts/verificar_actas_oferta_v09.py scripts/verificar_paquete_aire_tiempo_v09.py; do python3 "$test"; done
      - name: Validar JavaScript fuente y materializado
        run: |
          find assets -maxdepth 1 -type f -name '*.js' -print0 | xargs -0 -n1 node --check
          find assets/generated -maxdepth 1 -type f -name '*.js' -print0 | xargs -0 -n1 node --check
          find .local_site/assets -maxdepth 1 -type f -name '*.js' -print0 | xargs -0 -n1 node --check
          find .local_site/assets/generated -maxdepth 1 -type f -name '*.js' -print0 | xargs -0 -n1 node --check
          node --check service-worker.js
          node --check .local_site/service-worker.js
          node --check scripts/exportar-fuente-canonica.mjs
          find tests/e2e -maxdepth 1 -type f -name '*.spec.js' -print0 | xargs -0 -n1 node --check
      - name: Reconstruir fuente canónica efectiva
        run: node scripts/exportar-fuente-canonica.mjs --output=.artifacts/canonical
      - name: Conservar auditoría
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fuente-canonica-${{ github.sha }}
          path: |
            .artifacts/canonical
            assets/generated/manifest-v28.json
            .local_site/materialized-site-v28.json
          if-no-files-found: warn
          retention-days: 14

  deploy:
    name: Publicar GitHub Pages V3.0 estable
    if: github.event_name != 'pull_request'
    needs: validate
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Construir superficie materializada
        run: |
          python3 scripts/materializar_fuentes_locales_v28.py
          python3 scripts/preparar_sitio_materializado_v28.py --output _site
      - name: Configurar entorno público
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          set -euo pipefail
          if { [ -n "${SUPABASE_URL:-}" ] && [ -z "${SUPABASE_PUBLISHABLE_KEY:-}" ]; } || { [ -z "${SUPABASE_URL:-}" ] && [ -n "${SUPABASE_PUBLISHABLE_KEY:-}" ]; }; then echo "SUPABASE_URL y SUPABASE_PUBLISHABLE_KEY deben configurarse juntas."; exit 1; fi
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          url=os.environ.get('SUPABASE_URL','').strip(); key=os.environ.get('SUPABASE_PUBLISHABLE_KEY','').strip()
          config={'environment':'connected' if url and key else 'preview','backend':{'provider':'supabase','url':url,'publishableKey':key,'receiptBucket':'payment-receipts','shopperStorageKey':'ee-shopper-auth-v15','adminStorageKey':'ee-admin-auth-v15'}}
          Path('_site/assets/commerce-runtime-config.js').write_text('window.EL_ERRANTE_RUNTIME_CONFIG = Object.freeze('+json.dumps(config,ensure_ascii=False,separators=(',',':'))+');\n',encoding='utf-8')
          PY
          printf 'EL ERRANTE PUBLIC RELEASE\nrelease_version=3.0.0\nversion=2.8.0\ndeploy_source=main\nrelease_commit=%s\ncache=el-errante-v2-8-brand-canon-2\nbrand_source=assets/brand-canon-v28.js\ncontent_source=v2.9-editorial\ninternal_architecture=v3.1-candidate-access-ops-finance\nmfo_bridge=v3.0.1\nsource_mode=materialized-no-base64-runtime\nupdated=%s\n' "$GITHUB_SHA" "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" > _site/deploy-version.txt
          touch _site/.nojekyll
      - name: Verificar artefacto publicable
        run: |
          set -euo pipefail
          grep -q 'release_version=3.0.0' _site/deploy-version.txt
          grep -q 'version=2.8.0' _site/deploy-version.txt
          grep -q 'cache=el-errante-v2-8-brand-canon-2' _site/deploy-version.txt
          grep -q 'internal_architecture=v3.1-candidate-access-ops-finance' _site/deploy-version.txt
          grep -q 'source_mode=materialized-no-base64-runtime' _site/deploy-version.txt
          grep -q "release_commit=${GITHUB_SHA}" _site/deploy-version.txt
          grep -q '"mode": "materialized-no-base64-runtime"' _site/materialized-site-v28.json
          grep -q 'assets/generated/data-v28.js' _site/index.html
          grep -q 'assets/generated/app-v28.js' _site/index.html
          grep -q 'assets/generated/preprod-v28.js' _site/index.html
          ! grep -q 'src="assets/data.js"' _site/index.html
          ! grep -q 'src="assets/app.js"' _site/index.html
          ! grep -q 'src="assets/preprod.js"' _site/index.html
          test ! -e _site/assets/source
          test ! -e _site/assets/chunks
          test ! -e _site/assets/data.js
          test ! -e _site/assets/app.js
          test ! -e _site/assets/preprod.js
          test ! -e _site/archive
          test -s _site/assets/generated/data-v28.js
          test -s _site/assets/generated/app-v28.js
          test -s _site/assets/generated/preprod-v28.js
          grep -q '"version": "2.8.0"' _site/assets/generated/manifest-v28.json
          grep -q '· V2.8' _site/admin.html
          grep -q 'assets/finance-v27.js' _site/admin.html
          grep -q 'assets/procurement-v25.js' _site/admin.html
          test -s _site/acceso.html
          grep -q 'id="access-v31"' _site/acceso.html
          grep -q 'Elige el contexto antes de empezar a trabajar.' _site/centro-interno.html
          grep -q 'id="control-v30"' _site/operacion.html
          grep -q 'id="daily-ops-v21"' _site/operacion.html
          grep -q 'id="finance-workbench-v31"' _site/finanzas.html
          grep -q 'assets/finance-workbench-v31.js' _site/finanzas.html
          grep -q "importScripts('./assets/brand-canon-v28.js')" _site/service-worker.js
          grep -q './assets/access-v31.js' _site/service-worker.js
          grep -q './assets/finance-workbench-v31.js' _site/service-worker.js
          node --check _site/assets/generated/data-v28.js
          node --check _site/assets/generated/app-v28.js
          node --check _site/assets/generated/preprod-v28.js
          node --check _site/assets/data-finalize-v28.js
          node --check _site/assets/app-contract-v28.js
          node --check _site/assets/preprod-contract-v28.js
          node --check _site/assets/control-v30.js
          node --check _site/assets/access-v31.js
          node --check _site/assets/internal-shell-v31.js
          node --check _site/assets/finance-workbench-v31.js
          node --check _site/service-worker.js
          ! grep -qi 'service_role' _site/assets/commerce-runtime-config.js
          test "$(find _site/assets/images/brand-final -maxdepth 1 -name '*.webp' | wc -l)" -ge 23
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
