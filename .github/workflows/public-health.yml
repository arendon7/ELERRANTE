name: Verificar publicación real

on:
  workflow_run:
    workflows: ["Validar y publicar El Errante"]
    types: [completed]

permissions:
  contents: read

env:
  PUBLIC_BASE: https://arendon7.github.io/ELERRANTE
  EXPECTED_CACHE: el-errante-v2-2-0

concurrency:
  group: "public-health-${{ github.event.workflow_run.head_sha }}"
  cancel-in-progress: true

jobs:
  health:
    name: GitHub Pages corresponde a main
    if: github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Definir expectativa
        run: |
          echo "EXPECTED_SHA=${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_ENV"
          echo "SOURCE_CONCLUSION=${{ github.event.workflow_run.conclusion }}" >> "$GITHUB_ENV"
          echo "SOURCE_WORKFLOW_URL=${{ github.event.workflow_run.html_url }}" >> "$GITHUB_ENV"

      - name: Exigir despliegue fuente exitoso
        run: test "$SOURCE_CONCLUSION" = "success"

      - name: Esperar marcador público coherente
        shell: bash
        run: |
          set -euo pipefail
          success=0
          for attempt in $(seq 1 10); do
            curl --fail --silent --show-error --location --max-time 15 -H 'Cache-Control: no-cache' \
              "$PUBLIC_BASE/deploy-version.txt?verify=$EXPECTED_SHA&attempt=$attempt" > deploy-version-observed.txt || true
            observed_sha="$(sed -n 's/^release_commit=//p' deploy-version-observed.txt | tr -d '\r')"
            observed_cache="$(sed -n 's/^cache=//p' deploy-version-observed.txt | tr -d '\r')"
            observed_source="$(sed -n 's/^deploy_source=//p' deploy-version-observed.txt | tr -d '\r')"
            observed_version="$(sed -n 's/^version=//p' deploy-version-observed.txt | tr -d '\r')"
            if [ "$observed_sha" = "$EXPECTED_SHA" ] && [ "$observed_cache" = "$EXPECTED_CACHE" ] && \
               [ "$observed_source" = "main" ] && [ "$observed_version" = "2.2.0" ]; then
              success=1
              echo "Marcador público coherente en el intento $attempt."
              break
            fi
            echo "Intento $attempt: sha=${observed_sha:-vacío}; version=${observed_version:-vacía}; cache=${observed_cache:-vacía}"
            sleep 5
          done
          test "$success" -eq 1

      - name: Descargar y verificar runtime esencial
        shell: bash
        run: |
          set -euo pipefail
          for asset in \
            host-mode.js commerce-runtime-config.js checkout-v15.js admin-v15.js operations-v16.js \
            content-v17.js commerce-ux-v18.js trust-v19.js activation-v20.js daily-ops-v21.js production-v22.js; do
            curl --fail --silent --show-error --location --max-time 15 -H 'Cache-Control: no-cache' \
              "$PUBLIC_BASE/assets/$asset?verify=$EXPECTED_SHA" > "public-$asset"
          done
          for asset in commerce-v18.css trust-v19.css activation-v20.css daily-ops-v21.css production-v22.css; do
            curl --fail --silent --show-error --location --max-time 15 -H 'Cache-Control: no-cache' \
              "$PUBLIC_BASE/assets/$asset?verify=$EXPECTED_SHA" > "public-$asset"
          done
          curl --fail --silent --show-error --location --max-time 15 -H 'Cache-Control: no-cache' \
            "$PUBLIC_BASE/service-worker.js?verify=$EXPECTED_SHA" > public-service-worker.js
          curl --fail --silent --show-error --location --max-time 15 -H 'Cache-Control: no-cache' \
            "$PUBLIC_BASE/backend/supabase/schema-v22.sql?verify=$EXPECTED_SHA" > public-schema-v22.sql
          for script in public-*.js; do node --check "$script"; done
          grep -q 'PUBLIC_VERSION="2.2.0"' public-host-mode.js
          grep -q 'ACTIVE_CACHE="el-errante-v2-2-0"' public-host-mode.js
          grep -q 'el-errante-v2-2-0' public-service-worker.js
          grep -q 'assets/daily-ops-v21.js' public-service-worker.js
          grep -q 'assets/production-v22.js' public-service-worker.js
          grep -q 'assets/production-v22.css' public-service-worker.js
          grep -q 'backend/supabase/schema-v20.sql' public-service-worker.js
          grep -q 'backend/supabase/schema-v21.sql' public-service-worker.js
          grep -q 'backend/supabase/schema-v22.sql' public-service-worker.js
          grep -q 'shopperStorageKey' public-commerce-runtime-config.js
          grep -q 'adminStorageKey' public-commerce-runtime-config.js
          grep -q 'createSignedUrl' public-admin-v15.js
          grep -q 'rpc("is_admin")' public-admin-v15.js
          grep -q 'record_inventory_movement_v16' public-operations-v16.js
          grep -q 'Masa con tiempo. Fuego con carácter.' public-content-v17.js
          grep -q 'Confirma tu pedido con claridad.' public-commerce-ux-v18.js
          grep -q 'lookup_order_status_v19' public-trust-v19.js
          grep -q 'Supabase aún no está conectado' public-activation-v20.js
          grep -q 'activation_health_v20' public-activation-v20.js
          grep -q 'Mesa de pedidos y continuidad local' public-daily-ops-v21.js
          grep -q 'transition_order_v21' public-daily-ops-v21.js
          grep -q 'Agenda de alistamiento por fecha' public-production-v22.js
          grep -q 'save_order_fulfillment_v22' public-production-v22.js
          grep -q 'transition_order_v22' public-production-v22.js
          grep -q 'fulfillment checklist required before dispatch' public-schema-v22.sql
          ! grep -qi 'service_role' public-commerce-runtime-config.js
          ! grep -qi 'service_role' public-admin-v15.js
          ! grep -qi 'service_role' public-production-v22.js
          ! grep -qi 'postgres://' public-production-v22.js

      - name: Verificar superficies públicas críticas
        shell: bash
        run: |
          set -euo pipefail
          for page in index tienda producto historia en-casa en-movimiento checkout cuenta admin activacion; do
            curl --fail --silent --show-error --location --max-time 15 -H 'Cache-Control: no-cache' \
              "$PUBLIC_BASE/${page}.html?verify=$EXPECTED_SHA" > "public-${page}.html"
          done
          assert_contains(){
            local file="$1" marker="$2" label="$3"
            if ! grep -Fq "$marker" "$file"; then
              echo "::error title=Public Health::$label"
              echo "Archivo: $file"
              echo "Marcador esperado: $marker"
              exit 1
            fi
          }
          assert_contains public-index.html 'Masa · Fuego · Territorio' 'Inicio no conserva el claim principal.'
          assert_contains public-tienda.html 'assets/commerce-ux-v18.js' 'Tienda no carga la experiencia de compra.'
          assert_contains public-producto.html 'id="dynamic-product"' 'Producto dinámico no está disponible.'
          assert_contains public-checkout.html 'Compra directa · transferencia bancaria' 'Checkout no conserva la transferencia.'
          assert_contains public-checkout.html 'assets/trust-v19.js' 'Checkout no carga seguimiento.'
          assert_contains public-cuenta.html 'Seguimiento de pedidos' 'Cuenta no ofrece seguimiento.'
          assert_contains public-admin.html 'Operación diaria, producción, despacho y finanzas · V2.2' 'Administración no declara V2.2.'
          assert_contains public-admin.html 'id="daily-ops-v21"' 'Administración no expone la mesa diaria.'
          assert_contains public-admin.html 'id="production-v22"' 'Administración no expone producción V2.2.'
          assert_contains public-admin.html 'assets/production-v22.js' 'Administración no carga producción V2.2.'
          assert_contains public-admin.html 'assets/production-v22.css' 'Administración no carga estilos V2.2.'
          assert_contains public-activacion.html 'Activación V2.2' 'Activación no declara V2.2.'
          assert_contains public-activacion.html 'noindex,nofollow' 'Activación no está excluida de indexación.'
          if grep -Fq 'assets/commerce-v14.js' public-admin.html; then
            echo '::error title=Public Health::Admin conserva runtime legado.'
            exit 1
          fi

      - name: Verificar imágenes WebP HQ críticas
        shell: bash
        run: |
          set -euo pipefail
          for image in home-hero home-hero-mobile producto-margherita evento-hero; do
            curl --fail --silent --show-error --location --max-time 20 -H 'Cache-Control: no-cache' \
              "$PUBLIC_BASE/assets/images/brand-final/${image}.webp?verify=$EXPECTED_SHA" > "public-${image}.webp"
          done
          python3 - <<'PY'
          from pathlib import Path
          for path in Path('.').glob('public-*.webp'):
              data=path.read_bytes()
              assert len(data)>100_000, f'{path} no conserva peso HQ'
              assert data[:4]==b'RIFF' and data[8:12]==b'WEBP', f'{path} no es WebP válido'
          assert Path('public-home-hero.webp').read_bytes()!=Path('public-home-hero-mobile.webp').read_bytes()
          PY

      - name: Generar informe
        if: always()
        shell: bash
        run: |
          {
            echo "EL ERRANTE — PUBLIC HEALTH V2.2.0 PRODUCCIÓN Y DESPACHO"
            echo "source_conclusion=$SOURCE_CONCLUSION"
            echo "source_workflow_url=$SOURCE_WORKFLOW_URL"
            echo "expected_sha=$EXPECTED_SHA"
            echo "expected_cache=$EXPECTED_CACHE"
            echo "public_base=$PUBLIC_BASE"
            echo
            echo "--- deploy-version observado ---"
            cat deploy-version-observed.txt 2>/dev/null || true
          } > public-health-report.txt
          cat public-health-report.txt

      - name: Conservar evidencia únicamente ante fallo
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: public-health-${{ github.event.workflow_run.head_sha }}
          path: |
            public-health-report.txt
            deploy-version-observed.txt
            public-host-mode.js
            public-service-worker.js
            public-commerce-runtime-config.js
            public-admin-v15.js
            public-activation-v20.js
            public-daily-ops-v21.js
            public-production-v22.js
            public-production-v22.css
            public-schema-v22.sql
            public-index.html
            public-tienda.html
            public-producto.html
            public-checkout.html
            public-cuenta.html
            public-admin.html
            public-activacion.html
          retention-days: 14
