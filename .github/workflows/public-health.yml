name: Verificar publicación real

on:
  workflow_run:
    workflows: ["Validar y publicar El Errante"]
    types: [completed]

permissions:
  contents: read

env:
  PUBLIC_BASE: https://arendon7.github.io/ELERRANTE
  EXPECTED_CACHE: el-errante-v2-3-0

concurrency:
  group: "public-health-${{ github.event.workflow_run.head_sha }}"
  cancel-in-progress: true

jobs:
  health:
    name: GitHub Pages corresponde a main
    if: github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Definir expectativa
        run: |
          echo "EXPECTED_SHA=${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_ENV"
          echo "SOURCE_CONCLUSION=${{ github.event.workflow_run.conclusion }}" >> "$GITHUB_ENV"
          echo "SOURCE_WORKFLOW_URL=${{ github.event.workflow_run.html_url }}" >> "$GITHUB_ENV"

      - name: Exigir despliegue fuente exitoso
        run: test "$SOURCE_CONCLUSION" = "success"

      - name: Esperar marcador público coherente
        shell: bash
        run: |
          set -euo pipefail
          success=0
          for attempt in $(seq 1 10); do
            curl --fail --silent --show-error --location --max-time 15 -H 'Cache-Control: no-cache' \
              "$PUBLIC_BASE/deploy-version.txt?verify=$EXPECTED_SHA&attempt=$attempt" > deploy-version-observed.txt || true
            observed_sha="$(sed -n 's/^release_commit=//p' deploy-version-observed.txt | tr -d '\r')"
            observed_cache="$(sed -n 's/^cache=//p' deploy-version-observed.txt | tr -d '\r')"
            observed_source="$(sed -n 's/^deploy_source=//p' deploy-version-observed.txt | tr -d '\r')"
            observed_version="$(sed -n 's/^version=//p' deploy-version-observed.txt | tr -d '\r')"
            if [ "$observed_sha" = "$EXPECTED_SHA" ] && [ "$observed_cache" = "$EXPECTED_CACHE" ] && \
               [ "$observed_source" = "main" ] && [ "$observed_version" = "2.3.0" ]; then
              success=1
              break
            fi
            echo "Intento $attempt: sha=${observed_sha:-vacío}; version=${observed_version:-vacía}; cache=${observed_cache:-vacía}"
            sleep 5
          done
          test "$success" -eq 1

      - name: Descargar y verificar runtime esencial
        shell: bash
        run: |
          set -euo pipefail
          for asset in \
            host-mode.js commerce-runtime-config.js checkout-v15.js admin-v15.js operations-v16.js \
            content-v17.js commerce-ux-v18.js trust-v19.js activation-v20.js activation-v23.js \
            daily-ops-v21.js production-v22.js materials-data-v23.js materials-v23.js; do
            curl --fail --silent --show-error --location --max-time 15 -H 'Cache-Control: no-cache' \
              "$PUBLIC_BASE/assets/$asset?verify=$EXPECTED_SHA" > "public-$asset"
          done
          for asset in commerce-v18.css trust-v19.css activation-v20.css daily-ops-v21.css production-v22.css materials-v23.css; do
            curl --fail --silent --show-error --location --max-time 15 -H 'Cache-Control: no-cache' \
              "$PUBLIC_BASE/assets/$asset?verify=$EXPECTED_SHA" > "public-$asset"
          done
          curl --fail --silent --show-error --location --max-time 15 -H 'Cache-Control: no-cache' \
            "$PUBLIC_BASE/service-worker.js?verify=$EXPECTED_SHA" > public-service-worker.js
          curl --fail --silent --show-error --location --max-time 15 -H 'Cache-Control: no-cache' \
            "$PUBLIC_BASE/backend/supabase/schema-v23.sql?verify=$EXPECTED_SHA" > public-schema-v23.sql
          for script in public-*.js; do node --check "$script"; done
          grep -q 'PUBLIC_VERSION="2.3.0"' public-host-mode.js
          grep -q 'ACTIVE_CACHE="el-errante-v2-3-0"' public-host-mode.js
          grep -q 'el-errante-v2-3-0' public-service-worker.js
          grep -q 'assets/materials-data-v23.js' public-service-worker.js
          grep -q 'assets/materials-v23.js' public-service-worker.js
          grep -q 'assets/materials-v23.css' public-service-worker.js
          grep -q 'assets/activation-v23.js' public-service-worker.js
          grep -q 'backend/supabase/schema-v23.sql' public-service-worker.js
          grep -q 'Lo necesario para producir, sin saturar el panel.' public-materials-v23.js
          grep -q 'Resumen financiero y análisis avanzado' public-materials-v23.js
          grep -q 'EE-CPR-01' public-materials-data-v23.js
          grep -q 'REC-MASA-BASE-V23' public-materials-data-v23.js
          grep -q 'save_material_inventory_v23' public-schema-v23.sql
          grep -q 'material_master' public-schema-v23.sql
          grep -q 'dataset.activationVersion=' public-activation-v23.js
          ! grep -qi 'service_role' public-commerce-runtime-config.js
          ! grep -qi 'service_role' public-materials-v23.js
          ! grep -qi 'postgres://' public-materials-v23.js

      - name: Verificar superficies públicas críticas
        shell: bash
        run: |
          set -euo pipefail
          for page in index tienda producto checkout cuenta admin activacion; do
            curl --fail --silent --show-error --location --max-time 15 -H 'Cache-Control: no-cache' \
              "$PUBLIC_BASE/${page}.html?verify=$EXPECTED_SHA" > "public-${page}.html"
          done
          assert_contains(){
            local file="$1" marker="$2" label="$3"
            grep -Fq "$marker" "$file" || { echo "::error title=Public Health::$label"; exit 1; }
          }
          assert_contains public-index.html 'Masa · Fuego · Territorio' 'Inicio no conserva el claim.'
          assert_contains public-checkout.html 'Compra directa · transferencia bancaria' 'Checkout no conserva transferencia.'
          assert_contains public-cuenta.html 'Seguimiento de pedidos' 'Cuenta no ofrece seguimiento.'
          assert_contains public-admin.html 'Operación diaria, producción, materiales y despacho · V2.3' 'Admin no declara V2.3.'
          assert_contains public-admin.html 'id="materials-v23"' 'Admin no expone materiales V2.3.'
          assert_contains public-admin.html 'assets/materials-data-v23.js' 'Admin no carga maestro V2.3.'
          assert_contains public-admin.html 'assets/materials-v23.js' 'Admin no carga motor V2.3.'
          assert_contains public-admin.html 'assets/materials-v23.css' 'Admin no carga estilos V2.3.'
          assert_contains public-activacion.html 'Activación V2.3' 'Activación no declara V2.3.'
          assert_contains public-activacion.html 'assets/activation-v23.js' 'Activación no carga extensión V2.3.'
          assert_contains public-activacion.html 'noindex,nofollow' 'Activación no está excluida de indexación.'
          if grep -Fq 'assets/commerce-v14.js' public-admin.html; then
            echo '::error title=Public Health::Admin conserva runtime legado.'
            exit 1
          fi

      - name: Verificar imágenes WebP HQ críticas
        shell: bash
        run: |
          set -euo pipefail
          for image in home-hero home-hero-mobile producto-margherita evento-hero; do
            curl --fail --silent --show-error --location --max-time 20 -H 'Cache-Control: no-cache' \
              "$PUBLIC_BASE/assets/images/brand-final/${image}.webp?verify=$EXPECTED_SHA" > "public-${image}.webp"
          done
          python3 - <<'PY'
          from pathlib import Path
          for path in Path('.').glob('public-*.webp'):
              data=path.read_bytes()
              assert len(data)>100_000
              assert data[:4]==b'RIFF' and data[8:12]==b'WEBP'
          assert Path('public-home-hero.webp').read_bytes()!=Path('public-home-hero-mobile.webp').read_bytes()
          PY

      - name: Generar informe
        if: always()
        run: |
          printf 'EL ERRANTE — PUBLIC HEALTH V2.3.0 MATERIAS PRIMAS E INVENTARIO\nsource_conclusion=%s\nexpected_sha=%s\nexpected_cache=%s\npublic_base=%s\n' \
            "$SOURCE_CONCLUSION" "$EXPECTED_SHA" "$EXPECTED_CACHE" "$PUBLIC_BASE" > public-health-report.txt
          cat deploy-version-observed.txt >> public-health-report.txt 2>/dev/null || true
          cat public-health-report.txt

      - name: Conservar evidencia únicamente ante fallo
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: public-health-${{ github.event.workflow_run.head_sha }}
          path: |
            public-health-report.txt
            deploy-version-observed.txt
            public-host-mode.js
            public-service-worker.js
            public-activation-v23.js
            public-materials-data-v23.js
            public-materials-v23.js
            public-materials-v23.css
            public-schema-v23.sql
            public-admin.html
            public-activacion.html
          retention-days: 14