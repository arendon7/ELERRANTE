name: Probar transferencia visual temporal

on:
  push:
    branches: ["feat/v1-3-visuales-hq"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probar URL firmada original
        env:
          SIGNED_URL: "https://media.canva.com/v2/image-resize/format:PNG/height:112/quality:100/uri:ifs%3A%2F%2FM%2F27659d57-cc94-4068-8928-d269efb4e79e/watermark:F/width:200?csig=AAAAAAAAAAAAAAAAAAAAACFpWmKDQSStloXjEQtrtg-GUvyZwtAwurgpOQa35kdG&exp=1785919331&osig=AAAAAAAAAAAAAAAAAAAAANATQPOrlRlem7G_-UtqOEy4u_k4YCpUW-bW3XvsiOZa&signer=media-rpc&x-canva-quality=thumbnail"
        run: |
          curl --fail --location --silent --show-error "$SIGNED_URL" -o signed.png
          file signed.png
          stat --printf='signed_bytes=%s\n' signed.png
      - name: Probar transformación firmada a 1600 px
        continue-on-error: true
        env:
          LARGE_URL: "https://media.canva.com/v2/image-resize/format:AVIF/quality:80/uri:ifs%3A%2F%2FM%2F27659d57-cc94-4068-8928-d269efb4e79e/watermark:F/width:1600?csig=AAAAAAAAAAAAAAAAAAAAACFpWmKDQSStloXjEQtrtg-GUvyZwtAwurgpOQa35kdG&exp=1785919331&osig=AAAAAAAAAAAAAAAAAAAAANATQPOrlRlem7G_-UtqOEy4u_k4YCpUW-bW3XvsiOZa&signer=media-rpc"
        run: |
          curl --fail --location --silent --show-error "$LARGE_URL" -o large.avif
          file large.avif
          stat --printf='large_bytes=%s\n' large.avif
      - name: Probar transformación sin firma
        continue-on-error: true
        env:
          PUBLIC_URL: "https://media.canva.com/v2/image-resize/format:AVIF/quality:80/uri:ifs%3A%2F%2FM%2F27659d57-cc94-4068-8928-d269efb4e79e/watermark:F/width:1600"
        run: |
          curl --fail --location --silent --show-error "$PUBLIC_URL" -o public.avif
          file public.avif
          stat --printf='public_bytes=%s\n' public.avif
