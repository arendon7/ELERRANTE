name: Auditar fuente canónica

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "canonical-${{ github.event.pull_request.number || github.ref }}"
  cancel-in-progress: true

jobs:
  canonical:
    name: Fuente canónica V3.0 · runtime V2.8
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Materializar fuentes legibles V2.8
        run: python3 scripts/materializar_fuentes_locales_v28.py
      - name: Validar estructura, marca y módulos
        run: |
          python3 verificar_demo.py
          python3 scripts/verificar_canon_marca_v28.py
          python3 scripts/verificar_activos_hq_v28.py
          python3 scripts/verificar_modulos_v28.py
          python3 scripts/verificar_v30_separacion.py
          node --check assets/brand-canon-v28.js
          node --check assets/data.js
          node --check assets/app.js
          node --check assets/preprod.js
          node --check assets/generated/data-v28.js
          node --check assets/generated/app-v28.js
          node --check assets/generated/preprod-v28.js
          node --check assets/host-mode.js
          node --check assets/control-v30.js
          node --check assets/mfo-v30.js
          node --check assets/finance-v27.js
          node --check service-worker.js
          node --check scripts/exportar-fuente-canonica.mjs
      - name: Reconstruir fuente efectiva
        run: node scripts/exportar-fuente-canonica.mjs --output=.artifacts/canonical
      - name: Comprobar catálogo estructurado
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          root=Path('.artifacts/canonical')
          data=json.loads((root/'canonical-data.json').read_text(encoding='utf-8'))
          report=json.loads((root/'canonical-report.json').read_text(encoding='utf-8'))
          generated=json.loads(Path('assets/generated/manifest-v28.json').read_text(encoding='utf-8'))
          products=data.get('products',[])
          assert report['version']=='2.8.0'
          assert report['provenance']['brand_canon']=='assets/brand-canon-v28.js'
          assert data.get('brand',{}).get('version')=='2.8.0'
          assert generated['version']=='2.8.0'
          assert len(generated['outputs'])==3
          assert len(products)==11
          assert len({p.get('id') for p in products})==11
          assert all(str(p.get('image','')).startswith('assets/images/brand-final/') for p in products)
          assert all(p.get('brand_asset_version')=='2.8.0' for p in products)
          assert all(p.get('gallery') and all(str(i).startswith('assets/images/brand-final/') for i in p['gallery']) for p in products)
          print('release=3.0.0')
          print('brand_runtime=2.8.0')
          print('products=11')
          print('generated_sources=3')
          print('canonical_json_sha256='+report['canonical_json_sha256'])
          PY
      - name: Conservar artefacto canónico
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fuente-canonica-${{ github.sha }}
          path: |
            .artifacts/canonical
            assets/generated/manifest-v28.json
          if-no-files-found: error
          retention-days: 14
