name: Integrar operación diaria V2.1

on:
  push:
    branches: ["feat/operacion-diaria-v21"]
    paths:
      - ".github/workflows/patch-v21.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/operacion-diaria-v21
          fetch-depth: 0
      - name: Integrar mesa diaria, versionado y barreras
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace(path, old, new, count=None):
              file=Path(path)
              text=file.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'{path} no contiene {old!r}')
              text=text.replace(old,new) if count is None else text.replace(old,new,count)
              file.write_text(text,encoding='utf-8')

          def replace_all(path, pairs):
              for old,new in pairs:
                  replace(path,old,new)

          replace_all('admin.html',[
            ('<link rel="stylesheet" href="assets/trust-v19.css"><link rel="icon"', '<link rel="stylesheet" href="assets/trust-v19.css"><link rel="stylesheet" href="assets/daily-ops-v21.css"><link rel="icon"'),
            ('Activación V2.0','Activación V2.1'),
            ('Operación, finanzas y activación · V2.0','Operación diaria, finanzas y activación · V2.1'),
            ('<span class="demo-badge">Iteración 7</span>','<span class="demo-badge">Iteración 8</span>'),
            ('Antes de recibir pedidos reales, verifica conexión, migraciones y roles en el centro de Activación V2.0.', 'La mesa diaria permite revisar cada solicitud, validar el comprobante y avanzar preparación y entrega. Antes de recibir pedidos reales, verifica conexión, migraciones y roles en Activación V2.1.'),
            ('<div id="admin-dynamic" style="margin-top:18px"></div><div id="operations-v16"></div>', '<div id="admin-dynamic" style="margin-top:18px"></div><div id="daily-ops-v21"></div><div id="operations-v16"></div>'),
            ('<script src="assets/admin-v15.js"></script><script src="assets/operations-v16.js"></script>', '<script src="assets/admin-v15.js"></script><script src="assets/daily-ops-v21.js"></script><script src="assets/operations-v16.js"></script>')
          ])

          replace_all('activacion.html',[
            ('Activación V2.0','Activación V2.1'),
            ('Activación operativa · V2.0','Activación operativa y continuidad · V2.1'),
            ('<span class="demo-badge">Iteración 7</span>','<span class="demo-badge">Iteración 8</span>'),
            ('las migraciones y los datos mínimos','las migraciones, la transición segura de pedidos y los datos mínimos')
          ])

          replace_all('assets/commerce-config-v14.js',[( 'version: "2.0.0"','version: "2.1.0"')])
          replace_all('assets/host-mode.js',[
            ('PUBLIC_VERSION="2.0.0"','PUBLIC_VERSION="2.1.0"'),
            ('ACTIVE_CACHE="el-errante-v2-0-0"','ACTIVE_CACHE="el-errante-v2-1-0"')
          ])
          replace_all('deploy-version.txt',[
            ('version=2.0.0','version=2.1.0'),
            ('cache=el-errante-v2-0-0','cache=el-errante-v2-1-0')
          ])
          replace_all('service-worker.js',[
            ("const CACHE = 'el-errante-v2-0-0';","const CACHE = 'el-errante-v2-1-0';"),
            ("'./assets/trust-v19.js','./assets/activation-v20.js','./assets/host-mode.js'","'./assets/trust-v19.js','./assets/activation-v20.js','./assets/daily-ops-v21.js','./assets/host-mode.js'"),
            ("'./assets/trust-v19.css','./assets/activation-v20.css','./assets/operations-v16.js'","'./assets/trust-v19.css','./assets/activation-v20.css','./assets/daily-ops-v21.css','./assets/operations-v16.js'"),
            ("'./backend/supabase/schema-v19.sql','./backend/supabase/schema-v20.sql'","'./backend/supabase/schema-v19.sql','./backend/supabase/schema-v20.sql','./backend/supabase/schema-v21.sql'")
          ])

          replace_all('assets/activation-v20.js',[
            ('V1.4, V1.5, V1.6, V1.9 y V2.0.','V1.4, V1.5, V1.6, V1.9, V2.0 y V2.1.'),
            ("dataset.activationVersion='2.0.0'","dataset.activationVersion='2.1.0'"),
            ("health?.schema_version==='2.0'","health?.schema_version==='2.1'"),
            ("['1.4','1.5','1.6','1.9','2.0']","['1.4','1.5','1.6','1.9','2.0','2.1']"),
            ("Esquema V2.0","Esquema V2.1"),
            ("La función de diagnóstico responde desde Supabase.","La función de diagnóstico confirma también la transición segura V2.1.")
          ])

          admin=Path('assets/admin-v15.js')
          text=admin.read_text(encoding='utf-8')
          marker='  const APPROVED = new Set(["approved","preparing","dispatched","delivered"]);\n'
          transition='''  const APPROVED = new Set(["approved","preparing","dispatched","delivered"]);\n  const STATUS_TRANSITIONS = {\n    pending_payment:["payment_review","cancelled"],\n    payment_review:["approved","rejected","cancelled"],\n    rejected:["payment_review","cancelled"],\n    approved:["preparing","cancelled"],\n    preparing:["dispatched","approved","cancelled"],\n    dispatched:["delivered","preparing"],\n    delivered:["dispatched"],\n    cancelled:["pending_payment"]\n  };\n'''
          if marker not in text: raise SystemExit('admin-v15: falta marcador STATUS_TRANSITIONS')
          text=text.replace(marker,transition,1)
          old='''  function statusOptions(current){\n    return Object.entries(STATUS_LABELS).map(([value,label])=>`<option value="${value}" ${value===current?"selected":""}>${label}</option>`).join("");\n  }'''
          new='''  function statusOptions(current){\n    const allowed=new Set([current,...(STATUS_TRANSITIONS[current]||[])]);\n    return Object.entries(STATUS_LABELS).filter(([value])=>allowed.has(value)).map(([value,label])=>`<option value="${value}" ${value===current?"selected":""}>${label}</option>`).join("");\n  }'''
          if old not in text: raise SystemExit('admin-v15: falta statusOptions')
          text=text.replace(old,new,1)
          old_local='''          const order = orders.find(item=>item.id===select.dataset.orderStatus);\n          if(order){ order.status=select.value; order.updatedAt=new Date().toISOString(); write(KEYS.orders,orders); renderLocal(container); }\n          return;'''
          new_local='''          const order = orders.find(item=>item.id===select.dataset.orderStatus);\n          if(order){\n            const next=select.value;\n            if(!(STATUS_TRANSITIONS[order.status]||[]).includes(next)){ select.value=order.status; setMessage(container,"Ese cambio de estado no está permitido desde la etapa actual.","error"); return; }\n            if(next==="approved" && !(order.receiptDataUrl||order.receiptPath)){ select.value=order.status; setMessage(container,"No se puede aprobar el pago sin comprobante.","error"); return; }\n            order.status=next; order.updatedAt=new Date().toISOString();\n            order.statusTimeline=Array.isArray(order.statusTimeline)?order.statusTimeline:[];\n            order.statusTimeline.push({status:next,createdAt:order.updatedAt,note:"Estado actualizado desde Administración"});\n            write(KEYS.orders,orders); renderLocal(container);\n          }\n          return;'''
          if old_local not in text: raise SystemExit('admin-v15: falta bloque local')
          text=text.replace(old_local,new_local,1)
          old_remote='''        const update = await client.from("orders").update({status:select.value,updated_at:new Date().toISOString()}).eq("id",select.dataset.orderStatus);\n        if(update.error) throw update.error;\n        const receiptStatus = APPROVED.has(select.value) ? "approved" : select.value==="rejected" ? "rejected" : null;\n        if(receiptStatus){\n          const receipt = await client.from("payment_receipts").update({status:receiptStatus,reviewed_at:new Date().toISOString()}).eq("order_id",select.dataset.orderStatus);\n          if(receipt.error) throw receipt.error;\n        }\n        await renderRemote(container,client,user);'''
          new_remote='''        const update = await client.rpc("transition_order_v21",{p_order_id:select.dataset.orderStatus,p_new_status:select.value,p_note:"Estado actualizado desde Administración"});\n        if(update.error) throw update.error;\n        await renderRemote(container,client,user);'''
          if old_remote not in text: raise SystemExit('admin-v15: falta bloque remoto')
          text=text.replace(old_remote,new_remote,1)
          text=text.replace('Administración V1.5','Administración V2.1')
          text=text.replace('Ejecutar las migraciones V1.4 y V1.5.','Ejecutar las migraciones V1.4, V1.5, V1.6, V1.9, V2.0 y V2.1.')
          admin.write_text(text,encoding='utf-8')

          verifier=Path('scripts/verificar_operacion_diaria_v21.py')
          text=verifier.read_text(encoding='utf-8').replace("require('backend/supabase/schema-v21.sql',\"'2.1.0'\"","require('backend/supabase/schema-v21.sql',\"'2.1'\"")
          verifier.write_text(text,encoding='utf-8')

          versioned_scripts=[
            'scripts/verificar_release_v13.py','scripts/verificar_operacion_v14.py','scripts/verificar_backend_v15.py',
            'scripts/verificar_operacion_v16.py','scripts/verificar_contenido_v17.py','scripts/verificar_experiencia_compra_v18.py',
            'scripts/verificar_confianza_v19.py','scripts/verificar_activacion_v20.py'
          ]
          for path in versioned_scripts:
              file=Path(path); text=file.read_text(encoding='utf-8')
              text=text.replace('2.0.0','2.1.0').replace('el-errante-v2-0-0','el-errante-v2-1-0')
              text=text.replace('Operación, finanzas y activación · V2.0','Operación diaria, finanzas y activación · V2.1')
              text=text.replace('Activación V2.0','Activación V2.1')
              file.write_text(text,encoding='utf-8')

          pages=Path('.github/workflows/pages.yml')
          text=pages.read_text(encoding='utf-8')
          text=text.replace('version=2.0.0','version=2.1.0').replace('el-errante-v2-0-0','el-errante-v2-1-0').replace('PUBLIC_VERSION="2.0.0"','PUBLIC_VERSION="2.1.0"')
          text=text.replace('Operación, finanzas y activación · V2.0','Operación diaria, finanzas y activación · V2.1')
          text=text.replace('      - name: Validar matriz maestra de oferta\n', '      - name: Validar operación diaria V2.1\n        run: python3 scripts/verificar_operacion_diaria_v21.py\n      - name: Validar matriz maestra de oferta\n',1)
          text=text.replace('          node --check assets/activation-v20.js\n', '          node --check assets/activation-v20.js\n          node --check assets/daily-ops-v21.js\n',1)
          text=text.replace('          test -s assets/activation-v20.css\n', '          test -s assets/activation-v20.css\n          test -s assets/daily-ops-v21.css\n',1)
          text=text.replace("          grep -q 'assets/activation-v20.css' _site/service-worker.js\n", "          grep -q 'assets/activation-v20.css' _site/service-worker.js\n          grep -q 'assets/daily-ops-v21.js' _site/service-worker.js\n          grep -q 'assets/daily-ops-v21.css' _site/service-worker.js\n",1)
          text=text.replace("          grep -q 'backend/supabase/schema-v20.sql' _site/service-worker.js\n", "          grep -q 'backend/supabase/schema-v20.sql' _site/service-worker.js\n          grep -q 'backend/supabase/schema-v21.sql' _site/service-worker.js\n",1)
          text=text.replace("          grep -q 'assets/activation-v20.css' _site/activacion.html\n", "          grep -q 'assets/activation-v20.css' _site/activacion.html\n          grep -q 'id=\"daily-ops-v21\"' _site/admin.html\n          grep -q 'assets/daily-ops-v21.js' _site/admin.html\n          grep -q 'assets/daily-ops-v21.css' _site/admin.html\n",1)
          text=text.replace("          grep -q 'ee-v20-checklist' _site/assets/activation-v20.css\n", "          grep -q 'ee-v20-checklist' _site/assets/activation-v20.css\n          grep -q 'Mesa de pedidos y continuidad local' _site/assets/daily-ops-v21.js\n          grep -q 'transition_order_v21' _site/assets/daily-ops-v21.js\n          grep -q 'ee-v21-dialog' _site/assets/daily-ops-v21.css\n",1)
          text=text.replace('          node --check _site/assets/activation-v20.js\n', '          node --check _site/assets/activation-v20.js\n          node --check _site/assets/daily-ops-v21.js\n',1)
          text=text.replace('activation-v20.js commerce-v14.js', 'activation-v20.js daily-ops-v21.js commerce-v14.js')
          text=text.replace('activation-v20.css; do', 'activation-v20.css daily-ops-v21.css; do')
          text=text.replace('          test -f _site/backend/supabase/schema-v20.sql\n', '          test -f _site/backend/supabase/schema-v20.sql\n          test -f _site/backend/supabase/schema-v21.sql\n',1)
          pages.write_text(text,encoding='utf-8')

          canonical=Path('.github/workflows/canonical-audit.yml')
          text=canonical.read_text(encoding='utf-8')
          text=text.replace('      - name: Reconstruir fuente efectiva\n', '      - name: Validar operación diaria V2.1\n        run: python3 scripts/verificar_operacion_diaria_v21.py\n\n      - name: Reconstruir fuente efectiva\n',1)
          canonical.write_text(text,encoding='utf-8')

          health=Path('.github/workflows/public-health.yml')
          text=health.read_text(encoding='utf-8')
          text=text.replace('el-errante-v2-0-0','el-errante-v2-1-0').replace('PUBLIC_VERSION="2.0.0"','PUBLIC_VERSION="2.1.0"')
          text=text.replace('Operación, finanzas y activación · V2.0','Operación diaria, finanzas y activación · V2.1')
          text=text.replace('V2.0.0 ACTIVACIÓN OPERATIVA','V2.1.0 OPERACIÓN DIARIA')
          text=text.replace('activation-v20.js; do','activation-v20.js daily-ops-v21.js; do')
          text=text.replace('activation-v20.css; do','activation-v20.css daily-ops-v21.css; do')
          text=text.replace('          node --check public-activation-v20.js\n','          node --check public-activation-v20.js\n          node --check public-daily-ops-v21.js\n',1)
          text=text.replace("          grep -q 'assets/activation-v20.css' public-service-worker.js\n", "          grep -q 'assets/activation-v20.css' public-service-worker.js\n          grep -q 'assets/daily-ops-v21.js' public-service-worker.js\n          grep -q 'assets/daily-ops-v21.css' public-service-worker.js\n",1)
          text=text.replace("          grep -q 'backend/supabase/schema-v20.sql' public-service-worker.js\n", "          grep -q 'backend/supabase/schema-v20.sql' public-service-worker.js\n          grep -q 'backend/supabase/schema-v21.sql' public-service-worker.js\n",1)
          text=text.replace("          grep -q 'ee-v20-checklist' public-activation-v20.css\n", "          grep -q 'ee-v20-checklist' public-activation-v20.css\n          grep -q 'Mesa de pedidos y continuidad local' public-daily-ops-v21.js\n          grep -q 'transition_order_v21' public-daily-ops-v21.js\n          grep -q 'ee-v21-dialog' public-daily-ops-v21.css\n",1)
          text=text.replace("          ! grep -qi 'postgres://' public-activation-v20.js\n", "          ! grep -qi 'postgres://' public-activation-v20.js\n          ! grep -qi 'service_role' public-daily-ops-v21.js\n          ! grep -qi 'postgres://' public-daily-ops-v21.js\n",1)
          text=text.replace("          assert_contains public-admin.html 'id=\"operations-v16\"' 'Administración no expone el contenedor financiero.'\n", "          assert_contains public-admin.html 'id=\"operations-v16\"' 'Administración no expone el contenedor financiero.'\n          assert_contains public-admin.html 'id=\"daily-ops-v21\"' 'Administración no expone la mesa diaria V2.1.'\n          assert_contains public-admin.html 'assets/daily-ops-v21.js' 'Administración no carga la operación diaria V2.1.'\n          assert_contains public-admin.html 'assets/daily-ops-v21.css' 'Administración no carga los estilos V2.1.'\n",1)
          text=text.replace('            public-activation-v20.css\n','            public-activation-v20.css\n            public-daily-ops-v21.js\n            public-daily-ops-v21.css\n',1)
          health.write_text(text,encoding='utf-8')

          roadmap=Path('documentacion/ROADMAP_OPERACION_COMERCIAL_V14.md')
          text=roadmap.read_text(encoding='utf-8')
          marker='## Iteración 8 — operación diaria V2.1'
          if marker not in text:
              text += '\n\n'+marker+'\n\n- Mesa de pedidos por revisión, preparación, despacho y cierre.\n- Ficha completa de cliente, entrega, productos, pago e historial.\n- Transiciones guiadas y aprobación bloqueada sin comprobante.\n- Exportación CSV operativa sin dirección, teléfono, correo ni comprobante.\n- Respaldo y restauración validados para el modo local previo a Supabase.\n- RPC administrativa que sincroniza estado, comprobante, auditoría e inventario.\n'
              roadmap.write_text(text,encoding='utf-8')
          PY
      - name: Validar integración V2.1
        shell: bash
        run: |
          set -euo pipefail
          node --check assets/daily-ops-v21.js
          node --check assets/admin-v15.js
          node --check assets/activation-v20.js
          node --check assets/host-mode.js
          node --check assets/commerce-config-v14.js
          node --check service-worker.js
          node --check tests/e2e/daily-ops-v21.spec.js
          python3 scripts/verificar_release_v13.py
          python3 scripts/verificar_operacion_v14.py
          python3 scripts/verificar_backend_v15.py
          python3 scripts/verificar_operacion_v16.py
          python3 scripts/verificar_contenido_v17.py
          python3 scripts/verificar_experiencia_compra_v18.py
          python3 scripts/verificar_confianza_v19.py
          python3 scripts/verificar_activacion_v20.py
          python3 scripts/verificar_operacion_diaria_v21.py
      - name: Consolidar V2.1
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add admin.html activacion.html assets/admin-v15.js assets/activation-v20.js assets/commerce-config-v14.js assets/host-mode.js service-worker.js deploy-version.txt scripts .github/workflows/pages.yml .github/workflows/public-health.yml .github/workflows/canonical-audit.yml documentacion/ROADMAP_OPERACION_COMERCIAL_V14.md
          git commit -m 'feat(ops): integra operación diaria y continuidad V2.1'
          git push origin HEAD:feat/operacion-diaria-v21
