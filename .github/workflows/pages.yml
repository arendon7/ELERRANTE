name: Validar y publicar El Errante

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  validate:
    name: Regresión integral
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Materializar fallback visual legado
        run: python3 scripts/materializar_activos_visuales.py

      - name: Ejecutar barreras históricas y operativas
        shell: bash
        run: |
          set -euo pipefail
          for test in \
            scripts/verificar_release_v13.py \
            scripts/verificar_operacion_v14.py \
            scripts/verificar_backend_v15.py \
            scripts/verificar_operacion_v16.py \
            scripts/verificar_contenido_v17.py \
            scripts/verificar_experiencia_compra_v18.py \
            scripts/verificar_confianza_v19.py \
            scripts/verificar_activacion_v20.py \
            scripts/verificar_operacion_diaria_v21.py \
            scripts/verificar_produccion_v22.py \
            scripts/verificar_oferta_v09.py \
            scripts/verificar_studio_oferta_v09.py \
            scripts/verificar_actas_oferta_v09.py \
            scripts/verificar_paquete_aire_tiempo_v09.py; do
            python3 "$test"
          done

      - name: Validar JavaScript, estilos y sistema visual
        shell: bash
        run: |
          set -euo pipefail
          for asset in \
            host-mode.js commerce-v14.js commerce-config-v14.js checkout-v15.js admin-v15.js \
            operations-v16.js content-v17.js commerce-ux-v18.js trust-v19.js activation-v20.js \
            daily-ops-v21.js production-v22.js offer-studio-v09.js offer-governance-v09.js \
            offer-acts-preflight-v09.js offer-acts-v09.js aire-tiempo-committee-v09.js; do
            node --check "assets/$asset"
          done
          node --check service-worker.js
          for asset in commerce-v18.css trust-v19.css activation-v20.css daily-ops-v21.css production-v22.css; do
            test -s "assets/$asset"
          done
          test "$(find assets/images/brand-final -maxdepth 1 -name '*.webp' | wc -l)" -eq 24
          grep -q '"version": "1.3.0"' assets/images/brand-final/manifest-hq-v13.json
          grep -q '"unique_assets": 23' assets/images/brand-final/manifest-hq-v13.json
          ! cmp -s assets/images/brand-final/home-hero.webp assets/images/brand-final/home-hero-mobile.webp

      - name: Reconstruir fuente canónica efectiva
        run: node scripts/exportar-fuente-canonica.mjs --output=.artifacts/canonical

      - name: Publicar fuente o diagnóstico para auditoría
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fuente-canonica-${{ github.sha }}
          path: .artifacts/canonical
          if-no-files-found: warn
          retention-days: 14

  deploy:
    name: Publicar GitHub Pages
    if: github.event_name != 'pull_request'
    needs: validate
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Materializar fallback visual legado
        run: python3 scripts/materializar_activos_visuales.py

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Preparar sitio desde main
        shell: bash
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          set -euo pipefail
          if { [ -n "${SUPABASE_URL:-}" ] && [ -z "${SUPABASE_PUBLISHABLE_KEY:-}" ]; } || \
             { [ -z "${SUPABASE_URL:-}" ] && [ -n "${SUPABASE_PUBLISHABLE_KEY:-}" ]; }; then
            echo "SUPABASE_URL y SUPABASE_PUBLISHABLE_KEY deben configurarse juntas."
            exit 1
          fi
          mkdir -p _site
          rsync -av ./ _site/ \
            --exclude '.git/' --exclude '.github/' --exclude '_site/' --exclude '__pycache__/' \
            --exclude '.artifacts/' --exclude 'node_modules/' --exclude 'test-results/' \
            --exclude 'playwright-report/' --exclude 'ELERRANTE_PAQUETE_VISUAL_V1_10.zip' \
            --exclude 'assets/brand-final-editorial.js' --exclude 'assets/brand-final-products-a.js' \
            --exclude 'assets/brand-final-products-b.js' --exclude 'assets/brand-final-products-c.js'
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          url=os.environ.get('SUPABASE_URL','').strip()
          key=os.environ.get('SUPABASE_PUBLISHABLE_KEY','').strip()
          config={
              'environment':'connected' if url and key else 'preview',
              'backend':{
                  'provider':'supabase','url':url,'publishableKey':key,
                  'receiptBucket':'payment-receipts',
                  'shopperStorageKey':'ee-shopper-auth-v15',
                  'adminStorageKey':'ee-admin-auth-v15'
              }
          }
          Path('_site/assets/commerce-runtime-config.js').write_text(
              'window.EL_ERRANTE_RUNTIME_CONFIG = Object.freeze(' +
              json.dumps(config,ensure_ascii=False,separators=(',',':')) + ');\n',encoding='utf-8')
          PY
          printf 'EL ERRANTE PUBLIC RELEASE\nversion=2.2.0\ndeploy_source=main\nrelease_commit=%s\ncache=el-errante-v2-2-0\nupdated=%s\n' \
            "$GITHUB_SHA" "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" > _site/deploy-version.txt
          touch _site/.nojekyll

      - name: Verificar artefacto publicable
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'version=2.2.0' _site/deploy-version.txt
          grep -q 'cache=el-errante-v2-2-0' _site/deploy-version.txt
          grep -q "release_commit=${GITHUB_SHA}" _site/deploy-version.txt
          grep -q 'Masa · Fuego · Territorio' _site/index.html
          grep -q 'Operación diaria, producción, despacho y finanzas · V2.2' _site/admin.html
          grep -q 'id="daily-ops-v21"' _site/admin.html
          grep -q 'id="production-v22"' _site/admin.html
          grep -q 'assets/production-v22.js' _site/admin.html
          grep -q 'assets/production-v22.css' _site/admin.html
          grep -q 'data-page="activacion"' _site/activacion.html
          grep -q 'Activación V2.2' _site/activacion.html
          grep -q 'el-errante-v2-2-0' _site/service-worker.js
          grep -q 'PUBLIC_VERSION="2.2.0"' _site/assets/host-mode.js
          grep -q 'ACTIVE_CACHE="el-errante-v2-2-0"' _site/assets/host-mode.js
          grep -q 'assets/production-v22.js' _site/service-worker.js
          grep -q 'assets/production-v22.css' _site/service-worker.js
          grep -q 'backend/supabase/schema-v20.sql' _site/service-worker.js
          grep -q 'backend/supabase/schema-v21.sql' _site/service-worker.js
          grep -q 'backend/supabase/schema-v22.sql' _site/service-worker.js
          grep -q 'Agenda de alistamiento por fecha' _site/assets/production-v22.js
          grep -q 'transition_order_v22' _site/assets/production-v22.js
          grep -q 'fulfillment checklist required before dispatch' _site/backend/supabase/schema-v22.sql
          node --check _site/assets/commerce-runtime-config.js
          node --check _site/assets/host-mode.js
          node --check _site/assets/daily-ops-v21.js
          node --check _site/assets/production-v22.js
          node --check _site/service-worker.js
          ! grep -qi 'service_role' _site/assets/commerce-runtime-config.js
          ! grep -qi 'service_role' _site/assets/production-v22.js
          ! grep -qi 'postgres://' _site/assets/production-v22.js
          test "$(find _site/assets/images/brand-final -maxdepth 1 -name '*.webp' | wc -l)" -eq 24
          test -f _site/backend/supabase/schema-v14.sql
          test -f _site/backend/supabase/schema-v15.sql
          test -f _site/backend/supabase/schema-v16.sql
          test -f _site/backend/supabase/schema-v19.sql
          test -f _site/backend/supabase/schema-v20.sql
          test -f _site/backend/supabase/schema-v21.sql
          test -f _site/backend/supabase/schema-v22.sql
          test ! -f _site/ELERRANTE_PAQUETE_VISUAL_V1_10.zip

      - name: Cargar artefacto de Pages
        uses: actions/upload-pages-artifact@v4
        with:
          path: "_site"

      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
