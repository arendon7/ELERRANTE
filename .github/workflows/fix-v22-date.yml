name: Corregir selector V2.2

on:
  push:
    branches: ["feat/produccion-despacho-v22"]

permissions:
  contents: write

jobs:
  corregir:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/produccion-despacho-v22
      - name: Retirar listener duplicado
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path=Path('assets/production-v22.js')
          text=path.read_text(encoding='utf-8')
          old="""      let selected=initialDate(orders);
      host.innerHTML=shellHtml(orders,selected);
      const dateInput=host.querySelector('#ee-v22-date');
      const rerenderDate=()=>{selected=dateInput.value||today();sessionStorage.setItem(DATE_KEY,selected);host.innerHTML=shellHtml(orders,selected);bind(host,orders,selected);};
      dateInput.addEventListener('change',rerenderDate);
      bind(host,orders,selected);"""
          new="""      const selected=initialDate(orders);
      host.innerHTML=shellHtml(orders,selected);
      bind(host,orders,selected);"""
          if old not in text:
              raise SystemExit('No se encontró el bloque duplicado esperado.')
          path.write_text(text.replace(old,new),encoding='utf-8')
          PY
          node --check assets/production-v22.js
          python3 scripts/verificar_produccion_v22.py
      - name: Guardar corrección
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/production-v22.js
          git commit -m "fix(produccion): evita doble render al cambiar fecha"
          git push origin HEAD:feat/produccion-despacho-v22
