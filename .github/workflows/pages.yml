name: Publicar El Errante en GitHub Pages

on:
  push:
    branches: ["main", "fix/v0.5.1-restore-gold-assets"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Preparar sitio público
        shell: bash
        run: |
          mkdir -p _site
          rsync -av ./ _site/ \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude '_site/' \
            --exclude '__pycache__/' \
            --exclude 'documentacion/' \
            --exclude 'docs/' \
            --exclude '*.command' \
            --exclude '*.bat' \
            --exclude '*.py' \
            --exclude '*.zip' \
            --exclude 'admin.html' \
            --exclude 'control.html' \
            --exclude 'operacion.html' \
            --exclude 'studio.html' \
            --exclude 'presentacion.html'
          touch _site/.nojekyll

      - name: Verificar versión pública
        shell: bash
        run: |
          test -f _site/deploy-version.txt
          grep -q 'version=0.6.1' _site/deploy-version.txt
          grep -q 'Masa · Fuego · Territorio' _site/index.html
          test -f _site/assets/products-v6.js

      - name: Cargar artefacto de Pages
        uses: actions/upload-pages-artifact@v4
        with:
          path: "_site"

      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
