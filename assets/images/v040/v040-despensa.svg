<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 390" role="img" aria-labelledby="title desc">
<title id="title">Despensa El Errante</title>
<desc id="desc">Salsa de tomate, reducción balsámica y reducción de panela con maracuyá.</desc>
<rect width="520" height="390" fill="#F2ECE1"/>
<circle cx="455" cy="55" r="72" fill="#C5A36A" opacity=".22"/>
<text x="36" y="54" fill="#191817" font-family="Arial, sans-serif" font-size="24" font-weight="700" letter-spacing="2">DESPENSA EL ERRANTE</text>
<text x="36" y="82" fill="#66645D" font-family="Arial, sans-serif" font-size="13">Salsas y reducciones para completar el último gesto.</text>
<g transform="translate(28 112)">
  <rect width="142" height="228" rx="10" fill="#FFFFFF" opacity=".72"/>
  <image x="8" y="10" width="126" height="164" href="../salsa-tomate-packshot.svg" preserveAspectRatio="xMidYMid meet"/>
  <text x="71" y="198" text-anchor="middle" fill="#191817" font-family="Arial, sans-serif" font-size="12" font-weight="700">SALSA DE TOMATE</text>
</g>
<g transform="translate(189 112)">
  <rect width="142" height="228" rx="10" fill="#FFFFFF" opacity=".72"/>
  <image x="8" y="10" width="126" height="164" href="../balsamica-packshot.svg" preserveAspectRatio="xMidYMid meet"/>
  <text x="71" y="198" text-anchor="middle" fill="#191817" font-family="Arial, sans-serif" font-size="12" font-weight="700">BALSÁMICA</text>
</g>
<g transform="translate(350 112)">
  <rect width="142" height="228" rx="10" fill="#FFFFFF" opacity=".72"/>
  <image x="8" y="10" width="126" height="164" href="../v6-panela-maracuya.svg" preserveAspectRatio="xMidYMid meet"/>
  <text x="71" y="194" text-anchor="middle" fill="#191817" font-family="Arial, sans-serif" font-size="12" font-weight="700">PANELA +</text>
  <text x="71" y="212" text-anchor="middle" fill="#191817" font-family="Arial, sans-serif" font-size="12" font-weight="700">MARACUYÁ</text>
</g>
</svg>
