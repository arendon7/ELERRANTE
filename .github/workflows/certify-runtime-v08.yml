name: Certificar runtime canónico v0.8

on:
  push:
    branches: ["work/v0.8-runtime-canonical"]
    paths:
      - "assets/data.js"
      - "assets/canonical-data.js"
      - "assets/canonical-data.json"
      - "assets/content-v5.js"
      - "service-worker.js"
      - "assets/host-mode.js"
      - "deploy-version.txt"
      - "scripts/**"
      - ".github/workflows/pages.yml"
      - ".github/workflows/canonical-audit.yml"
      - ".github/workflows/certify-runtime-v08.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "certify-runtime-v08"
  cancel-in-progress: true

jobs:
  certify:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar rama
        uses: actions/checkout@v4
        with:
          ref: work/v0.8-runtime-canonical
          fetch-depth: 0

      - name: Regresión integral
        run: python3 verificar_demo.py

      - name: Procedencia de fuentes
        run: python3 scripts/verificar_fuentes.py

      - name: Reconstruir canónico
        run: node scripts/exportar-fuente-canonica.mjs --output=.artifacts/canonical

      - name: Comparar generado y versionado
        run: |
          cmp .artifacts/canonical/canonical-data.js assets/canonical-data.js
          cmp .artifacts/canonical/canonical-data.json assets/canonical-data.json
          cmp .artifacts/canonical/canonical-report.json documentacion/CANONICAL_DATA_REPORT.json

      - name: Validar runtime directo
        run: python3 scripts/verificar_runtime_canonico.py

      - name: Generar certificado determinista
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          data_text = Path('assets/canonical-data.json').read_text(encoding='utf-8')
          data = json.loads(data_text)
          products = data['products']
          counts = {
              'products': len(products),
              'variants': sum(len(p['variants']) for p in products),
              'recipes': len(data['recipes']),
              'articles': len(data['articles']),
              'faqs': len(data['faqs']),
              'coverage': len(data['coverage']),
          }
          cache = next(
              line.split('=', 1)[1]
              for line in Path('deploy-version.txt').read_text(encoding='utf-8').splitlines()
              if line.startswith('cache=')
          )
          sha = hashlib.sha256(data_text.encode('utf-8')).hexdigest()
          content = f'''# Certificado de runtime canónico v0.8

status: `PASS`

## Equivalencia

- Fuente ejecutada: `assets/canonical-data.js`.
- Fuente auditable: `assets/canonical-data.json`.
- SHA-256 JSON: `{sha}`.
- Comparación contra exportador: `BYTE-FOR-BYTE PASS`.
- Chunks truncados en runtime: `NO`.
- Overlay comercial en runtime: `NO`.
- Caché: `{cache}`.

## Conteos

- Productos: {counts['products']}.
- Variantes: {counts['variants']}.
- Recetas: {counts['recipes']}.
- Artículos: {counts['articles']}.
- Preguntas frecuentes: {counts['faqs']}.
- Zonas de cobertura: {counts['coverage']}.

## Barreras ejecutadas

- `python3 verificar_demo.py`: PASS.
- `python3 scripts/verificar_fuentes.py`: PASS.
- `node scripts/exportar-fuente-canonica.mjs`: PASS.
- `python3 scripts/verificar_runtime_canonico.py`: PASS.

Este archivo solo se genera después de superar todas las pruebas anteriores.
'''
          Path('documentacion/RUNTIME_CANONICAL_CERTIFICATE.md').write_text(content, encoding='utf-8')
          PY

      - name: Confirmar certificado en la rama
        run: |
          if git diff --quiet -- documentacion/RUNTIME_CANONICAL_CERTIFICATE.md; then
            echo "El certificado ya está actualizado."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add documentacion/RUNTIME_CANONICAL_CERTIFICATE.md
          git commit -m "test: certifica runtime canónico v0.8"
          git push origin HEAD:work/v0.8-runtime-canonical
