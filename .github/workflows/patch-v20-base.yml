name: Integrar activación operativa V2.0

on:
  push:
    branches: ["feat/activacion-operativa-v20"]
    paths:
      - ".github/workflows/patch-v20-base.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/activacion-operativa-v20
          fetch-depth: 0
      - name: Alinear versión, caché y barreras históricas
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace(path, pairs):
              file=Path(path)
              text=file.read_text(encoding='utf-8')
              original=text
              for old,new in pairs:
                  if old not in text:
                      raise SystemExit(f'{path} no contiene {old!r}')
                  text=text.replace(old,new)
              if text==original:
                  raise SystemExit(f'{path} no cambió')
              file.write_text(text,encoding='utf-8')

          replace('assets/commerce-config-v14.js', [('version: "1.9.0"','version: "2.0.0"')])
          replace('assets/host-mode.js', [
              ('PUBLIC_VERSION="1.9.0"','PUBLIC_VERSION="2.0.0"'),
              ('ACTIVE_CACHE="el-errante-v1-9-0"','ACTIVE_CACHE="el-errante-v2-0-0"'),
              ('new Set(["equipo","admin","control","operacion","studio","actas","presentacion"])','new Set(["equipo","admin","activacion","control","operacion","studio","actas","presentacion"])')
          ])
          replace('service-worker.js', [
              ("const CACHE = 'el-errante-v1-9-0';","const CACHE = 'el-errante-v2-0-0';"),
              ("'./equipo.html','./admin.html','./control.html'","'./equipo.html','./admin.html','./activacion.html','./control.html'"),
              ("'./assets/trust-v19.js','./assets/host-mode.js'","'./assets/trust-v19.js','./assets/activation-v20.js','./assets/host-mode.js'"),
              ("'./assets/trust-v19.css','./assets/operations-v16.js'","'./assets/trust-v19.css','./assets/activation-v20.css','./assets/operations-v16.js'"),
              ("'./backend/supabase/schema-v19.sql','./documentacion/modelo-oferta-v09.json'","'./backend/supabase/schema-v19.sql','./backend/supabase/schema-v20.sql','./documentacion/modelo-oferta-v09.json'")
          ])
          replace('deploy-version.txt', [
              ('version=1.9.0','version=2.0.0'),
              ('cache=el-errante-v1-9-0','cache=el-errante-v2-0-0')
          ])

          for path in (
              'scripts/verificar_release_v13.py',
              'scripts/verificar_operacion_v14.py',
              'scripts/verificar_backend_v15.py',
              'scripts/verificar_operacion_v16.py',
              'scripts/verificar_contenido_v17.py',
              'scripts/verificar_experiencia_compra_v18.py',
              'scripts/verificar_confianza_v19.py',
          ):
              file=Path(path)
              text=file.read_text(encoding='utf-8')
              text=text.replace('PUBLIC_VERSION="1.9.0"','PUBLIC_VERSION="2.0.0"')
              text=text.replace('ACTIVE_CACHE="el-errante-v1-9-0"','ACTIVE_CACHE="el-errante-v2-0-0"')
              text=text.replace('el-errante-v1-9-0','el-errante-v2-0-0')
              text=text.replace('version=1.9.0','version=2.0.0')
              text=text.replace('version: "1.9.0"','version: "2.0.0"')
              text=text.replace('Operación, finanzas y confianza · V1.9','Operación, finanzas y activación · V2.0')
              file.write_text(text,encoding='utf-8')

          roadmap=Path('documentacion/ROADMAP_OPERACION_COMERCIAL_V14.md')
          text=roadmap.read_text(encoding='utf-8')
          marker='## Iteración 7 — activación operativa V2.0'
          if marker not in text:
              text += '\n\n'+marker+'\n\n- Centro privado de diagnóstico de conexión y migraciones.\n- Alta inicial restringida al SQL Editor y gobierno posterior mediante RPC administrativo.\n- Verificación de bucket privado, cobertura, soporte, transferencia, catálogo y gastos fijos.\n- Modo previo explícito: la web no simula conexión ni producción real.\n- Variables de GitHub separadas de credenciales privadas.\n'
              roadmap.write_text(text,encoding='utf-8')
          PY
      - name: Validar integración completa
        shell: bash
        run: |
          node --check assets/activation-v20.js
          node --check assets/commerce-config-v14.js
          node --check assets/host-mode.js
          node --check service-worker.js
          python3 scripts/verificar_release_v13.py
          python3 scripts/verificar_operacion_v14.py
          python3 scripts/verificar_backend_v15.py
          python3 scripts/verificar_operacion_v16.py
          python3 scripts/verificar_contenido_v17.py
          python3 scripts/verificar_experiencia_compra_v18.py
          python3 scripts/verificar_confianza_v19.py
          python3 scripts/verificar_activacion_v20.py
      - name: Consolidar base V2.0
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/commerce-config-v14.js assets/host-mode.js service-worker.js deploy-version.txt scripts documentacion/ROADMAP_OPERACION_COMERCIAL_V14.md
          git commit -m 'feat(activation): integra versión pública y caché V2.0'
          git push origin HEAD:feat/activacion-operativa-v20
