name: Integrar V2.5 abastecimiento

on:
  pull_request:
    branches: ["main"]

permissions:
  contents: write
  actions: write

concurrency:
  group: "integrar-v25-${{ github.event.pull_request.number }}"
  cancel-in-progress: true

jobs:
  integrate:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Descargar rama V2.5
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Confirmar head vigente
        shell: bash
        run: |
          set -euo pipefail
          CURRENT="$(git rev-parse HEAD)"
          EXPECTED="${{ github.event.pull_request.head.sha }}"
          if [ "$CURRENT" != "$EXPECTED" ]; then
            echo "Ejecución obsoleta: evento=$EXPECTED rama=$CURRENT"
            exit 1
          fi

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Aplicar integración determinista
        shell: bash
        run: |
          set -euo pipefail
          python scripts/aplicar_v25.py
          python - <<'PY'
          from pathlib import Path
          path=Path('.github/workflows/pages.yml')
          text=path.read_text(encoding='utf-8')
          old="    if: github.event_name != 'pull_request'"
          new="    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'"
          if text.count(old) != 1:
              raise SystemExit('No se encontró el guard de despliegue esperado en pages.yml')
          path.write_text(text.replace(old,new,1),encoding='utf-8')
          PY

      - name: Validar antes de publicar el commit
        shell: bash
        run: |
          set -euo pipefail
          node --check assets/procurement-v25.js
          node --check assets/activation-v25.js
          node --check tests/e2e/procurement-v25.spec.js
          node --check service-worker.js
          python scripts/verificar_abastecimiento_v25.py
          python scripts/verificar_medicion_v24.py
          python scripts/verificar_activacion_v20.py
          grep -Fq "if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'" .github/workflows/pages.yml

      - name: Retirar herramientas temporales
        shell: bash
        run: git rm scripts/aplicar_v25.py .github/workflows/build-v25.yml

      - name: Publicar integración limpia
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "feat: integra abastecimiento controlado V2.5"
          git push origin HEAD:${{ github.head_ref }}
          echo "Commit integrado: $(git rev-parse HEAD)"

      - name: Despachar validaciones sobre el commit final
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          gh workflow run canonical-audit.yml --ref "$BRANCH"
          gh workflow run functional-regression.yml --ref "$BRANCH"
          gh workflow run pages.yml --ref "$BRANCH"
