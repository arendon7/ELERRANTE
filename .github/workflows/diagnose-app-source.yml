name: Diagnosticar fuente de aplicación

on:
  pull_request:
    branches: ["main"]
    paths:
      - ".github/workflows/diagnose-app-source.yml"
      - "assets/source/v040-app-*.b64"
      - "assets/app.js"
  push:
    branches: ["fix/v0.6.7-health-truth"]
    paths:
      - ".github/workflows/diagnose-app-source.yml"
      - "assets/source/v040-app-*.b64"
      - "assets/app.js"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    name: Integridad de app.js
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruir fuente v0.4
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app-diagnostic
          shopt -s nullglob
          files=(assets/source/v040-app-*.b64)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No existen fuentes v040-app" >&2
            exit 1
          fi
          printf '%s\n' "${files[@]}" | tee app-diagnostic/source-files.txt
          wc -c "${files[@]}" | tee app-diagnostic/source-sizes.txt
          cat "${files[@]}" > app-diagnostic/app-source.b64
          tr -d '\r\n\t ' < app-diagnostic/app-source.b64 | base64 --decode > app-diagnostic/app-reconstructed.js
          sha256sum app-diagnostic/app-source.b64 app-diagnostic/app-reconstructed.js | tee app-diagnostic/hashes.txt
          test "$(sha256sum app-diagnostic/app-reconstructed.js | cut -d' ' -f1)" = "9745984b131f5c1697d0700e5ad7b397e9b2fc17356842804f22bba140fe3e3c"
          test "$(wc -c < app-diagnostic/app-reconstructed.js)" -eq 32630
          ! grep -Fq '[... ELLIPSIZATION ...]' app-diagnostic/app-reconstructed.js

      - name: Validar sintaxis JavaScript
        run: node --check app-diagnostic/app-reconstructed.js

      - name: Conservar diagnóstico
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-source-diagnostic-${{ github.sha }}
          path: app-diagnostic
          if-no-files-found: error
          retention-days: 14
