name: Ajustar release V24

on:
  push:
    branches:
      - feat/medicion-compras-v24
    paths:
      - .github/workflows/patch-release-v24.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/medicion-compras-v24
          fetch-depth: 0
      - run: python3 scripts/patch_release_v24_temp.py
      - run: node --check assets/measurement-v24.js
      - run: node --check assets/activation-v24.js
      - run: node --check assets/host-mode.js
      - run: node --check service-worker.js
      - run: python3 scripts/verificar_medicion_v24.py
      - run: |
          git config user.name github-actions-bot
          git config user.email github-actions-bot@users.noreply.github.com
          git add assets/host-mode.js assets/commerce-config-v14.js assets/admin-v15.js service-worker.js deploy-version.txt scripts/verificar_release_v13.py scripts/verificar_operacion_v14.py scripts/verificar_backend_v15.py scripts/verificar_operacion_v16.py scripts/verificar_contenido_v17.py scripts/verificar_experiencia_compra_v18.py scripts/verificar_confianza_v19.py scripts/verificar_operacion_diaria_v21.py scripts/verificar_produccion_v22.py scripts/verificar_materiales_v23.py
          git commit -m "chore release update public version to V24"
          git push origin HEAD:feat/medicion-compras-v24
