name: Integrar confianza operativa V1.9

on:
  push:
    branches: ["feat/confianza-operativa-v19"]
    paths:
      - ".github/workflows/patch-v19-base.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/confianza-operativa-v19
          fetch-depth: 0
      - name: Alinear versión, configuración y caché
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace(path, pairs):
              file=Path(path)
              text=file.read_text(encoding='utf-8')
              original=text
              for old,new in pairs:
                  if old not in text:
                      raise SystemExit(f'{path} no contiene {old}')
                  text=text.replace(old,new)
              if text==original:
                  raise SystemExit(f'{path} no cambió')
              file.write_text(text,encoding='utf-8')

          replace('assets/commerce-config-v14.js',[
              ('version: "1.8.0"','version: "1.9.0"'),
              ('deliveryPolicy: "Cobertura abierta sujeta a coordinación logística",\n      requireReceipt:', 'deliveryPolicy: "Cobertura abierta sujeta a coordinación logística",\n      deliveryFeePolicy: "La tarifa se confirma según dirección, volumen y alternativa de entrega.",\n      coverageDetails: "Recibimos solicitudes sin rutas ni días fijos. Confirmamos disponibilidad y logística antes de preparar.",\n      supportWhatsapp: "",\n      supportEmail: "",\n      expectedResponseHours: 24,\n      requireReceipt:')
          ])
          replace('assets/host-mode.js',[
              ('PUBLIC_VERSION="1.8.0"','PUBLIC_VERSION="1.9.0"'),
              ('ACTIVE_CACHE="el-errante-v1-8-0"','ACTIVE_CACHE="el-errante-v1-9-0"')
          ])
          replace('service-worker.js',[
              ("const CACHE = 'el-errante-v1-8-0';","const CACHE = 'el-errante-v1-9-0';"),
              ("'./assets/preprod.js','./assets/content-v5.js','./assets/content-v17.js','./assets/commerce-ux-v18.js','./assets/host-mode.js'","'./assets/preprod.js','./assets/content-v5.js','./assets/content-v17.js','./assets/commerce-ux-v18.js','./assets/trust-v19.js','./assets/host-mode.js'"),
              ("'./assets/commerce-v14.js','./assets/commerce-v14.css','./assets/commerce-v15.css','./assets/commerce-v16.css','./assets/commerce-v18.css','./assets/operations-v16.js'","'./assets/commerce-v14.js','./assets/commerce-v14.css','./assets/commerce-v15.css','./assets/commerce-v16.css','./assets/commerce-v18.css','./assets/trust-v19.css','./assets/operations-v16.js'"),
              ("'./documentacion/modelo-oferta-v09.json'","'./backend/supabase/schema-v19.sql','./documentacion/modelo-oferta-v09.json'")
          ])
          replace('deploy-version.txt',[
              ('version=1.8.0','version=1.9.0'),
              ('cache=el-errante-v1-8-0','cache=el-errante-v1-9-0')
          ])

          for path in (
              'scripts/verificar_release_v13.py',
              'scripts/verificar_operacion_v14.py',
              'scripts/verificar_backend_v15.py',
              'scripts/verificar_operacion_v16.py',
          ):
              file=Path(path)
              text=file.read_text(encoding='utf-8')
              text=text.replace('1.8.0','1.9.0').replace('v1-8-0','v1-9-0')
              text=text.replace('Operación y finanzas · V1.6','Operación, finanzas y confianza · V1.9')
              file.write_text(text,encoding='utf-8')

          for path in ('scripts/verificar_contenido_v17.py','scripts/verificar_experiencia_compra_v18.py'):
              file=Path(path)
              text=file.read_text(encoding='utf-8')
              text=text.replace('PUBLIC_VERSION="1.8.0"','PUBLIC_VERSION="1.9.0"')
              text=text.replace('ACTIVE_CACHE="el-errante-v1-8-0"','ACTIVE_CACHE="el-errante-v1-9-0"')
              text=text.replace('"el-errante-v1-8-0"','"el-errante-v1-9-0"')
              text=text.replace('"version=1.8.0"','"version=1.9.0"')
              text=text.replace('"cache=el-errante-v1-8-0"','"cache=el-errante-v1-9-0"')
              file.write_text(text,encoding='utf-8')

          roadmap=Path('documentacion/ROADMAP_OPERACION_COMERCIAL_V14.md')
          text=roadmap.read_text(encoding='utf-8')
          marker='## Iteración 6 — confianza comercial y cierre operativo V1.9'
          if marker not in text:
              text += '\n\n'+marker+'\n\n- Consulta limitada de pedidos por referencia y correo.\n- Historial de estados y trazabilidad en Supabase.\n- Cobertura, tarifa, soporte y tiempo de respuesta configurables.\n- Enlace de seguimiento posterior al checkout.\n- Plantillas de actualización para WhatsApp desde Administración.\n'
              roadmap.write_text(text,encoding='utf-8')
          PY
      - name: Validar base V1.9
        shell: bash
        run: |
          set -euo pipefail
          node --check assets/trust-v19.js
          node --check assets/commerce-config-v14.js
          node --check assets/host-mode.js
          node --check service-worker.js
          python3 scripts/verificar_release_v13.py
          python3 scripts/verificar_operacion_v14.py
          python3 scripts/verificar_backend_v15.py
          python3 scripts/verificar_operacion_v16.py
          python3 scripts/verificar_contenido_v17.py
          python3 scripts/verificar_experiencia_compra_v18.py
          python3 scripts/verificar_confianza_v19.py
      - name: Consolidar
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/commerce-config-v14.js assets/host-mode.js service-worker.js deploy-version.txt scripts documentacion/ROADMAP_OPERACION_COMERCIAL_V14.md
          git commit -m 'feat(trust): integra configuración y caché V1.9'
          git push origin HEAD:feat/confianza-operativa-v19
