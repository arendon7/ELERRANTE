name: Materializar fuente canónica v0.8

on:
  push:
    branches: ["work/v0.8-canonical-direct"]
    paths:
      - "assets/source/**"
      - "assets/products-v6.js"
      - "scripts/exportar-fuente-canonica.mjs"
      - "scripts/verificar_fuentes.py"
      - ".github/workflows/materialize-canonical-v08.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "materialize-canonical-v08"
  cancel-in-progress: true

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar rama
        uses: actions/checkout@v4
        with:
          ref: work/v0.8-canonical-direct
          fetch-depth: 0

      - name: Validar fuentes recuperadas
        run: python3 scripts/verificar_fuentes.py

      - name: Generar fuente canónica
        run: node scripts/exportar-fuente-canonica.mjs --output=.generated/canonical

      - name: Instalar archivos canónicos
        run: |
          cp .generated/canonical/canonical-data.js assets/canonical-data.js
          cp .generated/canonical/canonical-data.json assets/canonical-data.json
          cp .generated/canonical/canonical-report.json documentacion/CANONICAL_DATA_REPORT.json
          cp .generated/canonical/canonical-report.md documentacion/CANONICAL_DATA_REPORT.md
          sha256sum assets/canonical-data.js assets/canonical-data.json > documentacion/CANONICAL_DATA_SHA256.txt

      - name: Verificar estructura materializada
        run: |
          test -s assets/canonical-data.js
          test -s assets/canonical-data.json
          grep -q 'window.EE_DATA=' assets/canonical-data.js
          grep -q '"product_count": 11' documentacion/CANONICAL_DATA_REPORT.json
          grep -q '"variant_count": 14' documentacion/CANONICAL_DATA_REPORT.json
          ! grep -q '\[... ELLIPSIZATION ...\]' assets/canonical-data.js
          ! grep -q '\[... ELLIPSIZATION ...\]' assets/canonical-data.json

      - name: Confirmar cambios en la rama
        run: |
          if git diff --quiet -- assets/canonical-data.js assets/canonical-data.json documentacion/CANONICAL_DATA_REPORT.json documentacion/CANONICAL_DATA_REPORT.md documentacion/CANONICAL_DATA_SHA256.txt; then
            echo "La fuente canónica ya está actualizada."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/canonical-data.js assets/canonical-data.json \
            documentacion/CANONICAL_DATA_REPORT.json \
            documentacion/CANONICAL_DATA_REPORT.md \
            documentacion/CANONICAL_DATA_SHA256.txt
          git commit -m "data: materializa fuente canónica v0.8"
          git push origin HEAD:work/v0.8-canonical-direct
