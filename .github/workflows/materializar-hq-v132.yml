name: Materializar visuales HQ V1.3.2

on:
  push:
    branches: ["feat/visual-hq-direct-v132"]
    paths:
      - "assets/staging-v132/READY"

permissions:
  contents: write

concurrency:
  group: materializar-hq-v132
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Descargar rama
        uses: actions/checkout@v4
        with:
          ref: feat/visual-hq-direct-v132
          fetch-depth: 0

      - name: Materializar colección maestra HQ
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import base64, re

          staging = Path('assets/staging-v132')
          target = Path('assets/images/hq-v132')
          target.mkdir(parents=True, exist_ok=True)

          wrappers = {
              'home-hero.svg': 'home-hero-desktop.avif',
              'home-hero-mobile.svg': 'home-hero-mobile.avif',
              'home-masa-fuego.svg': 'home-masa-fuego.avif',
              'home-fermentacion.svg': 'home-fermentacion.avif',
              'home-ingredientes.svg': 'home-ingredientes.avif',
              'home-en-casa.svg': 'home-en-casa.avif',
          }
          for source_name, output_name in wrappers.items():
              source = (staging / source_name).read_text(encoding='utf-8')
              match = re.search(r'data:image/avif;base64,([^"\']+)', source)
              if not match:
                  raise SystemExit(f'AVIF ausente en {source_name}')
              (target / output_name).write_bytes(base64.b64decode(match.group(1)))

          products = {}
          for source_name in ('products-a.js', 'products-b.js', 'products-c.js'):
              source = (staging / source_name).read_text(encoding='utf-8')
              for key, payload in re.findall(r'"([^"]+)":"data:image/avif;base64,([A-Za-z0-9+/=]+)"', source):
                  products[key] = base64.b64decode(payload)

          product_outputs = {
              'producto-harina': 'producto-harina.avif',
              'producto-crea-tuya': 'producto-crea-tuya.avif',
              'producto-margherita': 'producto-margherita.avif',
              'producto-diavola': 'producto-diavola.avif',
              'producto-bosque': 'producto-bosque.avif',
              'producto-cuatro-quesos': 'producto-cuatro-quesos.avif',
          }
          for key, output_name in product_outputs.items():
              if key not in products:
                  raise SystemExit(f'Activo faltante: {key}')
              (target / output_name).write_bytes(products[key])

          expected = set(wrappers.values()) | set(product_outputs.values())
          actual = {path.name for path in target.glob('*.avif')}
          if actual != expected:
              raise SystemExit(f'Colección inesperada: faltan={expected-actual}; sobran={actual-expected}')
          for path in target.glob('*.avif'):
              data = path.read_bytes()
              if len(data) < 8000 or b'ftypavif' not in data[:32]:
                  raise SystemExit(f'AVIF inválido: {path} ({len(data)} bytes)')
              print(f'{path}: {len(data)} bytes')
          print(f'Colección HQ válida: {len(actual)} archivos.')
          PY

      - name: Eliminar sistema visual anterior y etapa temporal
        shell: bash
        run: |
          set -euo pipefail
          rm -rf assets/staging-v132
          rm -rf assets/images/brand-final
          rm -f assets/brand-final-editorial.js
          rm -f assets/brand-final-products-a.js
          rm -f assets/brand-final-products-b.js
          rm -f assets/brand-final-products-c.js
          rm -f .github/workflows/materializar-hq-v132.yml

      - name: Crear commit binario limpio
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat(visual): materializa colección AVIF HQ V1.3.2'
          git push origin HEAD:feat/visual-hq-direct-v132
