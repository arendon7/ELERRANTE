name: Integrar producción V2.2

on:
  push:
    branches: ["feat/produccion-despacho-v22"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrar:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/produccion-despacho-v22
          fetch-depth: 0
      - name: Integrar superficies y versionado
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path, old, new, required=True):
              p=Path(path)
              text=p.read_text(encoding='utf-8')
              if old not in text:
                  if required:
                      raise SystemExit(f'No se encontró en {path}: {old}')
                  return
              p.write_text(text.replace(old,new),encoding='utf-8')

          admin=Path('admin.html')
          text=admin.read_text(encoding='utf-8')
          text=text.replace('<link rel="stylesheet" href="assets/daily-ops-v21.css">','<link rel="stylesheet" href="assets/daily-ops-v21.css"><link rel="stylesheet" href="assets/production-v22.css">')
          text=text.replace('Activación V2.1','Activación V2.2')
          text=text.replace('Operación diaria, finanzas y activación · V2.1','Operación diaria, producción, despacho y finanzas · V2.2')
          text=text.replace('Iteración 8','Iteración 9')
          text=text.replace('El panel combina pedidos, comprobantes, catálogo, costos, inventario y finanzas con configuración de cobertura, soporte y seguimiento público limitado. La mesa diaria permite revisar cada solicitud, validar el comprobante y avanzar preparación y entrega. Antes de recibir pedidos reales, verifica conexión, migraciones y roles en Activación V2.1. Los valores económicos siguen siendo demostrativos hasta cargar la información real.','El panel combina pedidos, comprobantes, producción, despacho, catálogo, costos, inventario y finanzas. La agenda V2.2 consolida unidades por fecha, conserva el alistamiento de cada pedido y bloquea despachos incompletos. Antes de recibir pedidos reales, verifica conexión, migraciones y roles en Activación V2.2. Los valores económicos siguen siendo demostrativos hasta cargar la información real.')
          text=text.replace('<div id="daily-ops-v21"></div><div id="operations-v16"></div>','<div id="daily-ops-v21"></div><div id="production-v22"></div><div id="operations-v16"></div>')
          text=text.replace('<script src="assets/daily-ops-v21.js"></script><script src="assets/operations-v16.js"></script>','<script src="assets/daily-ops-v21.js"></script><script src="assets/production-v22.js"></script><script src="assets/operations-v16.js"></script>')
          admin.write_text(text,encoding='utf-8')

          activation=Path('activacion.html')
          text=activation.read_text(encoding='utf-8')
          text=text.replace('Activación V2.1','Activación V2.2').replace('continuidad · V2.1','continuidad · V2.2').replace('Iteración 8','Iteración 9')
          text=text.replace('la transición segura de pedidos y los datos mínimos','la transición segura, el alistamiento de producción, el bloqueo de despacho y los datos mínimos')
          activation.write_text(text,encoding='utf-8')

          activation_js=Path('assets/activation-v20.js')
          text=activation_js.read_text(encoding='utf-8')
          text=text.replace('V1.9, V2.0 y V2.1.','V1.9, V2.0, V2.1 y V2.2.')
          text=text.replace("dataset.activationVersion='2.1.0'","dataset.activationVersion='2.2.0'")
          text=text.replace("health?.schema_version==='2.1'","health?.schema_version==='2.2'")
          text=text.replace("'Esquema V2.1','La función de diagnóstico confirma también la transición segura V2.1.'","'Esquema V2.2','El diagnóstico confirma la agenda de producción y el despacho seguro V2.2.'")
          text=text.replace("['1.4','1.5','1.6','1.9','2.0','2.1'].every","['1.4','1.5','1.6','1.9','2.0','2.1','2.2'].every")
          text=text.replace("checklistItem(Boolean(health?.fixed_costs_ready),'Gastos fijos del mes',money(health?.fixed_costs_total))","checklistItem(Boolean(health?.fixed_costs_ready),'Gastos fijos del mes',money(health?.fixed_costs_total)),\n      checklistItem(Boolean(health?.fulfillment_table_ready),'Agenda de producción y despacho',`${Number(health?.fulfillment_rows)||0} pedido(s) con control de alistamiento.`)")
          activation_js.write_text(text,encoding='utf-8')

          host=Path('assets/host-mode.js')
          text=host.read_text(encoding='utf-8').replace('PUBLIC_VERSION="2.1.0"','PUBLIC_VERSION="2.2.0"').replace('ACTIVE_CACHE="el-errante-v2-1-0"','ACTIVE_CACHE="el-errante-v2-2-0"')
          host.write_text(text,encoding='utf-8')

          worker=Path('service-worker.js')
          text=worker.read_text(encoding='utf-8').replace("el-errante-v2-1-0","el-errante-v2-2-0")
          text=text.replace("'./assets/daily-ops-v21.js','./assets/host-mode.js'","'./assets/daily-ops-v21.js','./assets/production-v22.js','./assets/host-mode.js'")
          text=text.replace("'./assets/daily-ops-v21.css','./assets/operations-v16.js'","'./assets/daily-ops-v21.css','./assets/production-v22.css','./assets/operations-v16.js'")
          text=text.replace("'./backend/supabase/schema-v21.sql','./documentacion/modelo-oferta-v09.json'","'./backend/supabase/schema-v21.sql','./backend/supabase/schema-v22.sql','./documentacion/modelo-oferta-v09.json'")
          worker.write_text(text,encoding='utf-8')

          Path('deploy-version.txt').write_text('EL ERRANTE PUBLIC RELEASE\nversion=2.2.0\ndeploy_source=main\nrelease_commit=resolved-by-github-actions\ncache=el-errante-v2-2-0\nupdated=resolved-by-github-actions\n',encoding='utf-8')

          verifier=Path('scripts/verificar_produccion_v22.py')
          text=verifier.read_text(encoding='utf-8').replace("version=require(Path('deploy-version.txt'),'V2.2.0')","version=require(Path('deploy-version.txt'),'version=2.2.0')")
          verifier.write_text(text,encoding='utf-8')

          for path in Path('scripts').glob('verificar_*.py'):
              text=path.read_text(encoding='utf-8')
              text=text.replace('el-errante-v2-1-0','el-errante-v2-2-0')
              text=text.replace('version=2.1.0','version=2.2.0')
              text=text.replace('PUBLIC_VERSION="2.1.0"','PUBLIC_VERSION="2.2.0"')
              text=text.replace('ACTIVE_CACHE="el-errante-v2-1-0"','ACTIVE_CACHE="el-errante-v2-2-0"')
              path.write_text(text,encoding='utf-8')

          roadmap=Path('documentacion/ROADMAP_OPERACION_COMERCIAL_V14.md')
          if roadmap.exists():
              text=roadmap.read_text(encoding='utf-8')
              if 'V2.2 — Producción y despacho' not in text:
                  text+='\n\n## V2.2 — Producción y despacho\n- Agenda por fecha comprometida.\n- Consolidado de unidades por producto.\n- Checklist de producto, empaque, cantidad y coordinación.\n- Bloqueo de despacho incompleto en navegador y Supabase.\n- Lista imprimible y CSV operativo sin datos personales.\n'
              roadmap.write_text(text,encoding='utf-8')
          PY
      - name: Validar JavaScript y barreras
        run: |
          node --check assets/production-v22.js
          python scripts/verificar_produccion_v22.py
          for test in scripts/verificar_release_v13.py scripts/verificar_operacion_v14.py scripts/verificar_backend_v15.py scripts/verificar_operacion_v16.py scripts/verificar_contenido_v17.py scripts/verificar_experiencia_compra_v18.py scripts/verificar_confianza_v19.py scripts/verificar_activacion_v20.py scripts/verificar_operacion_diaria_v21.py; do python "$test"; done
      - name: Guardar integración
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add admin.html activacion.html assets/activation-v20.js assets/host-mode.js service-worker.js deploy-version.txt scripts documentacion/ROADMAP_OPERACION_COMERCIAL_V14.md
          git commit -m "feat: integra producción y despacho V2.2" || exit 0
          git push origin HEAD:feat/produccion-despacho-v22
