name: Publicar El Errante en GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Preparar sitio completo
        shell: bash
        run: |
          mkdir -p _site
          rsync -av ./ _site/ \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude '_site/' \
            --exclude '__pycache__/'
          touch _site/.nojekyll

      - name: Verificar versión pública y demo integral
        shell: bash
        run: |
          test -f _site/deploy-version.txt
          grep -q 'version=0.6.1' _site/deploy-version.txt
          grep -q 'Masa · Fuego · Territorio' _site/index.html
          test -f _site/assets/products-v6.js
          test -f _site/equipo.html
          test -f _site/admin.html
          test -f _site/control.html
          test -f _site/operacion.html
          test -f _site/studio.html
          test -f _site/presentacion.html
          test -f _site/documentacion/ACCESOS_DEMO.md

      - name: Cargar artefacto de Pages
        uses: actions/upload-pages-artifact@v4
        with:
          path: "_site"

      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
