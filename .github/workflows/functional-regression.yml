name: Regresión funcional El Errante

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "functional-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  e2e:
    name: Playwright desktop y móvil V3.1.1
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Preparar superficie materializada
        run: |
          python3 scripts/materializar_fuentes_locales_v28.py
          python3 verificar_demo.py
          python3 scripts/verificar_canon_marca_v28.py
          python3 scripts/verificar_activos_hq_v28.py
          python3 scripts/verificar_modulos_v28.py
          python3 scripts/verificar_v30_separacion.py
          python3 scripts/verificar_v31_interno.py
          python3 scripts/verificar_release_v31.py
          python3 scripts/verificar_piloto_v37.py
          python3 scripts/verificar_finanzas_v351.py
          node --check assets/pilot-operations-v37.js
          node --check assets/finance-usability-v351.js
          node --check tests/e2e/finance-usability-v351.spec.js
          node --check tests/e2e/v4-visual-smoke.spec.js
          python3 scripts/preparar_sitio_materializado_v28.py --output .local_site
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Instalar dependencias
        run: npm install --no-audit --no-fund
      - name: Instalar Chromium
        timeout-minutes: 6
        shell: bash
        run: |
          set +e
          timeout 150s npx playwright install --with-deps chromium
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            echo "::warning::No fue posible completar --with-deps (status=$status). Reintentando sin apt para evitar bloqueo del mirror de Ubuntu."
            npx playwright install chromium
          fi
      - name: Ejecutar regresión funcional
        shell: bash
        run: |
          set +e
          set -o pipefail
          npm run test:e2e -- --reporter=line 2>&1 | tee playwright-console.log
          status=${PIPESTATUS[0]}
          {
            echo "Playwright diagnostic summary"
            echo "commit=${GITHUB_SHA}"
            echo "exit_code=${status}"
            echo
            if [ "$status" -eq 0 ]; then
              echo "=== result ==="
              echo "No failure signals: Playwright passed."
            else
              echo "=== failure signals ==="
              grep -E -B 8 -A 24 '([0-9]+\) |Error:|Expected:|Received:|failed|TimeoutError)' playwright-console.log | tail -n 700 || true
            fi
            echo
            echo "=== final console tail ==="
            tail -n 160 playwright-console.log || true
          } > playwright-failure-summary.txt
          exit "$status"
      - name: Conservar resumen diagnóstico
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-summary-${{ github.sha }}
          path: playwright-failure-summary.txt
          if-no-files-found: warn
          retention-days: 14
      - name: Conservar reporte y evidencias
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ github.sha }}
          path: |
            playwright-report
            test-results
            assets/generated/manifest-v28.json
            .local_site/materialized-site-v28.json
          if-no-files-found: warn
          retention-days: 14
