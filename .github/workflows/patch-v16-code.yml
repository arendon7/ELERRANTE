name: Aplicar código V1.6

on:
  push:
    branches: ["feat/operacion-finanzas-v16"]
    paths:
      - ".github/workflows/patch-v16-code.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar rama
        uses: actions/checkout@v4
        with:
          ref: feat/operacion-finanzas-v16
          fetch-depth: 0
      - name: Aplicar versión y ajustes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          def replace(path, old, new):
              target = Path(path)
              text = target.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'Marcador no encontrado en {path}: {old}')
              target.write_text(text.replace(old,new),encoding='utf-8')

          replace('assets/operations-v16.js',
            'products[productId]={...(products[productId]||{}),inventory:number(base?.inventory)+delta};',
            'products[productId]={...(products[productId]||{}),inventory:number(products[productId]?.inventory ?? base?.inventory)+delta};')
          replace('assets/operations-v16.js',
            'products[item.productId]={...(products[item.productId]||{}),inventory:number(base?.inventory)+(direction*item.quantity)};',
            'products[item.productId]={...(products[item.productId]||{}),inventory:number(products[item.productId]?.inventory ?? base?.inventory)+(direction*item.quantity)};')
          replace('assets/operations-v16.js',
            'const rows=inputs.map(input=>({product_id:input.dataset.v16Threshold,low_stock_threshold:number(input.value),updated_at:new Date().toISOString()}));\n    const result=await client.from("product_operations").upsert(rows,{onConflict:"product_id"});\n    if(result.error) throw result.error;',
            'const results=await Promise.all(inputs.map(input=>client.from("product_operations").update({low_stock_threshold:number(input.value),updated_at:new Date().toISOString()}).eq("product_id",input.dataset.v16Threshold)));\n    const failed=results.find(result=>result.error);\n    if(failed) throw failed.error;')

          replace('assets/commerce-config-v14.js','version: "1.5.0"','version: "1.6.0"')
          replace('service-worker.js',"el-errante-v1-5-0","el-errante-v1-6-0")
          replace('service-worker.js',
            "'./assets/commerce-v14.css','./assets/commerce-v15.css','./assets/control.js'",
            "'./assets/commerce-v14.css','./assets/commerce-v15.css','./assets/commerce-v16.css','./assets/operations-v16.js','./assets/control.js'")
          replace('assets/host-mode.js','PUBLIC_VERSION="1.5.0"','PUBLIC_VERSION="1.6.0"')
          replace('assets/host-mode.js','ACTIVE_CACHE="el-errante-v1-5-0"','ACTIVE_CACHE="el-errante-v1-6-0"')

          for path in ['scripts/verificar_release_v13.py','scripts/verificar_operacion_v14.py','scripts/verificar_backend_v15.py']:
              target=Path(path)
              text=target.read_text(encoding='utf-8')
              text=text.replace('1.5.0','1.6.0').replace('el-errante-v1-5-0','el-errante-v1-6-0')
              text=text.replace('Backend y acceso privado · V1.5','Operación y finanzas · V1.6')
              target.write_text(text,encoding='utf-8')

          deploy=Path('deploy-version.txt')
          text=deploy.read_text(encoding='utf-8')
          text=re.sub(r'^version=.*$','version=1.6.0',text,flags=re.MULTILINE)
          text=re.sub(r'^cache=.*$','cache=el-errante-v1-6-0',text,flags=re.MULTILINE)
          deploy.write_text(text,encoding='utf-8')

          roadmap=Path('documentacion/ROADMAP_OPERACION_COMERCIAL_V14.md')
          text=roadmap.read_text(encoding='utf-8')
          status=(
              '\n\n## Estado de avance — V1.6 / Iteración 3\n\n'
              'Implementado en código:\n\n'
              '- Kardex básico de inventario con entradas, salidas, producción, compras, ajustes y mermas.\n'
              '- Descuento automático al iniciar preparación y reintegro al volver a un estado no operativo.\n'
              '- Ciclos idempotentes para impedir descuentos duplicados por pedido.\n'
              '- Umbral de inventario bajo por producto y alertas operativas.\n'
              '- Margen de contribución por producto y consolidado mensual.\n'
              '- Resultado operativo: ventas aprobadas menos costos variables y gastos fijos.\n'
              '- Ventas y unidades de punto de equilibrio estimadas.\n'
              '- Registro manual de movimientos en modo local y mediante RPC segura en Supabase.\n\n'
              'Los precios, costos, inventarios y gastos continúan siendo demostrativos hasta recibir la base real.\n'
          )
          if '## Estado de avance — V1.6 / Iteración 3' not in text:
              roadmap.write_text(text.rstrip()+status,encoding='utf-8')
          PY
      - name: Validar código V1.6
        shell: bash
        run: |
          set -euo pipefail
          node --check assets/operations-v16.js
          node --check assets/admin-v15.js
          node --check assets/host-mode.js
          node --check service-worker.js
          python3 scripts/verificar_operacion_v16.py
      - name: Consolidar cambios
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add assets/operations-v16.js assets/commerce-config-v14.js service-worker.js assets/host-mode.js scripts/verificar_release_v13.py scripts/verificar_operacion_v14.py scripts/verificar_backend_v15.py deploy-version.txt documentacion/ROADMAP_OPERACION_COMERCIAL_V14.md
          git commit -m "chore(release): consolida operación y finanzas V1.6"
          git push origin HEAD:feat/operacion-finanzas-v16
